name: Deploy Homepage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: silence_digital_nexus_deploy/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: silence_digital_nexus_deploy
        run: pnpm install --frozen-lockfile

      - name: Build homepage
        working-directory: silence_digital_nexus_deploy
        run: pnpm build

      - name: Add root-level pages
        # 网站只用这一套部署（Pages 来源 = GitHub Actions）。仓库根目录里另有几样要上线的东西：
        # 小游戏 sheep-match、旧版 snake.html、IWS 心跳徽章（heartbeat.json 由本机 iws/scripts/heartbeat_export.py 写在根目录）、
        # 供应商图谱数据 supplier-graph.json（本机脱敏导出，/iws-graph/ 页面读取）。
        # 构建完把它们放进网站，并把徽章挂到首页上。
        run: |
          OUT=silence_digital_nexus_deploy/dist/public
          for p in sheep-match snake.html heartbeat.js heartbeat.json supplier-graph.json; do
            if [ -e "$p" ]; then cp -R "$p" "$OUT/"; fi
          done
          if [ -f "$OUT/heartbeat.js" ] && ! grep -q 'heartbeat.js' "$OUT/index.html"; then
            sed -i 's#</head>#  <script defer src="/heartbeat.js"></script>\n  </head>#' "$OUT/index.html"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: silence_digital_nexus_deploy/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
