  g.fillStyle = '#fbf8ef'; for (let x = 6; x < 22; x += 4) { g.beginPath(); g.moveTo(x, 3); g.lineTo(x + 1.5, 6); g.lineTo(x + 3, 3); g.fill(); }
  g.fillStyle = '#f3d36a'; g.beginPath(); g.ellipse(5, -5, 3.6, 2.6, -0.2, 0, TAU); g.fill();                  // 目
  g.fillStyle = '#111'; g.beginPath(); g.arc(6, -5, 1.4, 0, TAU); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(6.6, -5.6, 0.5, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(196,70,44,.95)'; g.lineWidth = 2; g.beginPath(); g.moveTo(-2, -9); g.quadraticCurveTo(5, -13, 12, -9); g.stroke();
  g.strokeStyle = 'rgba(30,30,28,.85)'; g.lineWidth = 1;                         // 须
  const w1 = Math.sin(t * 3) * 7, w2 = Math.sin(t * 3 + 1.5) * 7;
  g.beginPath(); g.moveTo(26, -3); g.bezierCurveTo(18, -22 + w1, -10, -6 - w1, -46, -14 + w2); g.stroke();
  g.beginPath(); g.moveTo(24, 2); g.bezierCurveTo(14, 20 + w2, -14, 6 - w2, -44, 18 + w1); g.stroke();
  g.restore();
}

D.drawPearl = g => {                                                              // 火珠，在“发光层”里画
  if (!D.active) return;
  const [x, y] = D.pearl, t = S.t;
  g.save(); g.globalCompositeOperation = 'lighter';
  g.drawImage(SH.softDot([255, 190, 90], 64), x - 60, y - 60, 120, 120);
  for (let k = 0; k < 3; k++) {
    const a = t * 4 + k * TAU / 3;
    g.strokeStyle = 'rgba(255,140,60,.8)'; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * 16, y + Math.sin(a) * 16, x + Math.cos(a + 0.9) * 22, y + Math.sin(a + 0.9) * 22 - 4); g.stroke();
  }
  g.drawImage(SH.softDot([255, 250, 230], 32), x - 14, y - 14, 28, 28);
  g.restore();
};
})();

<script>
'use strict';
/* 山河长卷 · audio —— 琴是一根数学的弦（Karplus-Strong）：一段噪声在环形缓冲里来回平均，就成了弦的振动。

(() => {
const S = SH.S, TAU = SH.TAU;

let ctx, master, qin, amb, verb, analyser, noiseBuf, wind, windF, rainG, waterG, insectG, wave;
const ksCache = new Map(), mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const GONG = 53, MODE = [0, 7, 2, 9], PCS = [0, 2, 4, 7, 9];         // F 宫；春宫 夏徵 秋商 冬羽
const scale = []; for (let m = 36; m <= 96; m++) if (PCS.includes(((m - GONG) % 12 + 12) % 12)) scale.push(m);
const rnd = (a, b) => a + Math.random() * (b - a);

function ks(m) {
  if (ksCache.has(m)) return ksCache.get(m);
  const sr = ctx.sampleRate, f = mtof(m), dur = SH.clamp(5.2 - (m - 40) * 0.07, 1.8, 5), n = Math.floor(sr * dur);
  const N = Math.max(2, Math.floor(sr / f - 0.5)), fa = sr / (N + 0.5), ring = new Float32Array(N), out = new Float32Array(n);
  let lp = 0, mean = 0;
  for (let i = 0; i < N; i++) { lp += (Math.random() * 2 - 1 - lp) * 0.42; ring[i] = lp; mean += lp; }
  mean /= N; for (let i = 0; i < N; i++) ring[i] -= mean;
  const rho = Math.pow(0.001, 1 / (fa * dur * 0.95));
  for (let i = 0, k = 0; i < n; i++) {
    const a = ring[k], b = ring[(k + 1) % N];

  const sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);

}

  const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

  analyser = ctx.createAnalyser(); analyser.fftSize = 1024; wave = new Float32Array(analyser.fftSize);
  master.connect(comp).connect(analyser).connect(ctx.destination);

  const body = ctx.createBiquadFilter(); body.type = 'peaking'; body.frequency.value = 280; body.gain.value = 4; body.Q.value = 0.9;
  const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 2600; tone.Q.value = 0.5;

<script>
'use strict';
/* 山河长卷 · poems —— 画会“看”自己：此刻是什么季节、什么时辰、画里有没有瀑布和月亮，就吟哪一首。 */
(() => {
const S = SH.S;
// 诗库在 data-poems.js（tools/make_poems.py 从开源诗词库生成）。每首带场景配方：s 季节（0春1夏2秋3冬），d 时辰，need 画里得先有的东西，p 吟诗时画里出现的东西，f 节日
const POEMS = SH.DB.poems;
const P = SH.poems = { list: POEMS, cur: null, timer: 14, recent: [] };
const el = document.getElementById('poem');

const tod = P.tod = () => { const L = SH.light(S.tod); return L.night > 0.6 ? 'night' : L.twilight > 0.45 ? (S.tod < 0.5 ? 'dawn' : 'dusk') : 'day'; };
function has(need) {
  if (need === 'moon') return !!SH.sky.moon;
  if (need === 'rain') return S.raining > 0.3;
  if (need === 'sail') return SH.life.boats.some(b => b.type === 'sail' && SH.toSX(b.X, 1) > 0 && SH.toSX(b.X, 1) < S.vw);
  if (need === 'fall') return SH.terrain.visible(2).some(ch => ch.falls.some(f => { const x = SH.toSX(f[0], SH.LAYERS[2].p); return x > S.vw * 0.1 && x < S.vw * 0.9; }));
  return true;
}
P.pick = () => {
  const d = tod(); let best = null, bs = -1e9;
  for (const p of POEMS) {
    if (P.recent.includes(p)) continue;
    if (p.s && !p.s.includes(S.season)) continue;
    if (p.need && !has(p.need)) continue;
    let sc = Math.random() * 1.5 + (p.s ? 2 : 0) + (p.need ? 6 : 0) + (p.f && SH.director && p.f === SH.director.today ? 8 : 0);   // 过节那天先吟节日诗
    if (p.d) sc += p.d.includes(d) ? 2.5 : -4;
    if (sc > bs) { bs = sc; best = p; }
  }
  return best || POEMS.find(p => p.t === '静夜思') || POEMS[0];
};

// opt.from：从第几句起显示（念到哪句就从那一联起）；opt.hl：标红哪一句；opt.quiet：不叫画中物出场
P.show = (p = P.pick(), opt = {}) => {
  P.cur = p; P.recent.push(p); if (P.recent.length > 12) P.recent.shift();
  P.timer = 55 + Math.random() * 25;
  // 放在山矮的那一侧天空
  const sideSky = f => { let m = 900; for (let x = S.vw * f; x < S.vw * (f + 0.22); x += 40) m = Math.min(m, SH.terrain.top(2, x - S.cam * SH.LAYERS[2].p), SH.terrain.top(3, x - S.cam * SH.LAYERS[3].p)); return m; };
  const right = sideSky(0.74) >= sideSky(0.04);
  el.innerHTML = ''; el.style.opacity = '1';
  el.style.top = '9vh'; el.style.left = right ? '' : '5vw'; el.style.right = right ? '6vw' : '';
  const chars = [], max = innerWidth < 640 ? 4 : 8, f = opt.from || 0, from = Math.max(0, Math.min(f - f % 2, p.l.length - max));   // 长诗只显示一段：手机 4 句，电脑 8 句
  p.l.slice(from, from + max).forEach((line, i) => { const c = document.createElement('div'); c.className = 'col' + (from + i === opt.hl ? ' hl' : ''); [...line].forEach(ch => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch; c.appendChild(s); chars.push(s); }); el.appendChild(c); });
  const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `${p.t} · ${p.a}`; el.appendChild(meta);
  const seal = document.createElement('div'); seal.className = 'pseal'; seal.textContent = S.name || '长卷'; el.appendChild(seal);
  chars.forEach((s, i) => setTimeout(() => s.classList.add('v'), 300 + i * 190));
  setTimeout(() => seal.classList.add('v'), 600 + chars.length * 190);
  clearTimeout(P.hideT); P.hideT = setTimeout(() => { el.style.opacity = '0'; setTimeout(() => { if (el.style.opacity === '0') { el.innerHTML = ''; P.cur = null; } }, 2100); }, 15000 + chars.length * 190);
  SH.audio && SH.audio.poem();
  if (!opt.quiet && SH.director) SH.director.cue(p);                               // 诗里写到的东西，一样样出场（见 director.js）
  return p;
};
P.update = dt => { P.timer -= dt; if (P.timer <= 0 && !P.cur) P.show(); else if (P.timer <= 0) P.timer = 8; };

// 截图时把诗也“写”进画里：直接照着屏幕上每个字的位置描
P.drawTo = (g, sx, sy) => {
  if (!P.cur) return;
  const dark = document.body.classList.contains('dark');
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const s of el.querySelectorAll('.ch.v')) {
    const r = s.getBoundingClientRect();
    g.font = `${r.width * sx * 0.92}px ${SH.KAI}`; g.fillStyle = dark ? '#ece3cd' : '#2a241c';
    g.fillText(s.textContent, (r.left + r.width / 2) * sx, (r.top + r.height / 2) * sy);
  }
  const col = (node, color, bg) => {                                              // 竖排一列：按高度均分逐字描
    const r = node.getBoundingClientRect(), cs = [...node.textContent], st = r.height / cs.length;
    if (bg) { g.fillStyle = bg; g.fillRect(r.left * sx, r.top * sy, r.width * sx, r.height * sy); }
    g.font = `${parseFloat(getComputedStyle(node).fontSize) * sx}px ${SH.KAI}`; g.fillStyle = color;
    cs.forEach((c, i) => g.fillText(c, (r.left + r.width / 2) * sx, (r.top + (i + 0.5) * st) * sy));
  };
  const meta = el.querySelector('.meta'), seal = el.querySelector('.pseal.v');
  if (meta) col(meta, dark ? '#c9bea6' : '#5a4e40');
  if (seal) col(seal, '#f8e8da', '#b5352b');
  g.restore();
};

// ---------- 印：阴文朱印，边缘做旧 ----------
// ---------- 点画中物：月亮、渔舟、帆、瀑布、人家，各从诗库里挑一句现成的诗 ----------
const touch = px => px / S.k;                                                    // 手指的容差按屏幕像素算
function say(re, x, y) {
  const c = []; for (const p of POEMS) for (const l of p.l) if (re.test(l)) c.push([l, p]);
  if (!c.length) return false;
  const [l, p] = c[Math.random() * c.length | 0];
  SH.ui.bubble(l, x, y, `${p.t} · ${p.a}`); SH.audio.poem(); return true;
}
SH.hitTest = (x, y) => {
  const m = SH.sky.moon;
  if (m && m[2] > 0.3 && Math.hypot(x - m[0], y - m[1]) < Math.max(40, touch(30))) return say(/月/, x, y);
  for (const b of SH.life.boats) { const bx = SH.toSX(b.X, 1), r = 30 * b.s + touch(8); if (Math.abs(x - bx) < r && y > b.y - 50 * b.s - touch(8) && y < b.y + touch(10)) return say(b.type === 'sail' ? /帆|舟|船/ : /舟|钓|渔|船/, x, y); }
  for (const ch of SH.terrain.visible(2)) for (const [X, yt, yb] of ch.falls) if (Math.abs(x - SH.toSX(X, SH.LAYERS[2].p)) < touch(14) && y > yt && y < yb) return say(/瀑|飞流|银河/, x, y);
  for (const li of [3, 2]) for (const ch of SH.terrain.visible(li)) for (const [X, ly] of ch.lights) if (Math.hypot(x - SH.toSX(X, SH.LAYERS[li].p), y - ly) < touch(22)) return say(/人家|家|村|寺|楼/, x, y);
  return false;
};

SH.makeSeal = (name, N = 160) => {
  const t = name.length === 2 ? name + '之印' : name.length === 3 ? name + '印' : name;
  const [c, g] = SH.canvas(N, N), r = SH.rng(SH.hash32(t.length * 977 + t.charCodeAt(0)));
  g.fillStyle = '#b5352b'; g.fillRect(4, 4, N - 8, N - 8);
  g.fillStyle = '#fbefe4'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const cells = t.length === 1 ? [[0.5, 0.5, 0.78]] : [[0.72, 0.29, 0.4], [0.72, 0.71, 0.4], [0.28, 0.29, 0.4], [0.28, 0.71, 0.4]];
  [...t].slice(0, 4).forEach((ch, i) => { const [x, y, s] = cells[i]; g.font = `${N * s}px ${SH.KAI}`; g.fillText(ch, x * N, y * N + N * 0.02); });
  g.strokeStyle = '#fbefe4'; g.lineWidth = N * 0.025; g.strokeRect(N * 0.07, N * 0.07, N * 0.86, N * 0.86);
  const img = g.getImageData(0, 0, N, N), d = img.data;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = (y * N + x) * 4, edge = Math.min(x, y, N - 1 - x, N - 1 - y), n = SH.noise2(x / 6, y / 6, 11);
    if (edge < 8 && n * 8 > edge + r() * 2) d[i + 3] = 0;
    else if (d[i + 3] && SH.noise2(x / 2.5, y / 2.5, 5) > 0.82) { d[i] = 181; d[i + 1] = 53; d[i + 2] = 43; }
  }
  g.putImageData(img, 0, 0);
  return c;
};
})();

</script>
<script>
'use strict';
/* 山河长卷 · ui —— 弹层、百宝箱、印章、题字气泡、存图、语音（听与说）。所有玩法都通过这里和人打交道。 */
(() => {
const S = SH.S, $ = id => document.getElementById(id), body = document.body;
const esc = SH.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
SH.store = {
  get(k, d = null) { try { const v = localStorage.getItem('shanhe.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('shanhe.' + k, JSON.stringify(v)); } catch (e) { /* 隐私模式：不记也能玩 */ } }
};
SH.feat = SH.feat || {};
const coarse = matchMedia('(pointer:coarse)').matches;
const ui = SH.ui = { isTouch: coarse || 'ontouchstart' in window, isMobile: coarse && Math.min(screen.width, screen.height) < 820, isIOS: /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) };

ui.toast = (t, ms = 2600) => { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(ui._t); ui._t = setTimeout(() => el.classList.remove('show'), ms); };
ui.flash = (a = 0.75) => { const el = $('flash'); el.style.transition = 'none'; el.style.opacity = a; requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = 'opacity 1.2s'; el.style.opacity = '0'; })); };

// 朱印“啪”地盖下：妙、好、对、绝……
ui.stamp = (ch = '妙', sub = '') => {
  const el = $('stamp');
  el.innerHTML = `<b>${esc(ch)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}`;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  SH.audio.stamp && SH.audio.stamp();
  clearTimeout(ui._st); ui._st = setTimeout(() => el.classList.remove('on'), 1700);
};

// 题字气泡：点到画中物，就在旁边浮出一句诗。x、y 是画卷坐标（高 900）
ui.bubble = (text, x, y, by = '', ms = 5200) => {
  const box = $('bubbles'), el = document.createElement('div');
  el.className = 'bubble';
  el.innerHTML = `<span>${esc(text)}</span>${by ? `<small>${esc(by)}</small>` : ''}`;
  box.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight, sx = x * S.k, sy = y * S.k;
  el.style.left = SH.clamp(sx - w / 2, 10, innerWidth - w - 10) + 'px';
  el.style.top = SH.clamp(sy - h - 18, 10, innerHeight - h - 90) + 'px';
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 900); }, ms);
  while (box.children.length > 4) box.firstChild.remove();
};

// ---------- 弹层 ----------
ui.modal = ({ title = '', html = '', wide = false, onClose = null, cls = '' } = {}) => {
  ui.close(true);
  const m = $('modal');
  m.innerHTML = `<div class="card ${wide ? 'wide' : ''} ${cls}" role="dialog" aria-label="${esc(title)}"><button class="x" aria-label="关闭">×</button>${title ? `<h2>${esc(title)}</h2>` : ''}<div class="cbody">${html}</div></div>`;
  m.hidden = false; requestAnimationFrame(() => m.classList.add('on'));
  ui._onClose = onClose;
  m.querySelector('.x').onclick = () => ui.close();
  const card = m.querySelector('.card');
  card.q = s => card.querySelector(s); card.qa = s => [...card.querySelectorAll(s)];
  return card;
};
ui.close = silent => {
  const m = $('modal');
  if (m.hidden) return;
  m.classList.remove('on'); m.hidden = true; m.innerHTML = '';
  const f = ui._onClose; ui._onClose = null;
  if (f && !silent) f();
};
$('modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') ui.close(); });

// ---------- 百宝箱 ----------
const CATALOG = [
  ['诗 与 画', [['recite', '念', '念诗显景', '念一句诗，画就变成诗里的样子'], ['ya', '雅', '俗语变雅词', '说句大白话，还你一句千古名句'], ['feihua', '令', '飞花令', '和山河对诗，看谁接得多'],
    ['guess', '猜', '看画猜诗', '画里藏着哪首诗？'], ['name', '名', '名字藏诗', '你的名字，藏在哪些诗里'], ['qian', '签', '抽诗签', '摇一摇，抽一支今日诗签']]],
  ['画 中 奇 遇', [['brush', '笔', '神笔马良', '画一道山脊它就成山，画一条线龙沿着飞'], ['wish', '愿', '许愿灯', '写下心愿，放一盏灯'], ['qin', '琴', '抚琴', '水面化作七弦，随手弹'],
    ['blow', '风', '吹气起风', '对着话筒吹口气，满山花落'], ['tilt', '感', '体感山水', '倾斜手机，山有远近'], ['fest', '节', '节日彩蛋', '烟花、龙舟、鹊桥、玉兔……']]],
  ['留 与 赠', [['gift', '赠', '赠画', '把这卷山河，送给一个人'], ['seal', '印', '落款收藏', '钤一方印，存下此刻'], ['xray', '理', '看见数学', '这幅画背后的公式'], ['help', '问', '玩法总览', '所有惊喜，一页看完']]]
];
ui.catalog = CATALOG;
function buildSheet() {
  const sh = $('sheet');
  sh.innerHTML = `<div class="sheetIn"><div class="grip"></div><h2>百 宝 箱</h2>` + CATALOG.map(([g, items]) =>
    `<h3>${g}</h3><div class="tiles">` + items.map(([id, ic, name, desc]) => `<button class="tile" data-feat="${id}"><i>${ic}</i><b>${name}</b><small>${desc}</small></button>`).join('') + `</div>`).join('') + `</div>`;
  sh.addEventListener('click', e => {
    const t = e.target.closest('[data-feat]');
    if (t) { ui.sheet(false); SH.audio.resume(); setTimeout(() => ui.run(t.dataset.feat), 120); }
    else if (e.target === sh) ui.sheet(false);
  });
}
ui.run = id => { if (SH.feat[id]) SH.feat[id](); else ui.toast('这 件 宝 贝 还 在 炼 制'); };
ui.sheet = open => { const sh = $('sheet'); if (!sh.firstChild) buildSheet(); open = open ?? sh.hidden; sh.hidden = !open; if (open) requestAnimationFrame(() => sh.classList.add('on')); else sh.classList.remove('on'); };

// ---------- 进行中的模式（神笔、抚琴、声控）：顶部一条小横幅 ----------
ui.modeBar = (text, onDone, doneText = '完成') => {
  const el = $('modebar');
  if (!text) { el.hidden = true; el.innerHTML = ''; return; }
  el.innerHTML = `<span>${esc(text)}</span><button>${esc(doneText)}</button>`;
  el.hidden = false;
  el.querySelector('button').onclick = () => { ui.modeBar(null); onDone && onDone(); };
};

// ---------- 存图：手机长按保存，电脑下载，能分享就直接分享 ----------
ui.showImage = (canvas, { title = '存 图', name = '山河长卷.png', tip = '', more = [] } = {}) => {   // more：额外按钮 [[文字, 点了做什么], …]
  const url = canvas.toDataURL('image/png');
  const card = ui.modal({ title, wide: true, cls: 'imgcard', html: `<img class="shot" src="${url}" alt="${esc(title)}"><p class="tip">${ui.isTouch ? '长按图片，可保存或直接发给朋友' : '点“下载”，存到电脑'}${tip ? '　' + esc(tip) : ''}</p><div class="btns"><button class="go" data-a="dl">下载</button>${navigator.canShare ? '<button data-a="share">分享</button>' : ''}${more.map((m, i) => `<button data-m="${i}">${esc(m[0])}</button>`).join('')}</div>` });
  more.forEach((m, i) => { card.q(`[data-m="${i}"]`).onclick = () => m[1](card); });
  card.q('[data-a=dl]').onclick = () => { const a = document.createElement('a'); a.href = url; a.download = name; body.appendChild(a); a.click(); a.remove(); };
  const sb = card.q('[data-a=share]');
  if (sb) sb.onclick = () => canvas.toBlob(b => {
    const f = new File([b], name, { type: 'image/png' });
    if (navigator.canShare({ files: [f] })) navigator.share({ files: [f], title: '山河长卷' }).catch(() => {});
    else ui.toast('这个浏览器不支持直接分享图片，请长按保存');
  }, 'image/png');
  return card;
};

// ---------- 听：浏览器语音识别（国内 Chrome 走 Google 常失败，失败就请人打字或用输入法语音） ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
ui.canListen = !!SR;
const SR_ERR = { 'not-allowed': '没有麦克风权限', 'service-not-allowed': '浏览器不让用语音', network: '语音服务连不上（国内的 Chrome 常见），请点输入框，用输入法的话筒说', 'no-speech': '没听到声音，再说一次？', 'audio-capture': '找不到麦克风', aborted: '' };
ui.listen = ({ onInterim, onFinal, onError, onEnd } = {}) => {
  if (!SR) { onError && onError('这个浏览器不会听，请点输入框，用输入法的话筒说'); return null; }
  const r = new SR();
  r.lang = 'zh-CN'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 3;
  let fin = '';
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) { fin += res[0].transcript; onFinal && onFinal(res[0].transcript, [...res].map(a => a.transcript)); } else interim += res[0].transcript;
    }
    onInterim && onInterim(fin + interim);
  };
  r.onerror = e => { const m = SR_ERR[e.error]; if (m !== '') onError && onError(m || ('语音出错：' + e.error)); };
  r.onend = () => onEnd && onEnd(fin);
  try { r.start(); } catch (e) { onError && onError(e.message); return null; }
  return r;
};

// ---------- 说：系统朗读（有中文语音才读） ----------

<script>
'use strict';
/* 山河长卷 · qr —— 自己画二维码，不引外部库。字节模式、纠错等级 M（脏掉约 15% 也能读），版本 1–40 自动挑最小的，
   八种掩模里挑罚分最低的。依据 ISO/IEC 18004。SH.qr(文本) → { size, version, mask, get(x, y) }，怎么画由调用方决定。
   自检：python3 tools/qr_check.py（node 生成几十个码，OpenCV 解码，必须一字不差地还原）。 */
(() => {
const EXP = new Uint8Array(512), LOG = new Uint8Array(256);                               // GF(256)，本原多项式 0x11D
for (let i = 0, v = 1; i < 255; i++) { EXP[i] = EXP[i + 255] = v; LOG[v] = i; v <<= 1; if (v & 256) v ^= 0x11D; }
const mul = (a, b) => (a && b ? EXP[LOG[a] + LOG[b]] : 0);
function ecc(data, n) {                                                                     // 里德-所罗门：data·xⁿ 除以 ∏(x − αⁱ) 的余数
  let gen = [1];
  for (let i = 0; i < n; i++) { const h = new Array(gen.length + 1).fill(0); gen.forEach((c, j) => { h[j] ^= c; h[j + 1] ^= mul(c, EXP[i]); }); gen = h; }
  const r = new Array(n).fill(0);
  for (const d of data) { const f = d ^ r.shift(); r.push(0); if (f) for (let j = 0; j < n; j++) r[j] ^= mul(gen[j + 1], f); }
  return r;
}
// 纠错等级 M：每块纠错码字数、块数（下标＝版本 1–40）
const EC = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
const NB = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];
const MASK = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, x => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
  (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
  (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0, (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0];

function format(g, mask) {                                                                  // 15 位格式信息（M 级＝00，加掩模号），左上一份、右上左下拼一份
  let r = mask; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
  const bits = ((mask << 10) | r) ^ 0x5412, b = i => (bits >>> i) & 1, { N, put } = g;
  for (let i = 0; i <= 5; i++) put(8, i, b(i));
  put(8, 7, b(6)); put(8, 8, b(7)); put(7, 8, b(8));
  for (let i = 9; i < 15; i++) put(14 - i, 8, b(i));
  for (let i = 0; i < 8; i++) put(N - 1 - i, 8, b(i));
  for (let i = 8; i < 15; i++) put(8, N - 15 + i, b(i));
  put(8, N - 8, 1);                                                                         // 那个永远是黑的点
}
function grid(ver) {                                                                        // 先把定位、校正、时序、格式、版本区占好，剩下的格子才放数据
  const N = ver * 4 + 17, dark = new Uint8Array(N * N), fn = new Uint8Array(N * N);
  const g = { N, ver, dark, fn, put: (x, y, v) => { dark[y * N + x] = v ? 1 : 0; fn[y * N + x] = 1; } }, put = g.put;
  for (let i = 0; i < N; i++) { put(6, i, i % 2 === 0); put(i, 6, i % 2 === 0); }
  for (const [cx, cy] of [[3, 3], [N - 4, 3], [3, N - 4]])                                 // 三个“回”字（连同一圈白边）
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy));
      if (x >= 0 && y >= 0 && x < N && y < N) put(x, y, d !== 2 && d !== 4);

    const n = Math.floor(ver / 7) + 2, last = N - 7, step = ver === 32 ? 26 : Math.ceil((last - 6) / (n - 1) / 2) * 2, pos = [6];
    for (let p = last; pos.length < n; p -= step) pos.splice(1, 0, p);

      if ((ax === 6 && (ay === 6 || ay === last)) || (ax === last && ay === 6)) continue;

    }

  format(g, 0);                                                                             // 先占位，挑完掩模再写真值
  if (ver >= 7) {                                                                           // 版本信息：18 位，右上、左下各一份

  }

}

SH.qr = text => {
  const bytes = new TextEncoder().encode(text);
  let g, cap;
  for (let v = 1; ; v++) {                                                                  // 挑装得下的最小版本
    if (v > 40) throw new Error('文字太长，二维码装不下');
    g = grid(v); let free = 0; for (const f of g.fn) free += 1 - f;
    cap = (free >> 3) - EC[v] * NB[v];

  }
  const { ver, N } = g, bits = [], add = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  add(4, 4); add(bytes.length, ver < 10 ? 8 : 16); bytes.forEach(b => add(b, 8));          // 0100＝字节模式，然后是长度和内容
  add(0, Math.min(4, cap * 8 - bits.length)); while (bits.length % 8) bits.push(0);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) { let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j]; data.push(v); }
  for (let pad = 0xEC; data.length < cap; pad ^= 0xEC ^ 0x11) data.push(pad);              // 填充字节 11101100 / 00010001 交替
  const nb = NB[ver], ec = EC[ver], short = Math.floor(cap / nb), nLong = cap % nb, blocks = [];
  for (let b = 0, k = 0; b < nb; b++) { const len = short + (b >= nb - nLong ? 1 : 0), d = data.slice(k, k + len); k += len; blocks.push([d, ecc(d, ec)]); }
  const seq = [];                                                                           // 各块交织：先数据，后纠错
  for (let i = 0; i <= short; i++) for (const [d] of blocks) if (i < d.length) seq.push(d[i]);
  for (let i = 0; i < ec; i++) for (const [, e] of blocks) seq.push(e[i]);
  let i = 0;                                                                                // 之字形：右下起，两列一走，碰到第 6 列（时序线）就跳过
  for (let right = N - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    const up = ((right + 1) & 2) === 0;
    for (let v = 0; v < N; v++) for (let j = 0; j < 2; j++) {
      const x = right - j, y = up ? N - 1 - v : v, k = y * N + x;
      if (!g.fn[k]) { g.dark[k] = i < seq.length * 8 ? (seq[i >> 3] >>> (7 - (i & 7))) & 1 : 0; i++; }
    }
  }
  let best = null;
  for (let m = 0; m < 8; m++) {
    const dark = g.dark.slice(), t = { N, put: (x, y, v) => { dark[y * N + x] = v ? 1 : 0; } };
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!g.fn[y * N + x] && MASK[m](x, y)) dark[y * N + x] ^= 1;
    format(t, m);
    const sc = penalty(N, dark); if (!best || sc < best.sc) best = { sc, dark, m };
  }
  return { size: N, version: ver, mask: best.m, get: (x, y) => best.dark[y * N + x] === 1 };
};
})();

</script>

/* 山河长卷 · main —— 把所有层按远近叠起来，再让时间流动。各玩法通过 SH.hook 挂进来。 */
(() => {
const S = SH.S, $ = id => document.getElementById(id), body = document.body, ui = SH.ui;
const cv = $('cv'), g = cv.getContext('2d');

const hooks = {};

  for (const f of SH.life.flocks) f.birds.forEach((b, i) => {
    const x = SH.toSX(b.X, 0.56);
    g.beginPath(); g.moveTo(x, b.y); g.lineTo(x + (b.vx || f.dir * 34) * 0.35, b.y + (b.vy || 0) * 0.35); g.stroke();
    if (i === 0 && f.kind === 'flock') { g.setLineDash([3, 4]); g.beginPath(); g.arc(x, b.y, 70, 0, SH.TAU); g.stroke(); g.setLineDash([]); g.fillText('Boids: 分离 · 对齐 · 聚合', x + 74, b.y); }
  });
  for (const p of SH.life.planted) {

  }
  const pl = SH.life.planted[SH.life.planted.length - 1];
  if (pl) g.fillText(SH.L_RULE, SH.toSX(pl.X, SH.LAYERS[pl.li].p) + 20, pl.y - pl.m.h * pl.s - 10);
  if (SH.dragon.active) { const B = SH.dragon.body; for (let i = 0; i < B.length; i += 3) { g.beginPath(); g.arc(B[i][0], B[i][1], 2, 0, SH.TAU); g.fill(); } g.fillText('跟随链 ×92：每一节只追前一节', B[0][0] + 30, B[0][1] - 40); }
  run('xray', g);

}

// ---------- 主循环 ----------
let roamT = 0, qT = 0, qN = 0, qSum = 0;
function frame(now) {

  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsAvg += (1 / Math.max(dt, 1e-3) - fpsAvg) * 0.05; SH.fps = fpsAvg;
  S.t += dt; S.dt = dt;
  // 帧率太低就降一档画质（只降不升，免得来回抖）
  if (S.started && !document.hidden && !SH.Q.has('hq')) { qT += dt; qN++; qSum += dt; if (qT > 3) { const f = qN / qSum; if (f < 38 && S.dprScale > 0.55) { S.dprScale *= 0.8; resize(); } qT = qN = qSum = 0; } }
  const prevTod = S.tod;
  if (S.todTarget != null) { S.tod += dt * 0.22; if (S.tod >= S.todTarget) { S.tod = S.todTarget % 1; S.todTarget = null; } }
  else if (S.started) S.tod += dt / S.dayLen;
  S.tod %= 1;
  if (S.started && prevTod < 0.25 && S.tod >= 0.25 && S.todTarget == null && !S.lockSeason) setSeason((S.season + 1) % 4);
  const L = SH.light(S.tod); S.night = L.night; S.twilight = L.twilight; S.sunE = L.e;
  body.classList.toggle('dark', S.night > 0.5);
  $('timeIcon').textContent = S.night > 0.6 ? '夜' : S.twilight > 0.45 ? (S.tod < 0.5 ? '晨' : '昏') : '昼';
  S.wind = SH.clamp(0.5 + 0.3 * Math.sin(S.t * 0.11) + 0.2 * Math.sin(S.t * 0.37 + 1) + (S.gust || 0), 0, 1.6);
  S.gust = Math.max(0, (S.gust || 0) - dt * 0.5);
  if (S.rainTimer > 0) S.rainTimer -= dt;
  else if (S.season === 1 && S.started && (roamT -= dt) < 0) { roamT = 140; if (Math.random() < 0.4) S.rainTimer = 22; }
  S.raining += ((S.rainTimer > 0 ? 1 : 0) - S.raining) * Math.min(1, dt * 0.4);

  if (S.stay > 0) S.stay -= dt;

  run('update', dt);
  if (S.started && S.mode === 'pan') SH.poems.update(dt);                        // 神笔、抚琴时不自动吟诗，免得压住笔迹
  // ---- 绘制 ----
  g.setTransform(K, 0, 0, K, 0, 0);
  SH.sky.drawSky(g); run('sky', g);
  sc.setTransform(1, 0, 0, 1, 0, 0); sc.clearRect(0, 0, sceneCv.width, sceneCv.height); sc.setTransform(K, 0, 0, K, 0, 0);
  SH.terrain.draw(sc, 0); SH.life.drawClouds(sc, 0);
  SH.terrain.draw(sc, 1); SH.life.drawClouds(sc, 1);
  SH.terrain.draw(sc, 2); SH.life.drawPlanted(sc, 2); SH.sky.drawFalls(sc); run('mid', sc);
  SH.dragon.draw(sc); SH.life.drawClouds(sc, 2); SH.life.drawBirds(sc);
  SH.terrain.draw(sc, 3); SH.life.drawPlanted(sc, 3); run('near', sc); SH.life.drawClouds(sc, 3);
  SH.sky.drawWater(sc); SH.life.drawWaterLife(sc); SH.life.drawBoats(sc); run('water', sc);
  SH.terrain.draw(sc, 4); run('fore', sc); SH.life.drawLanterns(sc);
  sc.globalCompositeOperation = 'source-atop';
  if (S.twilight > 0.02) { sc.fillStyle = S.tod > 0.5 ? 'rgba(255,140,70,1)' : 'rgba(255,175,160,1)'; sc.globalAlpha = S.twilight * 0.2 * (1 - S.night); sc.fillRect(0, 0, S.vw, 900); }
  if (S.night > 0.01) { sc.fillStyle = '#1a2440'; sc.globalAlpha = S.night * 0.6; sc.fillRect(0, 0, S.vw, 900); }

  g.setTransform(K, 0, 0, K, 0, 0);

  g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.55; g.fillStyle = paperPat; g.fillRect(0, 0, S.vw, 900);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';

  vg.addColorStop(0, 'rgba(60,40,20,0)'); vg.addColorStop(1, 'rgba(60,40,20,.3)'); g.fillStyle = vg; g.fillRect(0, 0, S.vw, 900);

  }
}

// ---------- 开卷 ----------

  if (q.has('feat')) setTimeout(() => ui.run(q.get('feat')), 1800);
  run('debug', q);
}
try { boot(); } catch (e) { $('fatal').hidden = false; $('fatal').textContent = '画卷没能展开（' + e.message + '）。请用最新版 Chrome、Edge 或 Safari 打开。'; console.error(e); }
})();

</script>
<script>
'use strict';
/* 山河长卷 · brush —— 手指是笔，水面是琴，呼吸是风，手机一斜山就有远近。
   神笔马良：天上画山脊 → 平地起山；画长线 → 龙沿线飞；水面一划 → 鱼跃；山坡涂抹 → 成林。 */
(() => {
const S = SH.S, ui = SH.ui, A = SH.audio, body = document.body, LS = SH.LAYERS, { clamp, TAU } = SH;
const $ = id => document.getElementById(id);
S.blow = 0;

// ---------- 模式：进入后画卷停步、底栏让位，顶上一条横幅可收起 ----------
let leaveFn = null;
function enter(mode, text, onLeave) {
  leave(); $('hints').innerHTML = '';                                           // 开卷提示别压在琴弦、笔迹上
  S.mode = mode; body.classList.add('moding', mode);
  leaveFn = () => { body.classList.remove('moding', mode); S.mode = 'pan'; $('hints').innerHTML = ''; onLeave && onLeave(); };
  ui.modeBar(text, leave, '收 起');
}
function leave() { if (!leaveFn) return; const f = leaveFn; leaveFn = null; ui.modeBar(null); f(); }
SH.hook('escape', leave);

function tips(list) {                                                            // 和开卷提示同一种小签条
  const box = $('hints'); box.innerHTML = '';
  list.forEach(([t, x, y], i) => {
    const d = document.createElement('div'); d.className = 'hint'; d.textContent = t; d.style.left = x + '%'; d.style.top = y + '%';
    box.appendChild(d); setTimeout(() => d.classList.add('show'), 150 + i * 380); setTimeout(() => d.classList.remove('show'), 7000 + i * 300);
  });
}

// ---------- 笔迹：落墨，再慢慢淡去 ----------
const inks = [];
let cur = null, made = 0, nagged = false;
const ink = a => S.night > 0.5 ? `rgba(240,226,190,${a})` : `rgba(36,30,24,${a})`;
SH.hook('top', g => {
  for (let i = inks.length - 1; i >= 0; i--) {
    const k = inks[i];
    if (k.done && (k.age += S.dt) > k.life) { inks.splice(i, 1); continue; }
    if (k.pts.length > 1) SH.brush(g, k.pts, 8, 3.5, ink(k.done ? 0.82 * (1 - k.age / k.life) : 0.82), k.seed);
  }
});

// 把手抖抹顺，再按等距重新取点
const smooth = P => P.map((p, i) => { let x = 0, y = 0, c = 0; for (let j = Math.max(0, i - 3); j <= Math.min(P.length - 1, i + 3); j++) { x += P[j][0]; y += P[j][1]; c++; } return [x / c, y / c]; });
function resample(P, d) {
  const out = [P[0]]; let acc = 0;
  for (let i = 1; i < P.length; i++) {
    let [x0, y0] = P[i - 1], l = Math.hypot(P[i][0] - x0, P[i][1] - y0);
    while (acc + l >= d) { const k = (d - acc) / l; x0 += (P[i][0] - x0) * k; y0 += (P[i][1] - y0) * k; out.push([x0, y0]); l = Math.hypot(P[i][0] - x0, P[i][1] - y0); acc = 0; }
    acc += l;
  }
  return out;
}
// 这一点落在近岭或主峰的山体上吗？是就给出 [层, 图层X, 种树的y]
function inHill(x, y) {
  for (const li of [3, 2]) {
    const L = LS[li], X = x - S.cam * L.p, top = SH.terrain.top(li, X);
    if (top < L.base - 12 && y > top + 3) return [li, X, Math.max(y, top + 5)];
  }
  return null;
}

SH.modes.brush = {
  down(x, y, e) {
    if (cur) return;
    $('hints').querySelectorAll('.show').forEach(h => h.classList.remove('show'));   // 一落笔，提示就让开
    cur = { id: e.pointerId, pts: [[x, y]], seed: Math.random() * 1e4 | 0, done: false, age: 0, life: 1.4 }; inks.push(cur); },
  move(x, y, e) {
    if (!cur || e.pointerId !== cur.id || cur.pts.length > 700) return;
    const p = cur.pts[cur.pts.length - 1];
    if (Math.hypot(x - p[0], y - p[1]) > 3.5) cur.pts.push([x, y]);
  },
  up(x, y, e) { if (!cur || e.pointerId !== cur.id) return; const k = cur; cur = null; k.done = true; judge(k); }
};

// ---------- 看笔势，定笔意 ----------
function judge(k) {
  const P = k.pts, n = P.length;
  if (n < 4) { k.life = 0.4; if (!nagged) { nagged = true; ui.toast('提 笔 画 一 道 ， 不 必 点'); } return; }
  let len = 0, ady = 0, adx = 0, minX = 1e9, maxX = -1e9, ap = P[0];
  for (let i = 0; i < n; i++) {
    const p = P[i];
    if (i) { const dx = p[0] - P[i - 1][0], dy = p[1] - P[i - 1][1]; len += Math.hypot(dx, dy); adx += Math.abs(dx); ady += Math.abs(dy); }
    minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); if (p[1] < ap[1]) ap = p;
  }
  const wet = P.filter(p => p[1] > S.WATER + 4).length / n, hill = P.filter(p => inHill(p[0], p[1])).length / n;
  if (wet > 0.6) return fish(P, k);
  if (hill > 0.55) return forest(P, k);
  const a = P[0], b = P[n - 1], up = (a[1] - ap[1]) + (b[1] - ap[1]), span = maxX - minX;
  // 山脊：中间高、两头低，只有一个峰（上下来回的总量≈两侧落差），并且是横着走的一笔
  if (Math.min(a[1], b[1]) - ap[1] > 40 && span > 70 && ady < up * 1.6 + 40 && adx < span * 1.5) return mountain(P, ap, k);
  if (len > 240) return dragon(P, k);
  birds(P, k);
}

// ---------- 平地起山 ----------
const rising = [];
function mountain(P, ap, k) {
  const tall = LS[2].base - ap[1] > 230, li = tall ? 2 : 3, L = LS[li];
  const h = clamp(L.base - ap[1], tall ? 230 : 70, L.hMax), A_ = tall ? 1.55 : 2, B_ = tall ? 2 : 1.25;
  // 让山的轮廓正好经过笔画两端：(1−|u|^a)^b = 端点高/峰高，解出 u，再反推半宽
  const half = end => { const f = clamp((L.base - end[1]) / h, 0.02, 0.9), u = Math.pow(1 - Math.pow(f, 1 / B_), 1 / A_); return clamp(Math.abs(ap[0] - end[0]) / Math.max(u, 0.2), h * 0.45, L.wMax * 1.6); };
  const [l, r] = P[0][0] < P[P.length - 1][0] ? [P[0], P[P.length - 1]] : [P[P.length - 1], P[0]];
  const pk = { L, id: 9e8 + ++made, cx: ap[0] - S.cam * L.p, h, wl: half(l), wr: half(r), a: A_, b: B_, sh: 0, su: 0, sh2: 0, z: 1, tone: Math.random(), seed: Math.random() * 1e9 | 0 };
  rising.push({ pk, li, img: SH.terrain.bakePeak(pk), t: 0, T: 2.4 });
  A.rumble(); k.life = 1.6;
  ui.toast(tall ? '平 地 起 高 山' : '一 道 青 岭 出 水 来');
}
const dust = SH.softDot([238, 230, 212], 48);
function drawRise(g, li) {
  for (const r of rising) if (r.li === li) {
    const L = r.pk.L, im = r.img, u = clamp(r.t / r.T, 0, 1), e = 1 - Math.pow(1 - u, 3);
    const x = SH.toSX(im.x0, L.p) + (1 - e) * (Math.random() - 0.5) * 3;
    g.save(); g.beginPath(); g.rect(x - 10, -100, im.w + 20, L.yBot + 100); g.clip();          // 只露出地面以上：山是从地里长出来的
    g.globalAlpha = Math.min(1, u * 4); g.drawImage(im.cv, x, im.y0 + (1 - e) * (r.pk.h + 40), im.w, im.h);
    g.restore();
    g.globalAlpha = 0.85 * Math.sin(Math.PI * u);
    for (let j = 0; j < 7; j++) g.drawImage(dust, x + im.w * (0.08 + j * 0.14) - 70, L.base - 64 + Math.sin(j * 2.1 + r.t * 2) * 10 - u * 20, 140, 96);
    g.globalAlpha = 1;
  }
}
SH.hook('mid', g => drawRise(g, 2)); SH.hook('near', g => drawRise(g, 3));
SH.hook('update', dt => {
  for (let i = rising.length - 1; i >= 0; i--) {
    const r = rising[i]; r.t += dt;
    if (r.t < 1.3) S.tilt += (Math.random() - 0.5) * 3 * (1 - r.t / 1.3);                   // 地动山摇
    if (r.t >= r.T) { SH.terrain.addPeak(r.pk); rising.splice(i, 1); }
  }
});

// ---------- 画龙点睛：龙沿着笔迹飞 ----------
function dragon(P, k) {
  if (!SH.dragon.fly(resample(smooth(P), 12))) { ui.toast('龙 已 在 云 中'); k.life = 0.6; return; }
  k.life = clamp(SH.dragon.T + 4, 2.5, 9);
  ui.toast('画 龙 点 睛');
}

// ---------- 鱼跃、成林、惊鸟 ----------
function fish(P, k) {
  const pts = resample(P, 44).filter(p => p[1] > S.WATER + 4).slice(0, 12);
  pts.forEach((p, i) => setTimeout(() => { if (SH.life.kois.length < 30) SH.life.koi(p[0] - S.cam, p[1]); if (i % 2 === 0) A.koi(); }, i * 110));
  k.life = 0.9;
  ui.toast(pts.length > 5 ? '鱼 跃 龙 门' : '鱼 戏 莲 叶 间');
}
function forest(P, k) {
  let n = 0;
  for (const p of resample(P, 30)) {
    const h = inHill(p[0], p[1]);
    if (!h || n >= 14) continue;
    const i = n++;
    setTimeout(() => { SH.life.plant(...h); if (i % 3 === 0) A.plant(); }, i * 90);
  }
  k.life = 1;
  if (n) ui.toast(['万 木 争 春', '绿 树 成 荫', '层 林 尽 染', '松 柏 后 凋'][S.season]);
}
function birds(P, k) {
  const e = P[P.length - 1];
  if (S.night > 0.3 || S.twilight > 0.6) { for (let i = 0; i < 5; i++) SH.life.lantern(e[0] + (Math.random() - 0.5) * 70, e[1] + Math.random() * 30); A.lantern(); }
  else if (SH.life.flocks.length < 12) { SH.life.spawnFlock('flock', e[0] - S.cam * 0.56, e[1], { burst: true }); A.birds('flock'); }
  k.life = 0.8;
}

SH.feat.brush = () => {
  enter('brush', '神笔 · 画山 画龙 画鱼 画林', () => { cur = null; });
  const m = innerWidth < 640;
  tips([['在天上画一道山脊 ⌒　平地起山', 50, m ? 15 : 14], ['画一条长长的线　龙沿着飞', 50, m ? 25 : 25], ['在山坡上涂抹　长出树林', m ? 50 : 32, m ? 56 : 58], ['水面上划一笔　鱼跃', m ? 50 : 64, m ? 82 : 84]]);
};

// ---------- 抚琴：水面化作七弦，十三徽位轻点出泛音 ----------
const HUI = [1 / 8, 1 / 6, 1 / 5, 1 / 4, 1 / 3, 2 / 5, 1 / 2, 3 / 5, 2 / 3, 3 / 4, 4 / 5, 5 / 6, 7 / 8];
const HN = [8, 6, 5, 4, 3, 5, 2, 5, 3, 4, 5, 6, 8];                              // 在 1/n 处轻点，只剩 n 倍频
const strs = Array.from({ length: 7 }, () => ({ amp: 0, x: 0.5, n: 0, last: -1 }));
const floats = [];
let qinA = 0, qinLast = null, sel = 3;
// 琴弦铺在水面上；弦距至少 26 像素，屏幕矮（手机）就往上铺开，手指好下
const geo = () => { const y1 = 872, gap = Math.max((y1 - S.WATER - 40) / 6, 26 / S.k), x0 = S.vw * 0.06, x1 = S.vw * 0.94; return { y0: y1 - gap * 6, y1, x0, x1, gap }; };
const strY = (G, i) => G.y0 + i * G.gap;                                       // 一弦最粗最低，在远处（上）
function pluck(i, x, vel) {
  const s = strs[i]; if (S.t - s.last < 0.07) return;
  const G = geo(); s.last = S.t; s.amp = 4 + vel * 6; s.x = clamp((x - G.x0) / (G.x1 - G.x0), 0.05, 0.95); s.n = 0; sel = i;
  A.string(i, false);
  floats.push({ x, y: strY(G, i) - 8, t: 0, txt: A.stepName(i) });
  SH.life.ripple(x - S.cam, Math.max(S.WATER + 6, strY(G, i)), 0.5);
}
function harmonic(j) {
  const G = geo(), s = strs[sel], n = HN[j];
  s.amp = 3.2; s.n = n; s.last = S.t;
  A.harmonic(A.step(A.tonic(3), sel) + 12 * Math.log2(n), A.now(), 0.24);
  floats.push({ x: G.x0 + HUI[j] * (G.x1 - G.x0), y: strY(G, 0) - G.gap * 1.1, t: 0, txt: '泛 ' + A.stepName(sel) });
}
SH.modes.qin = {
  down(x, y) {
    const G = geo(); qinLast = [x, y];
    if (Math.abs(y - (strY(G, 0) - G.gap * 0.75)) < G.gap * 0.5) {          // 点徽位
      let j = 0; HUI.forEach((h, i) => { if (Math.abs(G.x0 + h * (G.x1 - G.x0) - x) < Math.abs(G.x0 + HUI[j] * (G.x1 - G.x0) - x)) j = i; });
      return harmonic(j);
    }
    const i = Math.round((y - G.y0) / G.gap);
    if (i >= 0 && i < 7 && Math.abs(y - strY(G, i)) < G.gap * 0.5) pluck(i, x, 0.6);
  },
  move(x, y) {                                                                   // 划过哪根弦，哪根弦就响
    if (!qinLast) return;
    const G = geo(), [lx, ly] = qinLast;
    for (let i = 0; i < 7; i++) { const sy = strY(G, i); if ((ly - sy) * (y - sy) < 0) pluck(i, lx + (x - lx) * (sy - ly) / (y - ly), clamp(Math.abs(y - ly) / 30, 0.2, 1)); }
    qinLast = [x, y];
  },
  up() { qinLast = null; }
};
SH.hook('update', dt => {
  qinA = clamp(qinA + (S.mode === 'qin' ? dt : -dt) * 2, 0, 1);
  for (const s of strs) s.amp *= Math.exp(-dt * 1.6);
  for (let i = floats.length - 1; i >= 0; i--) if ((floats[i].t += dt) > 1.4) floats.splice(i, 1);
});
SH.hook('top', g => {
  if (qinA <= 0) return;
  const G = geo(), lit = S.night > 0.5;
  g.save(); g.globalAlpha = qinA; g.lineCap = 'round';
  g.fillStyle = lit ? '#c9b48a' : '#3b2a1c';                                  // 岳山与龙龈
  g.fillRect(G.x0 - 14, G.y0 - G.gap * 0.5, 6, G.gap * 7); g.fillRect(G.x1 + 8, G.y0 - G.gap * 0.5, 6, G.gap * 7);
  strs.forEach((s, i) => {
    const y = strY(G, i), w = Math.max(0.9, 2.6 - i * 0.26), osc = Math.cos(S.t * (34 + i * 5)) * s.amp, pts = [];
    for (let k = 0; k <= 48; k++) {
      const u = k / 48, shape = s.n ? Math.sin(s.n * Math.PI * u) : (u < s.x ? u / s.x : (1 - u) / (1 - s.x));   // 拨弦是三角形，泛音是 sin(nπx) 驻波
      pts.push([G.x0 + u * (G.x1 - G.x0), y + shape * osc]);
    }
    for (const [c, dy, lw] of [['rgba(20,14,8,.35)', 1.6, w + 0.6], [lit ? '#f7eccf' : '#fbf3dc', 0, w]]) {
      g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); pts.forEach(([x, py], k) => k ? g.lineTo(x, py + dy) : g.moveTo(x, py + dy)); g.stroke();
    }
  });
  const hy = strY(G, 0) - G.gap * 0.75;                                       // 十三徽：螺钿小圆点
  for (const h of HUI) { const x = G.x0 + h * (G.x1 - G.x0); g.fillStyle = 'rgba(40,30,20,.35)'; g.beginPath(); g.arc(x, hy + 1, 4.6, 0, TAU); g.fill(); g.fillStyle = '#fbf8ee'; g.beginPath(); g.arc(x, hy, 3.6, 0, TAU); g.fill(); }
  g.font = `20px ${SH.KAI}`; g.textAlign = 'center';
  for (const f of floats) { g.globalAlpha = qinA * (1 - f.t / 1.4); g.fillStyle = lit ? '#f6e3b8' : '#7a2a1e'; g.fillText(f.txt, f.x, f.y - f.t * 36); }
  g.restore();
});
SH.hook('xray', g => {
  if (S.mode !== 'qin') return;
  const G = geo();
  g.fillText('徽位＝弦长的 1/2、1/3、1/4…：轻点处成了波节，只剩 n 倍频 → 泛音；拨弦的形状是三角形，等于各次 sin(nπx) 之和', G.x0, strY(G, 0) - G.gap * 1.6);
});
SH.feat.qin = () => {
  enter('qin', '抚琴 · 划弦成曲，点徽位出泛音', () => { qinLast = null; });
  A.chime();
};

// ---------- 吹气起风：对着话筒吹口气，满山花落；没有话筒就按住画面 ----------
let mic = null;
SH.modes.blow = { down() { S.blowHold = true; }, move() {}, up() { S.blowHold = false; } };
function micStop() { if (mic) { mic.stream.getTracks().forEach(t => t.stop()); mic.src.disconnect(); mic = null; } S.blowHold = false; }
SH.feat.blow = async () => {
  enter('blow', '对着话筒，轻轻吹一口气', micStop);
  const bar = $('modebar'), meter = document.createElement('i');
  meter.className = 'meter'; meter.innerHTML = '<b></b>'; bar.insertBefore(meter, bar.querySelector('button'));
  const fallback = why => { if (S.mode === 'blow') { bar.querySelector('span').textContent = '按住画面，就是一阵风'; ui.toast(why, 3600); } };
  try {
    const ctx = A.ctx();
    if (!ctx || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fallback('这里用不了话筒');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    if (S.mode !== 'blow') { stream.getTracks().forEach(t => t.stop()); return; }
    const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser();
    an.fftSize = 1024; src.connect(an);
    mic = { stream, src, an, buf: new Float32Array(an.fftSize), base: 0.02 };
  } catch (e) { fallback('没有拿到话筒权限'); }
};
let blowWas = 0;
SH.hook('update', dt => {
  let want = 0;
  if (S.mode === 'blow') {
    if (mic) {
      mic.an.getFloatTimeDomainData(mic.buf);
      let s = 0; for (const v of mic.buf) s += v * v;
      const rms = Math.sqrt(s / mic.buf.length);
      if (rms < mic.base * 1.6 + 0.01) mic.base += (rms - mic.base) * 0.02;      // 慢慢学会环境底噪
      want = clamp((rms - mic.base - 0.03) / 0.2, 0, 1);
    }
    if (S.blowHold) want = Math.max(want, 0.85);
    const b = $('modebar').querySelector('.meter b'); if (b) b.style.width = (S.blow * 100).toFixed(0) + '%';
  }
  if (S.windT > 0) want = Math.max(want, 0.6);                                      // 诗里起风（director.js 设 S.windT）
  S.blow += (want - S.blow) * Math.min(1, dt * (want > S.blow ? 6 : 0.7));       // 起风快，风停慢
  if (S.blow > 0.05) S.gust = Math.max(S.gust || 0, S.blow * 1.4);
  if (S.blow > 0.35 && blowWas <= 0.35) A.whoosh(S.blow);
  blowWas = S.blow;
});

// ---------- 体感：手机一斜，山有远近（电脑上移动鼠标即可） ----------
let tiltOn = false, tiltGot = false;
const onTilt = e => {
  if (e.gamma == null) return;
  tiltGot = true;
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  const v = ang === 90 ? e.beta : ang === 270 || ang === -90 ? -e.beta : e.gamma;   // 横屏时，左右倾斜读的是 beta
  S.tiltT = -clamp(v, -35, 35) * 1.6;
};
SH.feat.tilt = () => {
  if (!ui.isTouch) { ui.toast('电 脑 上 ， 轻 移 鼠 标 ， 山 就 有 远 近'); return; }
  if (tiltOn) { removeEventListener('deviceorientation', onTilt); tiltOn = false; S.tiltT = 0; ui.toast('体 感 已 收'); return; }
  const go = () => {
    addEventListener('deviceorientation', onTilt); tiltOn = true; tiltGot = false;
    ui.toast('倾 斜 手 机 · 山 有 远 近');
    setTimeout(() => { if (tiltOn && !tiltGot) ui.toast('没读到陀螺仪：请用 https 链接打开再试', 4000); }, 1800);
  };
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') {                      // 苹果要在“点按”里当场申请
    const card = ui.modal({ title: '体 感 山 水', html: '<p class="sub">苹果手机需要你允许读取“动作与方向”。</p><div class="btns"><button class="go" data-a="ok">允 许</button></div>' });
    card.q('[data-a=ok]').onclick = () => DOE.requestPermission().then(r => { ui.close(); if (r === 'granted') go(); else ui.toast('没有拿到方向权限'); }).catch(() => { ui.close(); ui.toast('没有拿到方向权限'); });
  } else go();

})();

(() => {
const S = SH.S, A = SH.audio, PR = SH.props, K = PR.K, R = PR.R, { clamp, lerp, TAU } = SH;
const dark = () => Math.max(S.night, S.twilight * 0.7);

// ---------- 纸鸢：儿童散学归来早，忙趁东风放纸鸢 ----------
function kite(g, x, y, kind, ph) {
  g.save(); g.translate(x, y); g.rotate(Math.sin(ph * 0.9) * 0.12); g.strokeStyle = 'rgba(43,38,32,.7)'; g.lineWidth = 0.7;
  g.beginPath(); for (let i = 0; i <= 12; i++) { const yy = 14 + i * 5.5, xx = Math.sin(ph * 3 - i * 0.7) * (2 + i * 0.5); i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke();   // 尾巴
  if (kind === 0) {                                                                            // 沙燕：头圆、翅宽、剪刀尾
    g.fillStyle = '#f4ead2'; g.beginPath(); g.moveTo(0, -15); g.quadraticCurveTo(7, -15, 6, -8); g.quadraticCurveTo(18, -12, 25, -3); g.quadraticCurveTo(14, -2, 6, 3);
    g.lineTo(8, 16); g.lineTo(2, 9); g.lineTo(0, 12); g.lineTo(-2, 9); g.lineTo(-8, 16); g.lineTo(-6, 3); g.quadraticCurveTo(-14, -2, -25, -3); g.quadraticCurveTo(-18, -12, -6, -8); g.quadraticCurveTo(-7, -15, 0, -15); g.fill(); g.stroke();
    g.fillStyle = '#2b2620'; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 7, -8); g.quadraticCurveTo(s * 16, -10, s * 22, -4); g.quadraticCurveTo(s * 14, -6, s * 7, -5); g.fill(); }
    g.fillStyle = '#b5352b'; g.beginPath(); g.arc(0, -2, 3.2, 0, TAU); g.fill(); g.beginPath(); g.arc(-2.4, -11, 1, 0, TAU); g.arc(2.4, -11, 1, 0, TAU); g.fill();
  } else {                                                                                     // 菱形纸鸢
    g.fillStyle = kind === 1 ? '#d9573f' : '#3f78a8';
    g.beginPath(); g.moveTo(0, -16); g.lineTo(12, 0); g.lineTo(0, 15); g.lineTo(-12, 0); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#f1d36a'; g.beginPath(); g.arc(0, 0, 4.5, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(0, -16); g.lineTo(0, 15); g.moveTo(-12, 0); g.lineTo(12, 0); g.stroke();
  }
  g.restore();
}
K.kite = { layer: 'top', dur: 60,
  init(a) { a.k = [0, 1, 2].map(i => ({ x: S.vw * (0.28 + i * 0.22) + R.range(-40, 40), top: R.range(140, 290), y: 640, kind: i, ph: R() * TAU, ax: S.vw * (0.08 + i * 0.12) })); },
  update(a, dt) { for (const k of a.k) { k.y += (k.top - k.y) * Math.min(1, dt * 0.45); k.x += S.camDelta * 0.25; k.ax += S.camDelta * 0.25; k.ph += dt; } },
  draw(g, a) {
    for (const k of a.k) {
      const x = k.x + Math.sin(k.ph * 0.7) * 12 * (0.5 + S.wind), y = k.y + Math.sin(k.ph * 1.3) * 6;
      g.strokeStyle = 'rgba(60,50,40,.35)'; g.lineWidth = 0.6; g.beginPath(); g.moveTo(x, y + 4); g.quadraticCurveTo((x + k.ax) / 2 + 50, (y + 900) / 2 + 70, k.ax, 905); g.stroke();
      kite(g, x, y, k.kind, k.ph);
    }
  }
};

// ---------- 烟花：一颗升空，一声炸开，粒子带着重力和空气阻力散落 ----------
const FW = [[255, 200, 90], [255, 110, 90], [255, 150, 210], [140, 220, 255], [170, 255, 160], [255, 240, 200]];
K.fireworks = { layer: 'glow', dur: 16,
  init(a) { a.rk = []; a.ps = []; a.next = 0.2; },
  update(a, dt) {
    if (a.t < a.dur - 4.5 && (a.next -= dt) < 0) { a.next = R.range(0.4, 1.1); a.rk.push({ x: S.vw * R.range(0.12, 0.88), top: R.range(130, 320), age: 0, c: R.pick(FW), ring: R() < 0.4 }); A.boom(0.9); }
    for (const r of a.rk) {
      r.age += dt; r.y = lerp(690, r.top, 1 - (1 - Math.min(1, r.age / 0.9)) ** 2);
      if (r.age >= 0.9 && !r.done) {
        r.done = true;
        a.ps.push({ x: r.x, y: r.top, vx: 0, vy: 0, age: 0, life: 0.35, c: FW[5], s: 60 });                       // 炸开那一闪
        for (let i = 0, n = r.ring ? 72 : 110; i < n; i++) { const an = r.ring ? i / n * TAU : R() * TAU, sp = r.ring ? 190 : R.range(50, 215); a.ps.push({ x: r.x, y: r.top, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, age: 0, life: R.range(1.4, 2.3), c: R() < 0.15 ? FW[5] : r.c }); }
      }
    }
    a.rk = a.rk.filter(r => !r.done);
    for (const p of a.ps) { p.age += dt; p.vx *= 1 - dt * 1.4; p.vy = p.vy * (1 - dt * 1.4) + 55 * dt; p.x += p.vx * dt + S.camDelta * 0.2; p.y += p.vy * dt; }
    a.ps = a.ps.filter(p => p.age < p.life);
  },
  draw(g, a) {
    const base = g.globalAlpha * (0.35 + 0.65 * dark()); g.globalCompositeOperation = 'lighter';
    for (const r of a.rk) { g.globalAlpha = base; g.strokeStyle = 'rgba(255,214,150,.9)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(r.x, r.y); g.lineTo(r.x, r.y + 16); g.stroke(); }
    for (const p of a.ps) { const k = 1 - p.age / p.life, s = p.s ? p.s * k : 3.5 + 7 * k; g.globalAlpha = base * k; g.drawImage(SH.softDot(p.c, 16), p.x - s, p.y - s, s * 2, s * 2); }
  }
};

// ---------- 星河：一条斜贯夜空的光带，星点 + 星云 ----------
let MW = null;
const band = () => { const x0 = 0.2 * S.vw, y0 = 640, dx = 0.42 * S.vw, dy = -720, L = Math.hypot(dx, dy); return { x0, y0, dx, dy, L, nx: -dy / L, ny: dx / L }; };
const onBand = (B, u, off) => [B.x0 + B.dx * u + B.nx * off, B.y0 + B.dy * u + B.ny * off];
K.milkyway = { layer: 'sky', dur: 90, one: true,
  draw(g, a) {
    if (S.night < 0.05) return;
    if (!MW) { const r = SH.rng(SH.SEED ^ 0x3131); MW = { pts: Array.from({ length: 560 }, () => [r(), (r() + r() + r() - 1.5) * 70, r.range(0.4, 1.3), r() * TAU]), dust: Array.from({ length: 60 }, () => [r(), (r() - 0.5) * 80, r.range(40, 100), r.range(0.1, 0.22)]) }; }
    const B = band(), base = g.globalAlpha * S.night;
    g.save(); g.translate(B.x0 + B.dx / 2, B.y0 + B.dy / 2); g.rotate(Math.atan2(B.dy, B.dx)); g.globalAlpha = base;   // 柔光底
    const gb = g.createLinearGradient(0, -120, 0, 120); gb.addColorStop(0, 'rgba(190,200,240,0)'); gb.addColorStop(0.5, 'rgba(210,218,255,.16)'); gb.addColorStop(1, 'rgba(190,200,240,0)');
    g.fillStyle = gb; g.fillRect(-B.L * 0.55, -120, B.L * 1.1, 240); g.restore();
    for (const [u, off, w, al] of MW.dust) { const [x, y] = onBand(B, u, off); g.globalAlpha = base * al; g.drawImage(SH.softDot([205, 214, 255], 32), x - w, y - w * 0.6, w * 2, w * 1.2); }
    for (const [u, off, s, ph] of MW.pts) { const [x, y] = onBand(B, u, off); g.globalAlpha = base * (0.45 + 0.4 * Math.sin(S.t * 2 + ph)); g.fillStyle = '#fffaf0'; g.fillRect(x, y, s, s); }
  }
};

// ---------- 鹊桥：喜鹊飞来，在星河上搭一座桥；牛郎星、织女星沿桥走到一起 ----------
function magpie(g, x, y, s, dir, flap) {
  g.save(); g.translate(x, y); g.scale(dir * s, s);
  g.fillStyle = '#1c2230'; g.beginPath(); g.ellipse(0, 0, 4.5, 2, 0, 0, TAU); g.fill(); g.beginPath(); g.moveTo(-3, 0); g.lineTo(-10, -1.2); g.lineTo(-10, 1.2); g.fill();
  g.fillStyle = '#eef0f4'; g.beginPath(); g.ellipse(0.5, 0.9, 2.6, 1, 0, 0, TAU); g.fill();
  g.fillStyle = '#1c2230'; g.beginPath(); g.moveTo(1, -0.8); g.quadraticCurveTo(-1, -6 * flap - 1, -5, -7 * flap); g.lineTo(-1.5, -0.4); g.fill();
  g.restore();
}
K.queqiao = { layer: 'sky', dur: 42,
  init(a) { PR.spawn('milkyway'); A.magpie(); setTimeout(() => A.magpie(), 1600); a.n = 24; },
  update(a) { if (!a.met && a.t > 12) { a.met = true; A.chime(7); } },
  draw(g, a) {
    if (S.night < 0.05) return;
    const B = band(), [cx, cy] = onBand(B, 0.55, 0), span = 160, base = g.globalAlpha * S.night;
    const at = u => [cx + (u - 0.5) * 2 * span, cy - 46 * Math.sin(Math.PI * clamp(u, 0, 1))];        // 横跨星河的一道拱
    for (let i = 0; i < a.n; i++) {
      const u = (i + 0.5) / a.n, f = SH.smooth(clamp((a.t - 0.5 - i * 0.14) / 2.6, 0, 1)), [tx, ty] = at(u), side = u < 0.5 ? -1 : 1;
      const x = lerp(tx + side * S.vw * 0.6, tx, f), y = lerp(ty - 120, ty, f) + (f < 1 ? Math.sin(a.t * 3 + i) * 10 * (1 - f) : Math.sin(S.t * 2 + i) * 1.2);
      g.globalAlpha = base * 0.55; g.drawImage(SH.softDot([200, 215, 255], 32), x - 16, y - 12, 32, 24);
      g.globalAlpha = base; magpie(g, x, y, 1.9, -side, Math.sin(S.t * (f < 1 ? 16 : 5) + i));
    }
    const m = SH.smooth(clamp((a.t - 5) / 7, 0, 1));                                             // 牛郎（河这边）、织女（河那边）
    for (const [u0, c] of [[-0.25, [255, 236, 190]], [1.25, [210, 230, 255]]]) {
      const [x, y] = at(lerp(u0, 0.5 + (u0 < 0.5 ? -0.04 : 0.04), m)), s = 22 + 6 * Math.sin(S.t * 3) + (a.met ? 16 : 0);
      g.globalAlpha = base; g.drawImage(SH.softDot(c, 32), x - s, y - s, s * 2, s * 2); g.fillStyle = '#fffdf6'; g.beginPath(); g.arc(x, y, 2.2, 0, TAU); g.fill();
    }
  }
};

// ---------- 玉兔：月亮放大，桂树下白兔捣药 ----------
K.rabbit = { layer: 'sky', dur: 40,
  draw(g, a) {
    const m = SH.sky.moon; if (!m) return;
    const [x, y, n] = m, r = 40, base = g.globalAlpha * n * SH.smooth(clamp(a.t / 2.5, 0, 1));
    g.globalAlpha = base; g.drawImage(SH.softDot([255, 244, 214], 64), x - r * 3.2, y - r * 3.2, r * 6.4, r * 6.4);
    g.fillStyle = '#f8f2e0'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.save(); g.beginPath(); g.arc(x, y, r, 0, TAU); g.clip(); g.fillStyle = 'rgba(175,160,130,.38)';
    g.fillRect(x - r * 0.62, y - r * 0.05, r * 0.08, r * 0.6);                                   // 桂树
    g.beginPath(); g.arc(x - r * 0.58, y - r * 0.22, r * 0.3, 0, TAU); g.arc(x - r * 0.4, y - r * 0.05, r * 0.2, 0, TAU); g.arc(x - r * 0.78, y - r * 0.02, r * 0.18, 0, TAU); g.fill();
    const bx = x + r * 0.22, by = y + r * 0.32, pound = Math.max(0, Math.sin(S.t * 4)) * r * 0.1;   // 兔子：身、头、长耳，举杵捣药
    g.beginPath(); g.ellipse(bx, by, r * 0.2, r * 0.15, 0, 0, TAU); g.fill();
    g.beginPath(); g.arc(bx + r * 0.16, by - r * 0.16, r * 0.1, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(bx + r * 0.12, by - r * 0.36, r * 0.035, r * 0.14, -0.2, 0, TAU); g.ellipse(bx + r * 0.2, by - r * 0.35, r * 0.035, r * 0.13, 0.15, 0, TAU); g.fill();
    g.fillRect(bx + r * 0.36, by - r * 0.32 - pound, r * 0.05, r * 0.36);
    g.beginPath(); g.moveTo(bx + r * 0.28, by + r * 0.04); g.lineTo(bx + r * 0.52, by + r * 0.04); g.lineTo(bx + r * 0.47, by + r * 0.18); g.lineTo(bx + r * 0.33, by + r * 0.18); g.fill();
    g.restore();
  }
};

// ---------- 彩虹：七道弧，脚落在山后 ----------
const RAIN7 = ['#e05a4f', '#f0a050', '#f2d36b', '#79b46a', '#5aa3c8', '#5a6fb8', '#8a62a8'];
K.rainbow = { layer: 'sky', dur: 45, one: true,
  draw(g, a) {
    const day = 1 - S.night; if (day < 0.1) return;
    const cx = S.vw * 0.55, cy = 830, r0 = Math.min(S.vw * 0.42, 580);
    g.globalAlpha *= 0.3 * day; g.lineWidth = 7;
    RAIN7.forEach((c, i) => { g.strokeStyle = c; g.beginPath(); g.arc(cx, cy, r0 - i * 6.5, Math.PI * 1.06, Math.PI * 1.94); g.stroke(); });
  }
};

// ---------- 流星：夜里一道道划过 ----------
K.meteors = { layer: 'sky', dur: 30, one: true,
  init(a) { a.m = []; a.next = 0.4; },
  update(a, dt) {
    if (S.night > 0.3 && a.t < a.dur - 3 && (a.next -= dt) < 0) { a.next = R.range(0.7, 2.4); a.m.push({ x: S.vw * R.range(0.35, 1.05), y: R.range(30, 240), vx: -R.range(420, 640), vy: R.range(150, 260), age: 0, life: R.range(0.6, 1.1) }); }
    for (const m of a.m) { m.age += dt; m.x += m.vx * dt; m.y += m.vy * dt; }
    a.m = a.m.filter(m => m.age < m.life);
  },
  draw(g, a) {
    for (const m of a.m) {
      const k = 1 - m.age / m.life, tx = m.x - m.vx * 0.13, ty = m.y - m.vy * 0.13, gr = g.createLinearGradient(m.x, m.y, tx, ty);
      gr.addColorStop(0, `rgba(255,252,235,${0.95 * k})`); gr.addColorStop(1, 'rgba(255,252,235,0)');
      g.strokeStyle = gr; g.lineWidth = 1.7; g.beginPath(); g.moveTo(m.x, m.y); g.lineTo(tx, ty); g.stroke();
    }
  }
};
})();

</script>
<script>
'use strict';
/* 山河长卷 · director —— 把一首诗的“场景配方”变成画：先换季节、时辰、天气，再让诗里的东西一样样出场；还认得农历节日。
   配方字段（见 tools/poem-list.txt）：s 季节、d 时辰、w 天气、need 画里得先有、p 画中物、f 节日。 */
(() => {
const S = SH.S, A = SH.audio, ui = SH.ui, PR = SH.props, L = SH.life;
const D = SH.director = {};
const TOD = { dawn: 0.27, day: 0.45, dusk: 0.735, night: 0.95 };
const NIGHTLY = ['烟花', '孔明灯', '星河', '鹊桥', '玉兔', '流星', '萤'];
const dark = () => S.night > 0.3 || S.twilight > 0.5;
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- 画中物：各有各的出场方式 ----------
const TREE = { 桃: 'peach', 杏: 'peach', 柳: 'willow', 梅: 'plum', 枫: 'maple', 松: 'pine' };
function plant(kind) {                                                                   // 近山上种三棵，看它们长出来
  const Ly = SH.LAYERS[3]; let n = 0;
  for (let i = 0; i < 14 && n < 3; i++) {
    const X = rnd(0.15, 0.85) * S.vw - S.cam * Ly.p, top = SH.terrain.top(3, X);
    if (top < Ly.base - 12) { L.plant(3, X, top + rnd(5, 18), kind); n++; }
  }
  if (n) A.plant();
}
function boat(type) {
  const y = rnd(700, 820);
  L.boats.push({ X: SH.layerX0(1) + S.vw * rnd(0.3, 0.7), y, s: SH.lerp(0.55, 1.25, (y - 690) / 162), v: (Math.random() < 0.5 ? 1 : -1) * rnd(4, 8), type, ph: Math.random() * SH.TAU });
  L.boats.sort((a, b) => a.y - b.y);
}
function qin() { const t = A.now(); [0, 2, 4, 3, 1, 2, 0].forEach((s, i) => A.pluck(A.step(A.tonic(3), s), t + 0.2 + i * 0.45, 0.45, { vib: i === 6 })); }
const DO = {
  白鹭: () => L.spawnFlock('egret', SH.layerX0(0.56) - 40, 470, { dir: 1, n: 8 }),
  雁: () => { L.spawnFlock('geese', SH.layerX0(0.56) + S.vw + 40, 220, { dir: -1, n: 9 }); A.honk(3); },
  飞鸟: () => { L.spawnFlock('flock', SH.layerX0(0.56) + S.vw * 0.5, 380, { burst: true }); A.birds('flock'); },
  鹊: () => { L.spawnFlock('flock', SH.layerX0(0.56) + S.vw * 0.4, 420, { burst: true, n: 6 }); A.magpie(); },
  鸦: () => { L.spawnFlock('flock', SH.layerX0(0.56) + S.vw * 0.6, 300, { burst: true, n: 5 }); A.caw(3); },
  鱼: () => { for (let i = 0; i < 3; i++) setTimeout(() => { L.koi(SH.layerX0(1) + S.vw * rnd(0.25, 0.75), rnd(720, 840)); A.koi(); }, i * 700); },
  帆: () => boat('sail'), 渔舟: () => boat('skiff'),
  孔明灯: () => { for (let i = 0; i < 7; i++) setTimeout(() => L.lantern(S.vw * rnd(0.15, 0.85), rnd(620, 680)), i * 450); },
  龙: () => SH.dragon.summon(),
  钟: () => A.bell(), 犬: () => A.bark(3), 猿: () => A.monkey(), 笛: () => A.flute(12), 鼓: () => A.drum(16, 0.32), 爆竹: () => A.crackers(40), 琴: qin,
  雷: () => { A.rumble(); ui.flash(0.35); },
  落花: () => { S.windT = 7; }, 萤: () => { S.fireflyT = 60; }, 荷: () => {},                    // 荷：夏天的汀洲本来就有荷塘，换到夏天即可
  鹅: () => PR.spawn('goose'), 鸭: () => PR.spawn('goose', { duck: true }), 黄鹂: () => PR.spawn('oriole'), 燕: () => PR.spawn('swallow'),
  蝴蝶: () => PR.spawn('butterfly'), 蜻蜓: () => PR.spawn('dragonfly'), 牧童: () => PR.spawn('cowherd'), 龙舟: () => PR.spawn('dboat'),
  纸鸢: () => PR.spawn('kite'), 烟花: () => dark() ? PR.spawn('fireworks') : A.crackers(40), 星河: () => PR.spawn('milkyway'), 鹊桥: () => PR.spawn('queqiao'),
  玉兔: () => PR.spawn('rabbit'), 彩虹: () => PR.spawn('rainbow'), 流星: () => PR.spawn('meteors')
};
Object.keys(TREE).forEach(k => { DO[k] = () => plant(TREE[k]); });
D.can = name => !!DO[name];
D.cue = p => (p.p || []).forEach((k, i) => setTimeout(() => DO[k] && DO[k](), 1800 + i * 1300));

// ---------- 换景：季节、时辰、天气；时辰走到了再吟诗 ----------
let pending = null;
D.stage = (r, then) => {
  S.stay = Math.max(S.stay || 0, 30); SH.poems.timer = Math.max(SH.poems.timer, 25);      // 画卷停一停，自动吟诗也让一让
  const ok = n => !r.s || r.s.includes(n);
  let sn = r.s && !r.s.includes(S.season) ? r.s[0] : null;
  if (r.w && r.w.includes('雪') && ok(3)) sn = 3;                                       // 只有冬天才下雪
  if (r.p && r.p.includes('荷') && ok(1)) sn = 1;
  if (sn != null && sn !== S.season) SH.setSeason(sn);
  const want = r.d || (r.need === 'moon' || (r.p || []).some(k => NIGHTLY.includes(k)) ? ['night'] : null);
  if (want && !want.includes(SH.poems.tod())) SH.goTod(TOD[want[0]]);
  const w = r.w || [];
  if (w.includes('雨')) S.rainTimer = Math.max(S.rainTimer, 28);
  if (w.includes('风')) S.windT = 8;
  if (w.includes('雾')) PR.spawn('mist');
  pending = { then, wait: 0.4 };
};
D.perform = (p, opt) => D.stage(p, () => SH.poems.show(p, opt));
SH.hook('update', dt => {
  if (pending && S.todTarget == null && (pending.wait -= dt) < 0) { const f = pending.then; pending = null; if (f) f(); }
  if (S.windT > 0) S.windT -= dt;
  if (S.fireflyT > 0) S.fireflyT -= dt;
});

// ---------- 农历节日：用浏览器自带的 chinese 历法，不写死日期表 ----------
const LUNAR = (() => { try { return new Intl.DateTimeFormat('zh-u-ca-chinese', { month: 'numeric', day: 'numeric' }); } catch (e) { return null; } })();
D.lunar = d => {
  if (!LUNAR) return null;
  const o = {}; for (const x of LUNAR.formatToParts(d)) o[x.type] = x.value;
  const m = parseInt(o.month, 10), dd = parseInt(o.day, 10);                              // 闰月（如“闰6”）解析不出数字，正好不算节
  return isNaN(m) || isNaN(dd) ? null : { m, d: dd };
};
// ponytail: 浏览器的农历（ICU）把 2027 年正月初一算成 2 月 7 日（实为 2 月 6 日，那天新月在北京时间 23:56），整个正月差一天；这里逐日改正，以后发现别的年份再加
const ICU_FIX = { '2027-02-05': '春节', '2027-02-20': '元宵', '2027-02-21': null };
const QM = y => Math.floor((y % 100) * 0.2422 + 4.81) - Math.floor((y % 100) / 4);         // 清明在 4 月几号（21 世纪）
const FEST_DAY = { 101: '春节', 115: '元宵', 505: '端午', 707: '七夕', 815: '中秋', 909: '重阳' };
D.festOf = (d = new Date()) => {
  const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  if (ymd in ICU_FIX) return ICU_FIX[ymd];
  if (d.getMonth() === 3 && d.getDate() === QM(d.getFullYear())) return '清明';
  const l = D.lunar(d); if (!l) return null;
  if (FEST_DAY[l.m * 100 + l.d]) return FEST_DAY[l.m * 100 + l.d];
  const t = D.lunar(new Date(d.getTime() + 864e5));
  return t && t.m === 1 && t.d === 1 ? '春节' : null;                                   // 除夕也算过年
};
D.today = SH.Q.get('today') || (() => { try { return D.festOf(); } catch (e) { return null; } })();

const FEST = D.FEST = {
  春节: { s: [3], d: ['night'], p: ['爆竹', '烟花', '孔明灯'] },
  元宵: { s: [0], d: ['night'], p: ['孔明灯', '烟花'] },
  清明: { s: [0], d: ['day'], w: ['雨'], p: ['纸鸢', '柳', '牧童'] },
  端午: { s: [1], d: ['day'], p: ['龙舟', '鼓'] },
  七夕: { s: [1], d: ['night'], p: ['鹊桥', '萤', '流星'] },
  中秋: { s: [2], d: ['night'], p: ['玉兔', '孔明灯'] },
  重阳: { s: [2], d: ['day'], p: ['雁', '枫'] }
};
D.fest = name => {
  const F = FEST[name]; if (!F) return;
  const list = SH.DB.poems.filter(p => p.f === name), p = list[Math.random() * list.length | 0], props = [...new Set([...F.p, ...((p && p.p) || [])])];
  ui.toast([...name].join(' '));
  D.stage(F, () => (p ? SH.poems.show({ ...p, p: props }) : D.cue({ p: props })));
};
SH.feat.fest = () => {
  const card = ui.modal({ title: '节 日 彩 蛋', html: `<p class="sub">${D.today ? `今天是${D.today}，画卷也过节。` : '点一个节日，画卷就过这个节。'}</p><div class="chips">${Object.keys(FEST).map(n => `<button class="chip${n === D.today ? ' on' : ''}" data-f="${n}">${n}</button>`).join('')}</div>` });
  card.qa('[data-f]').forEach(b => { b.onclick = () => { ui.close(); D.fest(b.dataset.f); }; });
};
SH.hook('opened', () => { if (D.today && !SH.gift) setTimeout(() => D.fest(D.today), 5000); });   // 节日当天：开卷就过节

// 调试/演示：#auto&perform=春晓 / #prop=鹅,纸鸢 / #fest=中秋 / #today=七夕
const Q = SH.Q, find = t => SH.DB.poems.find(p => p.t === t || p.t.split(' · ')[0] === t);
if (Q.has('perform')) setTimeout(() => D.perform(find(Q.get('perform')) || SH.poems.pick()), 2200);
if (Q.has('prop')) setTimeout(() => D.cue({ p: Q.get('prop').split(',') }), 2200);
if (Q.has('fest')) setTimeout(() => D.fest(Q.get('fest')), 2200);
})();

</script>
