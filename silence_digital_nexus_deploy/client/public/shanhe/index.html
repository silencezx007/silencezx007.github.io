<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="山河长卷：一幅永远画不完的青绿山水。念一句诗，画就变成诗里的样子。没有一张图片，没有一段录音，全部由代码此刻生成。">
<meta name="theme-color" content="#0f1217">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>山河长卷</title>
<style>
:root{
  --silk:#efe6d2; --ink:#2b2620; --ink2:#5a5145; --cinnabar:#b5352b; --gold:#c9a463; --night:#0f1217;
  --panel:#f4ebd8; --panel2:#e8dbbf; --line:rgba(60,40,20,.18); --chip:rgba(255,252,244,.82);
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","楷体",serif;
  --song:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--night);color:var(--ink);font-family:var(--song);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#cv.drag{cursor:grabbing}
body.brush canvas#cv{cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--cinnabar);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- 开卷 ---------- */
#intro{position:fixed;inset:0;z-index:20}
.leaf{position:absolute;top:0;bottom:0;width:50.5%;background:radial-gradient(120% 90% at 50% 45%,#221d17 0%,#120f0c 70%);transition:transform 2.6s cubic-bezier(.65,0,.25,1)}
.leaf.l{left:0}.leaf.r{right:0}
.rod{position:absolute;top:-2vh;bottom:-2vh;width:26px;border-radius:13px;background:linear-gradient(90deg,#3a2414,#8a5a32 30%,#c08a55 48%,#7a4a26 70%,#2e1b0e)}
.rod::before,.rod::after{content:"";position:absolute;left:-7px;width:40px;height:26px;border-radius:8px;background:linear-gradient(90deg,#4a3b20,#d8c08a 45%,#8e7440 75%,#3b2e18)}
.rod::before{top:4vh}.rod::after{bottom:4vh}
.leaf.l .rod{right:-13px}.leaf.r .rod{left:-13px}
#intro.open .leaf.l{transform:translateX(calc(-100% - 48px))}
#intro.open .leaf.r{transform:translateX(calc(100% + 48px))}
#intro.open{pointer-events:none}
#introContent{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.8vh;color:#e9dfc9;transition:opacity 1.2s;z-index:2;padding:16px}
#intro.open #introContent{opacity:0}
.title{display:flex;align-items:flex-start;gap:14px}
.strip{writing-mode:vertical-rl;font-family:var(--kai);font-size:clamp(34px,6.2vh,64px);letter-spacing:.18em;padding:22px 12px;background:linear-gradient(180deg,#efe3c6,#e2d2ab);color:#2a221a;border:1px solid #9c7a46;box-shadow:0 0 0 4px #20190f,0 0 0 5px #6f5530,0 18px 60px rgba(0,0,0,.6)}
.seal{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;background:var(--cinnabar);color:#f6e9dc;font-family:var(--kai);font-size:17px;line-height:1.05;border-radius:3px;writing-mode:vertical-rl;margin-top:auto;box-shadow:inset 0 0 0 2px #f2d9c4,inset 0 0 0 3px var(--cinnabar)}
#giftLine{text-align:center;font-family:var(--kai);font-size:clamp(17px,2.5vh,23px);letter-spacing:.2em;line-height:1.9;color:#f0dfbf;opacity:0;animation:rise 1.4s .3s ease forwards}
#giftLine b{color:#eaa36f;font-weight:normal}
#giftLine .gp{display:block;font-size:.82em;color:#d9c9a6;letter-spacing:.15em}
#giftLine .gp em{font-style:normal;color:#eaa36f}
.lines{text-align:center;font-size:clamp(13.5px,2.05vh,19px);line-height:2.1;letter-spacing:.12em;max-width:min(92vw,760px)}
.lines,.foot,#giftLine{background:radial-gradient(closest-side,rgba(18,15,12,.9) 72%,rgba(18,15,12,0));padding:6px 14px}   /* 字底下压一层墨，卷轴的轴不再穿过字 */
.lines p,.foot{text-wrap:balance}
.lines p{margin:0;opacity:0;transform:translateY(6px);animation:rise 1.4s ease forwards}
.lines p:nth-child(1){animation-delay:.5s}.lines p:nth-child(2){animation-delay:1.5s}.lines p:nth-child(3){animation-delay:2.5s}.lines p:nth-child(4){animation-delay:3.2s}
.lines em{font-style:normal;color:var(--gold)}
@keyframes rise{to{opacity:1;transform:none}}
#openBtn{font-family:var(--kai);font-size:clamp(20px,3vh,28px);letter-spacing:.6em;padding:12px 22px 12px 34px;color:#f4e6d0;border:1px solid rgba(201,164,99,.7);border-radius:2px;background:rgba(181,53,43,.18);opacity:0;animation:rise 1.2s 3.4s ease forwards;transition:background .3s,box-shadow .3s}
#openBtn:hover{background:rgba(181,53,43,.45);box-shadow:0 0 40px rgba(181,53,43,.45)}
body.gift #openBtn,body.gift .foot{animation-delay:1.8s}
.foot{font-size:12px;letter-spacing:.2em;color:rgba(233,223,201,.5);opacity:0;animation:rise 1.2s 4s ease forwards;text-align:center}

/* ---------- 画上的界面 ---------- */
.ui{transition:opacity 1.2s}
body.pre .ui{opacity:0;pointer-events:none}
body.calm .ui{opacity:0;pointer-events:none}
#hud{position:fixed;top:calc(16px + env(safe-area-inset-top));left:20px;z-index:5;font-family:var(--kai);pointer-events:none;text-shadow:0 0 8px rgba(239,230,210,.8)}
#hud b{font-size:22px;letter-spacing:.3em;font-weight:normal}
#hud span{display:block;font-size:13px;letter-spacing:.2em;opacity:.72;margin-top:4px}
body.dark #hud{color:#e8dfca;text-shadow:0 0 8px rgba(0,0,0,.8)}
#topbar{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:6;display:flex;gap:8px}
#topbar button{width:38px;height:38px;border-radius:50%;background:rgba(250,245,233,.78);border:1px solid var(--line);font-family:var(--kai);font-size:17px;box-shadow:0 3px 12px rgba(40,30,15,.12)}
#topbar button.off{opacity:.55}
#dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:flex;gap:6px;align-items:flex-end;padding:9px 12px 6px;border-radius:40px;background:rgba(239,230,210,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 30px rgba(40,30,15,.18)}
.db{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:48px}
.db i{font-style:normal;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;font-family:var(--kai);font-size:20px;background:rgba(250,245,233,.92);border:1px solid rgba(60,40,20,.22);transition:transform .15s,background .25s,color .25s}
.db small{font-size:10.5px;letter-spacing:.08em;color:var(--ink2);white-space:nowrap}
.db:hover i{transform:translateY(-2px)}
.db.hot i{background:var(--cinnabar);color:#fbeee2;border-color:var(--cinnabar);animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(181,53,43,.18)}}
#hints{position:fixed;inset:0;z-index:4;pointer-events:none;font-family:var(--kai);font-size:16px;letter-spacing:.12em}
.hint{position:absolute;padding:6px 14px;border-radius:20px;background:rgba(250,244,230,.82);color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.12);opacity:0;transition:opacity 1s;white-space:nowrap;transform:translateX(-50%)}
.hint.show{opacity:1}

#poem{position:fixed;z-index:3;pointer-events:none;display:flex;flex-direction:row-reverse;gap:.45em;align-items:flex-start;transition:opacity 2s}
#poem .col{writing-mode:vertical-rl;font-family:var(--kai);font-size:clamp(20px,3.3vh,34px);letter-spacing:.2em;color:#2a241c;text-shadow:0 0 6px rgba(244,236,218,.9)}
#poem .col.hl{color:#a32c22}
#poem .meta{writing-mode:vertical-rl;font-family:var(--kai);font-size:clamp(12px,1.75vh,17px);letter-spacing:.3em;color:#5a4e40;margin-top:1.4em}
#poem .ch{opacity:0;filter:blur(6px);display:inline-block;transition:opacity 1.1s,filter 1.4s}
#poem .ch.v{opacity:1;filter:blur(0)}
body.dark #poem .col{color:#ece3cd;text-shadow:0 0 12px rgba(0,0,0,.7)}
body.dark #poem .col.hl{color:#f2a07a}
body.dark #poem .meta{color:#c9bea6}
#poem .pseal{writing-mode:vertical-rl;background:var(--cinnabar);color:#f8e8da;font-family:var(--kai);font-size:13px;padding:5px 3px;border-radius:2px;margin-top:1em;opacity:0;transition:opacity 1s}
#poem .pseal.v{opacity:.92}

#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,0);z-index:8;font-family:var(--kai);font-size:clamp(19px,2.8vh,30px);letter-spacing:.3em;color:#2a231b;text-shadow:0 0 14px rgba(239,230,210,.95);pointer-events:none;opacity:0;transition:opacity .9s;text-align:center;width:max-content;max-width:90vw}
body.dark #toast{color:#f0e6cf;text-shadow:0 0 14px rgba(0,0,0,.9)}
#toast.show{opacity:1}
#flash{position:fixed;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none}
#bubbles{position:fixed;inset:0;z-index:5;pointer-events:none}
.bubble{position:absolute;max-width:min(320px,82vw);padding:8px 14px 7px;background:rgba(250,244,230,.92);border-radius:4px;border-left:3px solid var(--cinnabar);box-shadow:0 6px 24px rgba(40,25,10,.2);font-family:var(--kai);font-size:18px;letter-spacing:.1em;line-height:1.55;color:var(--ink);opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s}
.bubble.show{opacity:1;transform:none}
.bubble small{display:block;font-size:12px;color:var(--ink2);text-align:right;letter-spacing:.18em}
#stamp{position:fixed;left:50%;top:40%;z-index:35;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%)}
#stamp b{display:flex;align-items:center;justify-content:center;width:112px;height:112px;background:var(--cinnabar);color:#fbeee2;font:normal 78px var(--kai);border-radius:8px;box-shadow:inset 0 0 0 4px #f6dccb,inset 0 0 0 7px var(--cinnabar),0 10px 40px rgba(120,20,10,.35)}
#stamp small{margin-top:12px;font:20px var(--kai);letter-spacing:.3em;color:#fff;text-shadow:0 0 10px rgba(0,0,0,.7),0 0 2px #000}
#stamp.on{animation:stamp 1.7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6) rotate(-14deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}82%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.95) rotate(-6deg)}}
#modebar{position:fixed;top:calc(14px + env(safe-area-inset-top));left:12px;right:12px;margin:0 auto;width:fit-content;z-index:7;display:flex;align-items:center;gap:12px;padding:7px 7px 7px 16px;border-radius:30px;background:rgba(43,38,32,.85);color:#f3ead6;font-family:var(--kai);font-size:15px;letter-spacing:.08em;max-width:calc(100vw - 24px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#modebar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modebar .meter{flex:none;width:64px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
#modebar .meter b{display:block;height:100%;width:0;background:#eab37b}
body.moding #dock,body.moding #topbar,body.moding #hud{opacity:0;pointer-events:none}
body.qin canvas#cv{cursor:pointer}
#modebar button{flex:none;padding:7px 16px;border-radius:20px;background:var(--cinnabar);color:#fbeee2;font-family:var(--kai);letter-spacing:.2em}
#xpanel{position:fixed;top:calc(64px + env(safe-area-inset-top));right:14px;z-index:6;width:min(330px,calc(100vw - 28px));padding:14px 16px;border-radius:10px;background:rgba(8,20,28,.84);color:#bfefff;font:12.5px/1.75 ui-monospace,"SF Mono",Menlo,monospace;border:1px solid rgba(79,209,255,.35);box-shadow:0 0 30px rgba(79,209,255,.15)}
#xpanel h3{margin:0 0 6px;font:600 14px var(--song);letter-spacing:.2em;color:#7fe3ff}
#xpanel .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed rgba(79,209,255,.15)}
#xpanel .row b{color:#fff;font-weight:600}
#xpanel p{margin:8px 0 0;color:#8fcfe0;font-family:var(--song);line-height:1.7}

/* ---------- 百宝箱 ---------- */
#sheet{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,12,9,.36)}
.sheetIn{width:min(760px,100%);max-height:80vh;max-height:80dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
#sheet.on .sheetIn{transform:none}
.grip{width:42px;height:4px;border-radius:2px;background:rgba(60,40,20,.25);margin:4px auto 6px}
.sheetIn h2{margin:2px 0 4px;text-align:center;font:normal 24px var(--kai);letter-spacing:.4em}
.sheetIn h3{margin:14px 2px 8px;font:normal 14px var(--kai);letter-spacing:.3em;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.tile{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:11px;row-gap:2px;align-items:center;text-align:left;padding:10px 11px;border-radius:10px;background:var(--chip);border:1px solid var(--line);transition:transform .15s,box-shadow .2s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(60,40,20,.12)}
.tile i{grid-row:span 2;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--cinnabar);color:#fbeee2;font:normal 24px var(--kai);font-style:normal;border-radius:5px;box-shadow:inset 0 0 0 2px #f2d4c4,inset 0 0 0 3px var(--cinnabar)}
.tile b{font:normal 17px var(--kai);letter-spacing:.12em}
.tile small{font-size:11.5px;color:var(--ink2);line-height:1.35}
@media (min-width:900px){#sheet{align-items:center}.sheetIn{border-radius:14px;max-height:86vh;transform:translateY(24px);opacity:0;transition:transform .35s,opacity .3s}#sheet.on .sheetIn{opacity:1}.grip{display:none}}

/* ---------- 弹层 ---------- */
#modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(15,12,9,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#modal .card{position:relative;width:min(430px,100%);max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);overflow:auto;-webkit-overflow-scrolling:touch;padding:22px 20px 18px;border-radius:6px;background:linear-gradient(180deg,#f5ecd9,#e9dcc0);box-shadow:0 20px 80px rgba(0,0,0,.45);opacity:0;transform:translateY(14px);transition:opacity .3s,transform .3s}
#modal.on .card{opacity:1;transform:none}
#modal .card.wide{width:min(640px,100%)}
#modal h2{margin:0 0 12px;text-align:center;font:normal 24px var(--kai);letter-spacing:.32em}
#modal .x{position:absolute;top:6px;right:8px;width:38px;height:38px;font-size:26px;line-height:1;color:var(--ink2)}
.cbody{font-size:14.5px;line-height:1.75;color:var(--ink)}
.cbody p{margin:0 0 10px}
.cbody .sub{color:var(--ink2);font-size:13px;text-align:center}
.irow{display:flex;gap:8px}
.irow input,.cbody input[type=text]{flex:1;min-width:0;padding:10px 12px;font:17px var(--kai);letter-spacing:.06em;border:1px solid rgba(60,40,20,.3);background:#fbf6ea;border-radius:3px;outline:none;user-select:text;-webkit-user-select:text;color:var(--ink)}
.irow input:focus,.cbody input[type=text]:focus{border-color:var(--cinnabar)}
.irow .mic{width:46px;flex:none;font-size:19px;border:1px solid rgba(60,40,20,.3);border-radius:3px;background:#fbf6ea}
.irow .mic.live{background:var(--cinnabar);border-color:var(--cinnabar);animation:glow 1s infinite}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btns button,.irow .ok,.pill{flex:1;min-width:84px;padding:10px 12px;font:17px var(--kai);letter-spacing:.2em;border:1px solid rgba(60,40,20,.25);border-radius:3px;background:rgba(255,252,244,.6)}
.irow .ok{flex:none;min-width:64px}
.go,.btns .go,.irow .ok{background:var(--cinnabar)!important;color:#fbeee2;border-color:var(--cinnabar)!important}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 2px}
.chip{padding:5px 11px;border-radius:16px;background:var(--chip);border:1px solid var(--line);font:14px var(--kai);letter-spacing:.06em;color:var(--ink)}
.chip.on{background:var(--cinnabar);color:#fbeee2;border-color:var(--cinnabar)}
.big{font:normal clamp(22px,5.4vw,30px)/1.6 var(--kai);letter-spacing:.12em;text-align:center;margin:10px 0 4px;color:#2a221a}
.big .hl,.hl{color:#a32c22}
.src{text-align:right;font:13px var(--kai);letter-spacing:.2em;color:var(--ink2)}
.strike{text-align:center;font-size:14px;color:var(--ink2);text-decoration:line-through;text-decoration-color:rgba(181,53,43,.7)}
.res{min-height:20px}
.muted{color:var(--ink2);font-size:13px}
.shot{display:block;width:100%;border-radius:3px;box-shadow:0 6px 24px rgba(40,25,10,.25);user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
.tip{text-align:center;font-size:13px;color:var(--ink2);margin:10px 0 0}
#fatal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#111;color:#eee;font-size:16px;padding:30px;text-align:center}
@media (max-width:640px){
  .db{min-width:44px}.db i{width:38px;height:38px;font-size:18px}.db small{font-size:9.5px}
  #dock{gap:3px;padding:7px 8px 5px}
  #hud b{font-size:18px}#hud span{font-size:11.5px}
  #topbar button{width:34px;height:34px;font-size:15px}
  .hint{font-size:14px;white-space:normal;width:max-content;max-width:86vw;text-align:center}
  #modebar .meter{width:44px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}.tile{grid-template-columns:36px 1fr;padding:9px}.tile i{width:36px;height:36px;font-size:20px}.tile b{font-size:15px}.tile small{font-size:10.5px}
}
@media (max-height:500px){   /* 手机横屏：开卷页整体收紧，标题和底下一行小字都留在屏内 */
  #introContent{gap:1.4vh}.strip{font-size:24px;padding:10px 8px}.seal{width:36px;height:36px;font-size:13px}
  .lines{font-size:12px;line-height:1.7}#giftLine{font-size:15px;line-height:1.6}#openBtn{font-size:18px;padding:8px 18px 8px 28px}.foot{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.leaf{transition-duration:.8s}}
</style>
</head>
<body class="pre">
<canvas id="cv" aria-label="一幅实时生成、可以互动的青绿山水长卷"></canvas>

<div id="intro">
  <div class="leaf l"><div class="rod"></div></div>
  <div class="leaf r"><div class="rod"></div></div>
  <div id="introContent">
    <div class="title"><div class="strip">山河长卷</div><div class="seal">此刻<br>生成</div></div>
    <div id="giftLine" hidden></div>
    <div class="lines" id="introLines">
      <p>这幅画里，没有一张图片；你将听到的，没有一段录音。</p>
      <p>山是<em>函数</em>，水是<em>波</em>，树是一句<em>语法</em>，鸟群是<em>三条规则</em>，琴是一根<em>数学的弦</em>。</p>
      <p>念一句诗，画就变成诗里的样子；说一句大白话，它还你一句千古名句。</p>
      <p>它此刻只为你一个人生成，从不重复，也永远画不完。</p>
    </div>
    <button id="openBtn">展卷</button>
    <div class="foot">建议戴上耳机 · 手机横屏更开阔 · 像古人一样，从右向左展开</div>
  </div>
</div>

<div id="hud" class="ui"><b>山河长卷</b><span id="hudSub">丙午年 · 已行 0 里</span></div>
<div id="topbar" class="ui">
  <button data-act="travel" id="travelBtn" title="行止（空格）" aria-label="行止">行</button>
  <button data-act="sound" id="soundBtn" title="声音（M）" aria-label="声音">聲</button>
  <button data-act="full" id="fullBtn" title="全屏（F）" aria-label="全屏">⛶</button>
</div>

<script>
'use strict';
/* 山河长卷 · core —— 随机、噪声、颜色、全局状态。整幅画只由这些数学长出来。 */
const SH = window.SH = {};

SH.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
SH.lerp = (a, b, t) => a + (b - a) * t;
SH.smooth = t => t * t * (3 - 2 * t);
SH.sstep = (a, b, x) => SH.smooth(SH.clamp((x - a) / (b - a), 0, 1));
SH.TAU = Math.PI * 2;

function hash32(a) {
  a |= 0;
  a = (a + 0x7ed55d16 + (a << 12)) | 0;
  a = (a ^ 0xc761c23c ^ (a >>> 19)) | 0;
  a = (a + 0x165667b1 + (a << 5)) | 0;
  a = ((a + 0xd3a2646c) ^ (a << 9)) | 0;
  a = (a + 0xfd7046c5 + (a << 3)) | 0;
  a = (a ^ 0xb55a4f09 ^ (a >>> 16)) >>> 0;
  return a;
}
SH.hash32 = hash32;
// 整数格点 → [0,1)
SH.h1 = (i, seed = 0) => hash32(Math.imul(i | 0, 374761393) ^ Math.imul(seed | 0, 1274126177)) / 4294967296;
SH.h2 = (i, j, seed = 0) => hash32(Math.imul(i | 0, 374761393) ^ Math.imul(j | 0, 668265263) ^ Math.imul(seed | 0, 1274126177)) / 4294967296;

// mulberry32：给每座山、每棵树一个可复现的命运
SH.rng = seed => {
  let a = seed >>> 0;
  const r = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.range = (a, b) => a + (b - a) * r();
  r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.chance = p => r() < p;
  return r;
};

SH.noise1 = (x, seed = 0) => {
  const i = Math.floor(x), f = x - i;
  return SH.lerp(SH.h1(i, seed), SH.h1(i + 1, seed), SH.smooth(f));
};
SH.fbm1 = (x, seed = 0, oct = 4) => {
  let s = 0, amp = 0.5, f = 1, n = 0;
  for (let o = 0; o < oct; o++) { s += amp * SH.noise1(x * f, seed + o * 131); n += amp; amp *= 0.5; f *= 2.03; }
  return s / n;
};
SH.noise2 = (x, y, seed = 0) => {
  const xi = Math.floor(x), yi = Math.floor(y), u = SH.smooth(x - xi), v = SH.smooth(y - yi);
  const a = SH.h2(xi, yi, seed), b = SH.h2(xi + 1, yi, seed), c = SH.h2(xi, yi + 1, seed), d = SH.h2(xi + 1, yi + 1, seed);
  return SH.lerp(SH.lerp(a, b, u), SH.lerp(c, d, u), v);
};

// ---------- 颜色：取自《千里江山图》的石青、石绿、赭石与绢色 ----------
SH.hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
SH.mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
SH.rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const P = SH.P = {};
Object.entries({
  silk: '#efe6d2', silk2: '#e2d4b4', mist: '#f1eadb', ink: '#2b2620', ink2: '#4a4237',
  ochre: '#bb8b53', ochre2: '#9c6b3c', mala: '#4f9a7a', mala2: '#2c6a57', azur: '#2f6283', azur2: '#1d4461',
  far: '#9db1b4', cinnabar: '#b5352b', snow: '#f5f2ec', snowShade: '#a9bccb', night: '#141b2a', lamp: '#ffc06a'
}).forEach(([k, v]) => P[k] = SH.hex(v));

// 四季调色：山顶色、山腰色、树叶色、花色
SH.SEASONS = [
  { name: '春', top: '#4f9f86', top2: '#3d7a96', mid: '#78a86f', leaf: ['#8fb56d', '#a7c682', '#6f9d5a'], bloom: ['#eda7ad', '#f3c4c4', '#e88a95'], ground: '#a8b77a' },
  { name: '夏', top: '#2f7f66', top2: '#245e80', mid: '#4f8a5c', leaf: ['#3f7a4f', '#2f6544', '#4f8a55'], bloom: ['#e98aa0'], ground: '#7f9d63' },
  { name: '秋', top: '#5b8a74', top2: '#3d6a84', mid: '#b97a3f', leaf: ['#c4532f', '#d98b38', '#b03a2a', '#e1b04a'], bloom: [], ground: '#c09a5a' },
  { name: '冬', top: '#eef0ee', top2: '#c6d3dc', mid: '#9aa7a6', leaf: [], bloom: ['#d8474a', '#e8676a'], ground: '#d9d6cc' }
].map(s => ({ ...s, topC: SH.hex(s.top), top2C: SH.hex(s.top2), midC: SH.hex(s.mid), groundC: SH.hex(s.ground) }));

SH.KAI = '"Kaiti SC","STKaiti","KaiTi","BiauKai","楷体",serif';

// ---------- 全局状态 ----------
// ---------- 链接里带的信息：#s=种子 / #g=赠画（base64url 的 JSON） ----------
SH.b64e = obj => { let s = ''; new TextEncoder().encode(JSON.stringify(obj)).forEach(b => { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
SH.b64d = str => { try { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); return JSON.parse(new TextDecoder().decode(Uint8Array.from(s, c => c.charCodeAt(0)))); } catch (e) { return null; } };
SH.Q = new URLSearchParams(location.hash.slice(1));
SH.gift = (() => {
  const g = SH.Q.has('g') && SH.b64d(SH.Q.get('g'));
  if (!g || typeof g !== 'object') return null;
  const str = (v, n) => typeof v === 'string' ? v.replace(/[\u0000-\u001f<>]/g, '').slice(0, n) : '';
  const num = (v, a, b) => typeof v === 'number' && isFinite(v) ? Math.min(b, Math.max(a, v)) : null;
  return { t: str(g.t, 8), f: str(g.f, 8), m: str(g.m, 40), s: num(g.s, 0, 2 ** 31) | 0 || null, c: num(g.c, -1e9, 1e9), n: num(g.n, 0, 3), d: num(g.d, 0, 1) };
})();
SH.nameSeed = name => { let h = 2166136261; for (const ch of name) h = Math.imul(h ^ ch.codePointAt(0), 16777619); return (h >>> 0) % 1e9; };
SH.SEED = (SH.gift && (SH.gift.s || (SH.gift.t && SH.nameSeed(SH.gift.t)))) || (+SH.Q.get('s') | 0) || ((Math.random() * 1e9) | 0);
SH.S = {
  W: 0, H: 0, dpr: 1, k: 1, VH: 900, vw: 0, WATER: 668,
  cam: 0, camV: 0, travel: true, speed: 26, drag: null,
  t: 0, dt: 0, tod: 0.36, todAuto: true, todTarget: null, dayLen: 150,
  season: (() => { const m = new Date().getMonth(); return m < 2 || m === 11 ? 3 : m < 5 ? 0 : m < 8 ? 1 : 2; })(),
  night: 0, twilight: 0, dusk: 0, sunE: 0,
  xray: false, sound: true, started: false, raining: 0, rainTimer: 0,
  stats: { notes: 0, peaks: 0, trees: 0, birds: 0, boats: 0, planted: 0, lanterns: 0, koi: 0, chunks: 0 }
};
SH.toSX = (X, p) => X + SH.S.cam * p;         // 图层坐标 → 屏幕（虚拟单位）
SH.layerX0 = p => -SH.S.cam * p;               // 当前可见区左缘

SH.light = tod => {
  const e = Math.sin((tod - 0.25) * SH.TAU);   // 太阳高度：-1 子夜，0 晨昏，1 正午
  return { e, night: SH.sstep(0.06, -0.3, e), twilight: Math.exp(-(((e + 0.02) / 0.2) ** 2)), dusk: tod > 0.5 ? 1 : 0 };
};

SH.canvas = (w, h) => {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return [c, c.getContext('2d')];
};

// 软光点贴图（雾、萤火、灯晕共用）
const dotCache = new Map();
SH.softDot = (rgb, r = 32) => {
  const key = rgb.join(',') + '|' + r;
  if (dotCache.has(key)) return dotCache.get(key);
  const [c, g] = SH.canvas(r * 2, r * 2);
  const gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, SH.rgba(rgb, 1)); gr.addColorStop(0.35, SH.rgba(rgb, 0.45)); gr.addColorStop(1, SH.rgba(rgb, 0));
  g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
  dotCache.set(key, c);
  return c;
};

// 笔触：一串点，粗细随“笔压”起落
SH.brush = (g, pts, w0, w1, color, seed = 1) => {
  g.strokeStyle = color; g.lineCap = 'round';
  const n = pts.length - 1;
  for (let i = 0; i < n; i++) {
    const t = i / Math.max(1, n - 1);
    const press = Math.sin(Math.PI * SH.clamp(t * 1.15, 0, 1)) * 0.75 + 0.25;
    g.lineWidth = Math.max(0.3, SH.lerp(w0, w1, t) * press * (0.8 + 0.4 * SH.h1(i, seed)));
    g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[i + 1][0], pts[i + 1][1]); g.stroke();
  }
};

// 绢本纹理：纤维 + 噪点，整幅画最后叠一层
SH.makePaper = () => {
  const N = 384, [c, g] = SH.canvas(N, N), r = SH.rng(7);
  const img = g.createImageData(N, N), d = img.data;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const n = 0.55 * SH.noise2(x / 3, y / 3, 3) + 0.3 * SH.noise2(x / 11, y / 11, 9) + 0.15 * SH.h2(x, y, 5);
    const v = 236 + (n - 0.5) * 34, i = (y * N + x) * 4;
    d[i] = v; d[i + 1] = v - 6; d[i + 2] = v - 18; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.globalAlpha = 0.06; g.strokeStyle = '#6b5a40'; g.lineWidth = 0.6;
  for (let i = 0; i < 260; i++) {
    const x = r() * N, y = r() * N, l = r.range(6, 30), a = r.range(-0.5, 0.5) + (r() < 0.5 ? 0 : Math.PI / 2);
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + r.range(-3, 3), y + Math.sin(a) * l * 0.5 + r.range(-3, 3), x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  return c;
};

// 干支纪年：2026 → 丙午
SH.ganzhi = y => '甲乙丙丁戊己庚辛壬癸'[(y - 4) % 10] + '子丑寅卯辰巳午未申酉戌亥'[(y - 4) % 12];
SH.cnNum = n => ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'][n] || String(n);

</script>
<script>
'use strict';
/* 山河长卷 · flora —— 树是一句语法：参数化 L 系统。屋、亭、塔、芦苇也在这里。 */
(() => {
const { rng, clamp, lerp, TAU } = SH;

SH.L_RULE = 'A(l,w) → F(l,w) [ +A(0.74·l, 0.66·w) ] [ −A(0.66·l, 0.66·w) ]';

SH.treeModel = (kind, seed, season) => {
  const r = rng(seed);
  const m = { kind, segs: [], dots: [], pads: [], strands: [], h: 0, snow: season === 3 };
  if (kind === 'pine') buildPine(m, r); else buildLeafy(m, r, kind, season);
  let maxD = 1e-6;
  for (const s of m.segs) maxD = Math.max(maxD, s.d1);
  for (const s of m.segs) { s.t0 = s.d0 / maxD; s.t1 = s.d1 / maxD; }
  for (const p of m.dots) p.t = clamp(p.d / maxD, 0, 1);
  for (const p of m.pads) p.t = clamp(p.d / maxD, 0, 1);
  for (const p of m.strands) p.t = clamp(p.d / maxD, 0, 1);
  return m;
};

function buildLeafy(m, r, kind, season) {
  const willow = kind === 'willow';
  const maxDepth = willow ? 3 : r.int(4, 5);
  // 递归即重写：A → F [+A] [−A]
  const A = (x, y, ang, len, w, depth, dist) => {
    const bend = r.range(-0.3, 0.3);
    const mx = x + Math.sin(ang) * len * 0.5, my = y - Math.cos(ang) * len * 0.5;
    const a2 = ang + bend;
    const ex = mx + Math.sin(a2) * len * 0.5, ey = my - Math.cos(a2) * len * 0.5;
    m.segs.push({ x0: x, y0: y, x1: mx, y1: my, w, d0: dist, d1: dist + len * 0.5 });
    m.segs.push({ x0: mx, y0: my, x1: ex, y1: ey, w: w * 0.86, d0: dist + len * 0.5, d1: dist + len });
    m.h = Math.max(m.h, -ey);
    const nd = dist + len;
    if (depth >= maxDepth) { leaves(m, r, ex, ey, kind, season, nd, w, 1); return; }
    const n = depth > 0 && r() < 0.28 ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const side = n === 2 ? (i ? 1 : -1) : i - 1;
      const na = a2 * 0.8 + side * r.range(0.32, willow ? 0.8 : 0.72) + r.range(-0.12, 0.12);
      A(ex, ey, na, len * r.range(0.62, 0.8), w * 0.66, depth + 1, nd);
    }
    if (depth >= maxDepth - 1) leaves(m, r, ex, ey, kind, season, nd, w * 0.6, 0.45);
  };
  A(0, 0, r.range(-0.22, 0.22), willow ? r.range(15, 20) : r.range(17, 26), willow ? 5.4 : r.range(3.4, 4.6), 0, 0);
}

function leaves(m, r, x, y, kind, season, d, w, k) {
  const S = SH.SEASONS[season];
  if (kind === 'willow') {
    if (season === 3 && r() < 0.6) return;
    const col = ['#a6c46a', '#5c8c48', '#cdb35a', '#8d7c5f'][season];
    const n = Math.round(r.range(4, 7) * k);
    for (let i = 0; i < n; i++) m.strands.push({ x: x + r.range(-3, 3), y: y + r.range(-2, 2), L: r.range(14, 34), dx: r.range(-5, 5), c: col, d: d + r() * 3, a: season === 3 ? 0.35 : 0.72 });
    return;
  }
  let cols = S.leaf, a = 0.82, sz = [1.4, 2.8], n = Math.round(r.range(7, 13) * k);
  const blooms = (kind === 'peach' && season === 0) || (kind === 'plum' && (season === 3 || season === 0));
  if (season === 3 && !blooms) { m.dots.push({ x, y: y - 0.6, r: w * 0.8 + 0.7, c: '#f8f6f0', a: 0.92, d }); return; }
  if (blooms) { cols = season === 3 ? S.bloom : S.bloom.concat(kind === 'peach' ? ['#f7d6d2'] : ['#f6f1ea']); a = 0.92; sz = [1.0, 2.1]; if (season === 3) n = Math.round(n * 0.6); }
  if (kind === 'maple') cols = season === 2 ? ['#b8332a', '#cf4a2e', '#e07a35', '#a82a24'] : season === 1 ? ['#3f7a4f', '#55894d'] : cols;
  for (let i = 0; i < n; i++) {
    const ang = r() * TAU, rad = r() * 7 * k + 1;
    m.dots.push({ x: x + Math.cos(ang) * rad, y: y + Math.sin(ang) * rad * 0.75 - 1, r: r.range(sz[0], sz[1]), c: r.pick(cols), a: a * r.range(0.72, 1), d: d + r() * 4 });
  }
}

function buildPine(m, r) {
  const H = r.range(42, 70), N = 7, pts = [[0, 0]];
  let x = 0, y = 0, ang = r.range(-0.2, 0.2), dist = 0;
  for (let i = 0; i < N; i++) {
    ang += r.range(-0.24, 0.24) - ang * 0.25;
    const l = H / N, nx = x + Math.sin(ang) * l, ny = y - Math.cos(ang) * l;
    m.segs.push({ x0: x, y0: y, x1: nx, y1: ny, w: lerp(5.2, 2.0, i / N), d0: dist, d1: dist + l, bark: 1 });
    x = nx; y = ny; dist += l; pts.push([x, y]);
  }
  m.h = -y;
  const nb = r.int(4, 7);
  for (let b = 0; b < nb; b++) {
    const k = r.range(0.42, 0.95), idx = Math.min(N, Math.floor(k * N));
    let [bx, by] = pts[idx], bd = idx * H / N, w = lerp(2.6, 1.0, k);
    const side = b % 2 ? 1 : -1, L = r.range(10, 22) * (1.15 - k * 0.5);
    let ba = side * r.range(1.1, 1.75);
    for (let j = 0; j < 3; j++) {
      ba -= side * r.range(0.05, 0.25);                 // 枝梢上扬
      const l = L / 3, nx = bx + Math.sin(ba) * l, ny = by - Math.cos(ba) * l;
      m.segs.push({ x0: bx, y0: by, x1: nx, y1: ny, w, d0: bd, d1: bd + l });
      bx = nx; by = ny; bd += l; w *= 0.75;
      if (j >= 1) m.pads.push({ x: bx, y: by - 1, rx: r.range(7, 12) * (j === 2 ? 1 : 0.7), d: bd });
    }
  }
  m.pads.push({ x, y: y - 1, rx: r.range(9, 13), d: dist });
  for (const p of m.pads) p.ry = p.rx * r.range(0.32, 0.42);
}

// 画一棵树：grow∈[0,1] 是生长进度，sway 是风
SH.drawTree = (g, m, x, y, s, grow = 1, sway = 0) => {
  const H = m.h || 40;
  const P = (px, py) => {
    const k = sway ? Math.pow(clamp(-py / H, 0, 1.4), 2) * sway : 0;
    return [x + (px + k * 6) * s, y + py * s];
  };
  g.lineCap = 'round';
  for (const sg of m.segs) {
    if (sg.t0 >= grow) continue;
    const f = grow >= 1 ? 1 : clamp((grow - sg.t0) / Math.max(1e-4, sg.t1 - sg.t0), 0, 1);
    const [ax, ay] = P(sg.x0, sg.y0), [bx, by] = P(sg.x1, sg.y1);
    g.strokeStyle = sg.bark ? '#3a2e24' : '#43372b';
    g.lineWidth = Math.max(0.45, sg.w * s);
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(ax + (bx - ax) * f, ay + (by - ay) * f); g.stroke();
    if (sg.bark && s > 1.2 && f === 1) {                // 松鳞
      g.strokeStyle = 'rgba(200,180,150,.35)'; g.lineWidth = 0.6;
      g.beginPath(); g.arc((ax + bx) / 2, (ay + by) / 2, sg.w * s * 0.28, 0.2, 2.6); g.stroke();
    }
  }
  for (const st of m.strands) {
    if (st.t > grow) continue;
    const a = grow >= 1 ? 1 : clamp((grow - st.t) * 6, 0, 1), [sx, sy] = P(st.x, st.y), L = st.L * s * a, sw = sway * 8 * s;
    g.strokeStyle = st.c; g.globalAlpha = st.a; g.lineWidth = Math.max(0.4, 0.7 * s);
    g.beginPath(); g.moveTo(sx, sy); g.quadraticCurveTo(sx + st.dx * s * 0.4 + sw * 0.5, sy + L * 0.45, sx + st.dx * s + sw, sy + L); g.stroke();
  }
  for (const p of m.pads) {
    if (p.t > grow) continue;
    const a = grow >= 1 ? 1 : clamp((grow - p.t) * 5, 0, 1), [px, py] = P(p.x, p.y), rx = p.rx * s * a, ry = p.ry * s * a;
    if (rx < 0.3) continue;
    g.globalAlpha = 0.92; g.fillStyle = '#2a4538';
    g.beginPath(); g.ellipse(px, py, rx, ry, 0, 0, TAU); g.fill();
    g.globalAlpha = 0.8; g.strokeStyle = '#1b3027'; g.lineWidth = Math.max(0.35, 0.5 * s);
    g.beginPath();
    const n = Math.max(5, Math.round(rx / 1.5));
    for (let i = 0; i <= n; i++) { const ang = Math.PI * (1.05 + 0.9 * i / n); g.moveTo(px, py + ry * 0.2); g.lineTo(px + Math.cos(ang) * rx * 1.05, py + Math.sin(ang) * ry * 1.7); }
    g.stroke();
    g.globalAlpha = 0.5; g.fillStyle = '#527f62';
    g.beginPath(); g.ellipse(px - rx * 0.1, py - ry * 0.35, rx * 0.7, ry * 0.45, 0, 0, TAU); g.fill();
    if (m.snow) { g.globalAlpha = 0.95; g.fillStyle = '#f8f6f0'; g.beginPath(); g.ellipse(px, py - ry * 0.4, rx * 0.95, ry * 0.6, 0, Math.PI, TAU); g.fill(); }
  }
  for (const d of m.dots) {
    if (d.t > grow) continue;
    const a = grow >= 1 ? 1 : clamp((grow - d.t) * 6, 0, 1), [dx, dy] = P(d.x, d.y), rr = d.r * s * a;
    if (rr < 0.2) continue;
    g.globalAlpha = d.a; g.fillStyle = d.c;
    g.beginPath(); g.ellipse(dx, dy, rr, rr * 0.8, 0, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
};

// ---------- 建筑：屋、亭、塔。lights 收集夜里会亮起的窗 ----------
function roof(g, x, yb, half, ov, rh, color, ridge) {
  const L = [x - half - ov, yb - rh * 0.28], R = [x + half + ov, yb - rh * 0.28], top = yb - rh;
  g.fillStyle = color;
  g.beginPath(); g.moveTo(L[0], L[1]);
  g.quadraticCurveTo(x - half * 0.95, top + rh * 0.62, x - half * 0.55, top);
  g.lineTo(x + half * 0.55, top);
  g.quadraticCurveTo(x + half * 0.95, top + rh * 0.62, R[0], R[1]);
  g.quadraticCurveTo(x, yb + rh * 0.18, L[0], L[1]);
  g.fill();
  if (ridge) { g.strokeStyle = ridge; g.lineWidth = Math.max(0.6, rh * 0.12); g.beginPath(); g.moveTo(x - half * 0.62, top + 0.3); g.lineTo(x + half * 0.62, top + 0.3); g.stroke(); }
}

SH.drawHouse = (g, x, y, s, r, season, lights) => {
  const bw = r.range(22, 34) * s, bh = r.range(10, 14) * s, lw = Math.max(0.5, 0.7 * s);
  g.fillStyle = '#ece2cb'; g.strokeStyle = '#3b332a'; g.lineWidth = lw;
  g.fillRect(x - bw / 2, y - bh, bw, bh); g.strokeRect(x - bw / 2, y - bh, bw, bh);
  const nb = Math.max(2, Math.round(bw / (8 * s)));
  g.beginPath();
  for (let i = 1; i < nb; i++) { const cx = x - bw / 2 + bw * i / nb; g.moveTo(cx, y - bh); g.lineTo(cx, y); }
  g.stroke();
  const wi = r.int(0, nb - 1), wx = x - bw / 2 + bw * (wi + 0.5) / nb;
  g.fillStyle = '#5a4b3a'; g.fillRect(wx - 2.4 * s, y - bh * 0.78, 4.8 * s, bh * 0.48);
  if (lights) lights.push([wx, y - bh * 0.54, 1]);
  roof(g, x, y - bh, bw / 2, 6 * s, r.range(8, 11) * s, season === 3 ? '#ebe9e3' : '#56524b', season === 3 ? '#9aa3a8' : '#2e2b27');
};

SH.drawPavilion = (g, x, y, s, r, season, lights) => {
  const w = 16 * s, h = 11 * s;
  g.fillStyle = '#d9cdb2'; g.fillRect(x - w * 0.75, y - 2 * s, w * 1.5, 2 * s);
  g.strokeStyle = '#7d3326'; g.lineWidth = Math.max(0.6, 1.1 * s);
  g.beginPath();
  for (const cx of [-0.5, -0.17, 0.17, 0.5]) { g.moveTo(x + cx * w, y - 2 * s); g.lineTo(x + cx * w, y - 2 * s - h); }
  g.stroke();
  const base = y - 2 * s - h, tip = base - 13 * s;
  g.fillStyle = season === 3 ? '#ebe9e3' : '#4f4b45';
  g.beginPath(); g.moveTo(x - w / 2 - 8 * s, base - 3.5 * s);
  g.quadraticCurveTo(x - w * 0.2, base - 2 * s, x, tip);
  g.quadraticCurveTo(x + w * 0.2, base - 2 * s, x + w / 2 + 8 * s, base - 3.5 * s);
  g.quadraticCurveTo(x, base + 2.5 * s, x - w / 2 - 8 * s, base - 3.5 * s);
  g.fill();
  g.strokeStyle = '#2b2620'; g.beginPath(); g.moveTo(x, tip); g.lineTo(x, tip - 3.5 * s); g.stroke();
  if (lights) lights.push([x, y - 2 * s - h * 0.5, 0.7]);
};

SH.drawPagoda = (g, x, y, s, r, season, lights) => {
  const tiers = r.int(5, 7); let w = 13 * s, cy = y;
  for (let i = 0; i < tiers; i++) {
    const h = (i === 0 ? 9 : 6.2) * s * (1 - i * 0.05);
    g.fillStyle = '#e6dcc6'; g.strokeStyle = '#3b332a'; g.lineWidth = Math.max(0.4, 0.6 * s);
    g.fillRect(x - w / 2, cy - h, w, h); g.strokeRect(x - w / 2, cy - h, w, h);
    g.fillStyle = '#4a3d30'; g.fillRect(x - 1.2 * s, cy - h * 0.75, 2.4 * s, h * 0.5);
    if (lights && i % 2 === 0) lights.push([x, cy - h * 0.5, 0.6]);
    cy -= h;
    roof(g, x, cy + 1 * s, w / 2, 4.5 * s, 4.2 * s, season === 3 ? '#ebe9e3' : '#4c4842');
    cy -= 3 * s; w *= 0.86;
  }
  g.strokeStyle = '#2b2620'; g.lineWidth = Math.max(0.5, 0.8 * s);
  g.beginPath(); g.moveTo(x, cy); g.lineTo(x, cy - 9 * s); g.stroke();
  for (let i = 1; i <= 3; i++) { g.beginPath(); g.ellipse(x, cy - i * 2.2 * s, 1.6 * s, 0.6 * s, 0, 0, TAU); g.stroke(); }
};

SH.drawReeds = (g, x, y, s, r, season) => {
  const col = ['#7b9156', '#62804a', '#b39a5e', '#9c927a'][season], n = r.int(5, 11);
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const bx = x + r.range(-9, 9) * s, h = r.range(14, 30) * s, lean = r.range(-0.35, 0.15) * h;
    g.strokeStyle = col; g.globalAlpha = 0.85; g.lineWidth = Math.max(0.4, 0.8 * s);
    g.beginPath(); g.moveTo(bx, y); g.quadraticCurveTo(bx + lean * 0.2, y - h * 0.6, bx + lean, y - h); g.stroke();
    if (r() < 0.7) { g.beginPath(); g.moveTo(bx + lean * 0.1, y - h * 0.4); g.quadraticCurveTo(bx + lean * 0.6 - 4 * s, y - h * 0.7, bx + lean - 9 * s, y - h * 0.62); g.stroke(); }
    if (season >= 2 || r() < 0.2) {
      g.globalAlpha = 0.8; g.fillStyle = season === 3 ? '#f4f1ea' : '#efe6d4';
      g.beginPath(); g.ellipse(bx + lean - 1.5 * s, y - h - 2.5 * s, 1.5 * s, 4 * s, -0.5, 0, TAU); g.fill();
    }
  }
  g.globalAlpha = 1;
};
})();

</script>
<script>
'use strict';
/* 山河长卷 · terrain —— 山是函数：f(x) = Σ 峰(x) · 粗糙噪声。按“块”烘焙，无限延展。 */
(() => {
const { rng, clamp, lerp, sstep, fbm1, noise1, mix, rgba, P, TAU } = SH;
const S = SH.S, CH = 1024;

const LAYERS = SH.LAYERS = [
  { id: 0, name: '远山', p: 0.10, base: 598, hMin: 80, hMax: 210, wMin: 60, wMax: 150, cell: 140, dens: 0.85, style: 'far', res: 0.5 },
  { id: 1, name: '中山', p: 0.24, base: 630, hMin: 120, hMax: 320, wMin: 70, wMax: 165, cell: 160, dens: 0.75, style: 'mid', res: 0.6 },
  { id: 2, name: '主峰', p: 0.46, base: 664, hMin: 210, hMax: 520, wMin: 70, wMax: 180, cell: 185, dens: 0.66, style: 'main', res: 0.8 },
  { id: 3, name: '近岭', p: 0.74, base: S.WATER + 4, hMin: 55, hMax: 205, wMin: 95, wMax: 220, cell: 230, dens: 0.58, style: 'near', res: 0.9 },
  { id: 4, name: '汀洲', p: 1.22, base: 905, cell: 520, style: 'fore', res: 1, yTop: 640, yBot: 905 }
];
LAYERS.forEach(L => { if (L.style !== 'fore') { L.yTop = L.base - L.hMax - 90; L.yBot = L.base + 34; } });

// ---------- 峰：每个格子用种子决定 0~2 座山 ----------
const cellCache = new Map();
function cellPeaks(L, c) {
  const key = L.id * 1e7 + c;
  let v = cellCache.get(key);
  if (v) return v;
  v = [];
  const r = rng(SH.hash32(Math.imul(c, 7919) ^ Math.imul(L.id + 1, 104729) ^ SH.SEED));
  const n = r() < 0.38 ? 2 : 1, st = L.style;
  for (let i = 0; i < n; i++) {
    const cx = (c + r()) * L.cell;
    let mass = sstep(st === 'near' ? 0.42 : 0.3, 0.72, fbm1(cx / 1500 + L.id * 17.3, SH.SEED + L.id * 7));
    if (L.id === 2) mass = Math.max(mass, 0.9 * Math.exp(-(((cx - 700) / 650) ** 2)));   // 开卷第一眼要有主峰
    if (L.id === 3) mass = Math.max(mass, 0.8 * Math.exp(-(((cx - 1500) / 380) ** 2)));
    const roll = r();
    if (mass * L.dens + roll * 0.35 < 0.32) continue;
    const h = lerp(L.hMin, L.hMax, Math.pow(r(), 0.85)) * (0.5 + 0.5 * mass);
    const w = lerp(L.wMin, L.wMax, r()) * (0.6 + 0.55 * h / L.hMax), skew = r.range(-0.3, 0.3);
    v.push({
      L, id: key * 4 + i, cx, h, wl: w * (1 + skew), wr: w * (1 - skew),
      a: st === 'near' ? r.range(1.7, 2.4) : st === 'main' ? r.range(1.25, 1.9) : r.range(1.4, 2.1),
      b: st === 'near' ? r.range(1.0, 1.5) : st === 'main' ? r.range(1.6, 2.6) : r.range(1.3, 2.0),
      sh: r() < 0.3 ? 0 : r.range(0.25, 0.62), su: (r() < 0.5 ? -1 : 1) * r.range(0.3, 0.6),
      z: r(), tone: r(), seed: SH.hash32(key * 4 + i + SH.SEED), sh2: st === 'main' && r() < 0.5 ? r.range(0.3, 0.55) : 0
    });
  }
  cellCache.set(key, v);
  return v;
}

function peakF(pk, X) {
  const d = X - pk.cx, u = d < 0 ? d / pk.wl : d / pk.wr, au = Math.abs(u);
  if (au >= 1) return 0;
  let f = Math.pow(1 - Math.pow(au, pk.a), pk.b);
  if (pk.sh) { const q = (u - pk.su) / 0.38; if (q > -1 && q < 1) f = Math.max(f, pk.sh * Math.pow(1 - q * q, 1.6)); }
  if (pk.sh2) { const q = (u + pk.su * 0.8) / 0.3; if (q > -1 && q < 1) f = Math.max(f, pk.sh2 * Math.pow(1 - q * q, 1.6)); }
  return f * sstep(1, 0.86, au);
}
function peakY(pk, X) {
  const f = peakF(pk, X);
  if (f <= 0) return pk.L.base;
  const st = pk.L.style, big = st === 'main' || st === 'mid' ? 1 : 0.5;
  return pk.L.base - pk.h * f * (1 + big * 0.26 * (fbm1(X / 38, pk.seed) - 0.5) + 0.08 * (fbm1(X / 9, pk.seed + 5) - 0.5)) - (noise1(X / 4.5, pk.seed + 3) - 0.5) * 2.2 * f;
}
function top(li, X) {
  const L = LAYERS[li]; let y = L.base;
  const c0 = Math.floor((X - L.wMax * 1.7) / L.cell), c1 = Math.floor((X + L.wMax * 1.7) / L.cell);
  for (let c = c0; c <= c1; c++) for (const pk of cellPeaks(L, c)) if (X > pk.cx - pk.wl && X < pk.cx + pk.wr) y = Math.min(y, peakY(pk, X));
  return y;
}

// ---------- 画一座山：设色 → 阴阳 → 积雪 → 皴 → 脉 → 苔点 → 轮廓 → 草木屋舍 ----------
function drawPeak(g, pk, season, ch) {
  const L = pk.L, st = L.style, Z = SH.SEASONS[season], rr = rng(pk.seed);
  const x0 = pk.cx - pk.wl, x1 = pk.cx + pk.wr, ytop = L.base - pk.h * 1.08, yb = L.base + 30;
  const pts = [];
  for (let X = x0; X <= x1 + 0.01; X += 3) pts.push([X, peakY(pk, X)]);
  const path = new Path2D();
  path.moveTo(x0, yb); for (const p of pts) path.lineTo(p[0], p[1]); path.lineTo(x1, yb); path.closePath();
  const fb = (L.base - ytop) / (yb - ytop), gr = g.createLinearGradient(0, ytop, 0, yb);
  const topC = mix(Z.topC, Z.top2C, pk.tone);
  if (st === 'far') {
    const c = mix(P.far, topC, season === 3 ? 0.5 : 0.18);
    gr.addColorStop(0, rgba(c, 0.62)); gr.addColorStop(fb * 0.55, rgba(c, 0.34)); gr.addColorStop(fb, rgba(P.mist, 0.5)); gr.addColorStop(1, rgba(P.mist, 0));
  } else if (st === 'mid') {
    const c = mix(topC, P.far, 0.42);
    gr.addColorStop(0, rgba(c, 0.92)); gr.addColorStop(fb * 0.45, rgba(mix(c, Z.midC, 0.35), 0.8));
    gr.addColorStop(fb * 0.8, rgba(mix(P.ochre, P.mist, 0.45), 0.62)); gr.addColorStop(fb, rgba(P.mist, 0.92)); gr.addColorStop(1, rgba(P.mist, 0));
  } else if (st === 'main') {
    gr.addColorStop(0, rgba(topC, 1)); gr.addColorStop(fb * 0.3, rgba(mix(topC, Z.top2C, 0.35), 1));
    gr.addColorStop(fb * 0.62, rgba(mix(Z.midC, P.ochre, 0.45), 1)); gr.addColorStop(fb * 0.88, rgba(mix(P.ochre, P.mist, 0.2), 0.96));
    gr.addColorStop(fb, rgba(P.mist, 0.82)); gr.addColorStop(1, rgba(P.mist, 0));
  } else {
    gr.addColorStop(0, rgba(Z.groundC, 1)); gr.addColorStop(fb * 0.55, rgba(mix(Z.groundC, P.ochre, 0.55), 1)); gr.addColorStop(1, rgba(P.ochre2, 1));
  }
  g.fillStyle = gr; g.fill(path);
  if (st === 'far') return;

  g.save(); g.clip(path);
  const sh = g.createLinearGradient(pk.cx - pk.wl * 0.1, 0, x1, 0);               // 阴面
  sh.addColorStop(0, 'rgba(20,32,36,0)'); sh.addColorStop(1, st === 'near' ? 'rgba(40,40,20,.22)' : 'rgba(18,30,38,.3)');
  g.fillStyle = sh; g.fillRect(x0, ytop, x1 - x0, yb - ytop);
  if (season === 3) {                                                              // 积雪
    const sn = g.createLinearGradient(0, ytop, 0, ytop + pk.h * 0.62);
    sn.addColorStop(0, 'rgba(250,250,247,.95)'); sn.addColorStop(1, 'rgba(250,250,247,0)');
    g.fillStyle = sn; g.fillRect(x0, ytop, x1 - x0, pk.h);
  }
  // 皴：顺着山势的短笔，越往山腹越平
  const N = Math.round((pk.wl + pk.wr) * pk.h / (st === 'main' ? 360 : st === 'mid' ? 1000 : 1000));
  const inkTop = mix(Z.top2C, P.ink, 0.55), inkLow = mix(P.ochre2, P.ink, 0.45);
  for (let i = 0; i < N; i++) {
    const u = rr.range(-0.92, 0.92), X = pk.cx + (u < 0 ? u * pk.wl : u * pk.wr), ry = peakY(pk, X), depth = L.base - ry;
    if (depth < 8) continue;
    const dd = Math.pow(rr(), 1.6) * depth * 0.8, y = ry + dd + 2, k = dd / depth;
    const m = (peakY(pk, X + 3) - peakY(pk, X - 3)) / 6 * (1 - k * 0.7), dir = u < 0 ? -1 : 1, nrm = Math.hypot(1, m);
    const len = rr.range(6, 20) * (st === 'main' ? 1 : 0.8), q = [];
    for (let j = 0; j < 4; j++) { const t = j / 3 * len; q.push([X + dir / nrm * t + rr.range(-0.6, 0.6), y + dir * m / nrm * t + t * t * 0.012 + rr.range(-0.6, 0.6)]); }
    SH.brush(g, q, st === 'near' ? 1.1 : 1.5, 0.4, rgba(mix(inkTop, inkLow, k), season === 3 && k < 0.4 ? 0.16 : rr.range(0.16, 0.42)), i);
  }
  // 山脉：几道从峰顶垂下的脊线，一侧提亮
  if (st !== 'near') {
    const nl = st === 'main' ? rr.int(3, 5) : rr.int(1, 2);
    for (let i = 0; i < nl; i++) {
      const u = rr.range(-0.45, 0.45), sx = pk.cx + (u < 0 ? u * pk.wl : u * pk.wr), sy = peakY(pk, sx), depth = L.base - sy;
      if (depth < 40) continue;
      const side = u < 0 ? -1 : 1, q = [[sx, sy + rr.range(3, 10)]];
      for (let j = 1; j < 8; j++) { const p0 = q[j - 1]; q.push([p0[0] + side * (1.5 + j * 1.3) * rr.range(0.5, 1.3), p0[1] + depth * 0.095]); }
      g.lineCap = 'round'; g.lineWidth = 6; g.strokeStyle = rgba(mix(topC, P.mist, 0.5), 0.22);
      g.beginPath(); q.forEach((p, j) => j ? g.lineTo(p[0] + 3.5, p[1]) : g.moveTo(p[0] + 3.5, p[1])); g.stroke();
      SH.brush(g, q, 1.5, 0.5, rgba(P.ink, 0.32), i + 9);
      for (let j = 1; j < q.length; j += 2) moss(g, rr, q[j][0], q[j][1], st, season);
    }
  }
  g.restore();
  // 苔点 + 轮廓
  for (let i = 0; i < pts.length; i += rr.int(3, 6)) if (rr() < 0.6 && pts[i][1] < L.base - 10) moss(g, rr, pts[i][0], pts[i][1] + 1.5, st, season);
  const ol = pts.filter((_, i) => i % 2 === 0);
  SH.brush(g, ol, st === 'mid' ? 1.1 : 2.1, 0.8, rgba(season === 3 ? mix(P.ink, P.snowShade, 0.4) : P.ink, st === 'mid' ? 0.3 : 0.62), pk.seed);

  if (st === 'main' || st === 'near') decorate(g, pk, season, ch, rr);
}

// 瀑布分成两三叠，每叠略错开；烘焙与动画共用同一份几何
function fallSegs(X, yt, yb) {
  const n = yb - yt > 90 ? 3 : 2, out = [];
  for (let i = 0; i < n; i++) { const a = yt + (yb - yt) * i / n, b = yt + (yb - yt) * (i + 1) / n - 3; out.push([X + (SH.h1(i, X | 0) - 0.5) * 6, a, b, 1.6 + i * 0.9]); }
  return out;
}
SH.fallSegs = fallSegs;

function moss(g, rr, x, y, st, season) {
  const n = rr.int(2, 4), s = st === 'mid' ? 0.6 : st === 'near' ? 1.1 : 1;
  g.fillStyle = season === 3 ? 'rgba(60,64,62,.6)' : 'rgba(24,44,34,.72)';
  for (let i = 0; i < n; i++) { g.beginPath(); g.arc(x + rr.range(-4, 4), y + rr.range(-1, 2.5), rr.range(0.7, 1.9) * s, 0, TAU); g.fill(); }
}

function species(rr, season, wet) {
  const t = rr();
  if (wet && t < 0.4) return 'willow';
  return t < 0.34 ? 'pine' : t < 0.6 ? 'leafy' : t < 0.77 ? 'maple' : t < 0.9 ? (season === 3 ? 'plum' : 'peach') : 'plum';
}

function decorate(g, pk, season, ch, rr) {
  const L = pk.L, main = L.style === 'main', items = [];
  const inChunk = X => X >= ch.x0 && X < ch.x0 + CH;
  if (main && pk.h > 280 && rr() < 0.28) {                                        // 瀑布
    const X = pk.cx + (rr() < 0.5 ? -1 : 1) * rr.range(0.1, 0.28) * pk.wl, d0 = L.base - peakY(pk, X), yt = L.base - d0 * 0.72, ybot = L.base - d0 * rr.range(0.22, 0.32);
    for (const [x, a, b, w] of fallSegs(X, yt, ybot)) {
      const gr = g.createLinearGradient(0, a, 0, b);
      gr.addColorStop(0, 'rgba(250,248,242,.25)'); gr.addColorStop(0.15, 'rgba(250,248,242,.95)'); gr.addColorStop(1, 'rgba(250,248,242,.7)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(x - w * 0.7, a); g.lineTo(x + w * 0.7, a); g.lineTo(x + w, b); g.lineTo(x - w, b); g.fill();
      SH.brush(g, [[x - w - 1.2, a], [x - w - 1.6, (a + b) / 2], [x - w - 1, b]], 1.3, 0.8, 'rgba(30,32,30,.5)', 3);
      SH.brush(g, [[x + w + 1.2, a], [x + w + 1.8, (a + b) / 2], [x + w + 1, b]], 1.3, 0.8, 'rgba(30,32,30,.5)', 4);
      SH.brush(g, [[x - w - 3, b + 1], [x, b + 2.5], [x + w + 3, b + 1]], 1.6, 1, 'rgba(30,32,30,.45)', 5);
    }
    if (inChunk(X)) ch.falls.push([X, yt, ybot]);
  }
  const nT = Math.round((pk.wl + pk.wr) / (main ? 30 : 15) * rr.range(0.6, 1.2));
  for (let i = 0; i < nT; i++) {
    const u = rr.range(-0.86, 0.86), X = pk.cx + (u < 0 ? u * pk.wl : u * pk.wr), ry = peakY(pk, X), depth = L.base - ry;
    const y = ry + 2 + Math.pow(rr(), 2) * depth * (main ? 0.25 : 0.6);
    const kind = main ? (rr() < 0.7 ? 'pine' : species(rr, season, false)) : species(rr, season, y > L.base - 30);
    items.push({ y, f: () => SH.drawTree(g, SH.treeModel(kind, SH.hash32(pk.seed + i * 31), season), X, y, main ? rr.range(0.22, 0.36) : rr.range(0.42, 0.74)) });
  }
  if (!main && rr() < 0.55) {                                                      // 人家
    const side = rr() < 0.5 ? -1 : 1, n = rr.int(1, 3);
    for (let i = 0; i < n; i++) {
      const X = pk.cx + side * rr.range(0.5, 0.86) * (side < 0 ? pk.wl : pk.wr) + i * 26, y = Math.min(L.base - 4, peakY(pk, X) + rr.range(6, 16)), hr = rng(pk.seed + i);
      items.push({ y: y + 0.5, f: () => SH.drawHouse(g, X, y, hr.range(0.55, 0.75), hr, season, inChunk(X) ? ch.lights : null) });
    }
  }
  if (!main && pk.h > 110 && rr() < 0.25) { const X = pk.cx + rr.range(-6, 6), y = peakY(pk, X) + 1.5, hr = rng(pk.seed + 77); items.push({ y: y - 50, f: () => SH.drawPavilion(g, X, y, 0.55, hr, season, inChunk(X) ? ch.lights : null) }); }
  if (main && pk.h > 330 && rr() < 0.1) { const X = pk.cx, y = peakY(pk, X) + 2, hr = rng(pk.seed + 99); items.push({ y: y - 50, f: () => SH.drawPagoda(g, X, y, 0.42, hr, season, inChunk(X) ? ch.lights : null) }); }
  if (!main) for (let X = pk.cx - pk.wl * 0.9; X < pk.cx + pk.wr * 0.9; X += rr.range(30, 120)) {   // 岸石，三两成堆
    for (let j = 0, n = rr.int(1, 3); j < n; j++) {
      const x = X + j * rr.range(5, 10), y = L.base - rr.range(1, 7), rw = rr.range(3, 10), rh = rr.range(2.5, 6), tilt = rr.range(-0.25, 0.25);
      items.push({ y: 9999, f: () => { g.fillStyle = 'rgba(126,104,70,.92)'; g.strokeStyle = 'rgba(40,34,28,.6)'; g.lineWidth = 0.8; g.beginPath(); g.ellipse(x, y, rw, rh, tilt, Math.PI, TAU); g.closePath(); g.fill(); g.stroke(); } });
    }
  }
  items.sort((a, b) => a.y - b.y).forEach(it => it.f());
  if (inChunk(pk.cx)) ch.trees += nT;
}

// ---------- 前景汀洲：沙洲、芦苇、临水的松 ----------
function lotus(g, cx, cy, r) {                                                   // 接天莲叶：一片荷塘
  for (let i = 0, n = r.int(7, 14); i < n; i++) {
    const x = cx + r.range(-70, 70), y = cy + r.range(-10, 12), w = r.range(7, 13) * (0.7 + (y - cy + 10) / 40);
    g.fillStyle = r.pick(['#4f8a55', '#3f7a4f', '#5f9a5c']); g.strokeStyle = 'rgba(30,50,35,.5)'; g.lineWidth = 0.6;
    g.beginPath(); g.ellipse(x, y, w, w * 0.32, 0, 0.25, TAU - 0.05); g.lineTo(x, y); g.closePath(); g.fill(); g.stroke();
    if (r() < 0.3) {
      const fy = y - r.range(8, 16);
      g.strokeStyle = '#4f7a45'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 1, fy); g.stroke();
      g.fillStyle = r.pick(['#ec8fa3', '#f2a9b6', '#e57690']);
      for (const a of [-0.5, 0, 0.5]) { g.beginPath(); g.ellipse(x + 1 + Math.sin(a) * 3, fy - 3, 2.1, 4.4, a, 0, TAU); g.fill(); }
    }
  }
}

function drawFore(g, ch, season) {
  const L = LAYERS[4], Z = SH.SEASONS[season];
  if (season === 1) for (let c = Math.floor(ch.x0 / 360) - 1; c <= Math.floor((ch.x0 + CH) / 360) + 1; c++) {
    const r = rng(SH.hash32(c * 6151 + SH.SEED + 9));
    if (r() < 0.55) lotus(g, (c + r()) * 360, r.range(770, 880), r);
  }
  for (let c = Math.floor(ch.x0 / L.cell) - 1; c <= Math.floor((ch.x0 + CH) / L.cell) + 1; c++) {
    const r = rng(SH.hash32(c * 9973 + SH.SEED + 5));
    if (r() < 0.45) continue;
    const cx = (c + r()) * L.cell, w = r.range(70, 170), y0 = r.range(800, 872), hh = r.range(8, 22), big = r() < 0.3;
    const pts = [];
    for (let X = cx - w; X <= cx + w; X += 4) { const u = (X - cx) / w; pts.push([X, y0 - hh * Math.pow(Math.max(0, 1 - u * u), 0.7) * (0.85 + 0.3 * SH.noise1(X / 15, c))]); }
    const gr = g.createLinearGradient(0, y0 - hh, 0, y0 + 8);
    gr.addColorStop(0, rgba(Z.groundC, 1)); gr.addColorStop(1, rgba(mix(P.ochre, P.mist, 0.3), 1));
    g.fillStyle = gr; g.beginPath(); g.moveTo(cx - w, y0 + 8); pts.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(cx + w, y0 + 8); g.closePath(); g.fill();
    SH.brush(g, pts.filter((_, i) => i % 2 === 0), 2.2, 1, 'rgba(43,38,32,.6)', c);
    g.strokeStyle = 'rgba(43,38,32,.18)'; g.lineWidth = 0.8;
    for (let i = 0; i < 5; i++) { const yy = y0 + 2 + i * 3; g.beginPath(); g.moveTo(cx - w * (0.9 - i * 0.12), yy); g.lineTo(cx + w * (0.85 - i * 0.12), yy); g.stroke(); }
    for (let i = 0, n = r.int(2, 5); i < n; i++) { const X = cx + r.range(-0.75, 0.75) * w; SH.drawReeds(g, X, y0 - hh * 0.6 + r.range(0, 6), r.range(1.1, 1.6), rng(c * 13 + i), season); }
    if (big) {
      const X = cx + r.range(-0.4, 0.4) * w;
      SH.drawTree(g, SH.treeModel(r() < 0.6 ? 'pine' : species(r, season, true), SH.hash32(c + SH.SEED), season), X, y0 - hh * 0.8, r.range(1.3, 1.9));
    }
  }
}

// ---------- 块缓存与调度 ----------
let cache = new Map(), old = null, fade = 1, bakedSeason = S.season;
const key = (li, i) => li * 1e6 + i;
function bake(li, idx) {
  const L = LAYERS[li], x0 = idx * CH, ps = S.k * Math.min(2, S.dpr) * L.res;
  const [cv, g] = SH.canvas(CH * ps, (L.yBot - L.yTop) * ps);
  g.setTransform(ps, 0, 0, ps, -x0 * ps, -L.yTop * ps);
  const ch = { li, idx, x0, cv, lights: [], falls: [], peaks: [], trees: 0 };
  if (L.style === 'fore') drawFore(g, ch, bakedSeason);
  else {
    const list = [];
    for (let c = Math.floor((x0 - L.wMax * 1.7) / L.cell); c <= Math.floor((x0 + CH + L.wMax * 1.7) / L.cell); c++)
      for (const pk of cellPeaks(L, c)) if (pk.cx + pk.wr > x0 - 30 && pk.cx - pk.wl < x0 + CH + 30) list.push(pk);
    list.sort((a, b) => a.z - b.z || a.id - b.id);
    for (const pk of list) { drawPeak(g, pk, bakedSeason, ch); if (pk.cx >= x0 && pk.cx < x0 + CH) ch.peaks.push(pk); }
  }
  S.stats.chunks++;
  return ch;
}
const range = li => { const L = LAYERS[li], X0 = SH.layerX0(L.p); return [Math.floor(X0 / CH), Math.floor((X0 + S.vw) / CH)]; };

SH.terrain = {
  CH, LAYERS, cellPeaks, peakY, top,
  setSeason(sn, instant) {
    if (sn === bakedSeason && !instant) return;
    bakedSeason = sn;
    if (instant) { cache = new Map(); old = null; fade = 1; return; }
    old = cache; cache = new Map(); fade = 0;
  },
  reset() { cache = new Map(); old = null; fade = 1; },
  // 每帧：缺的块补上；可见的必须立刻有，前方的按时间预算慢慢烘
  update(dt, budgetMs = 9) {
    const t0 = performance.now(), soon = [];
    for (let li = 0; li < LAYERS.length; li++) {
      const [i0, i1] = range(li);
      for (let i = i0; i <= i1; i++) if (!cache.has(key(li, i))) { if (old) soon.unshift([li, i]); else cache.set(key(li, i), bake(li, i)); }
      for (const i of [i0 - 1, i1 + 1]) if (!cache.has(key(li, i))) soon.push([li, i]);
      for (const [k, ch] of cache) if (ch.li === li && (ch.idx < i0 - 3 || ch.idx > i1 + 3)) cache.delete(k);
    }
    for (const [li, i] of soon) { if (performance.now() - t0 > budgetMs) break; cache.set(key(li, i), bake(li, i)); }
    if (old) {
      let ready = true;
      for (let li = 0; li < LAYERS.length && ready; li++) { const [i0, i1] = range(li); for (let i = i0; i <= i1; i++) if (!cache.has(key(li, i))) { ready = false; break; } }
      if (ready) { fade = Math.min(1, fade + dt / 2.4); if (fade >= 1) old = null; }
    }
  },
  draw(g, li, alpha = 1) {
    const L = LAYERS[li], [i0, i1] = range(li), h = L.yBot - L.yTop, f = SH.smooth(fade);
    const blit = (map, a) => {
      if (a <= 0.003) return;
      g.globalAlpha = a * alpha;
      for (let i = i0; i <= i1; i++) { const ch = map.get(key(li, i)); if (ch) g.drawImage(ch.cv, SH.toSX(ch.x0, L.p), L.yTop, CH, h); }
    };
    if (old) { blit(old, 1 - f); blit(cache, f); } else blit(cache, 1);
    g.globalAlpha = 1;
  },
  visible(li) { const [i0, i1] = range(li), out = []; for (let i = i0; i <= i1; i++) { const ch = cache.get(key(li, i)); if (ch) out.push(ch); } return out; },
  // 看见数学：把每一层的 f(x) 画成青色曲线
  xray(g) {
    g.save(); g.font = `13px ui-monospace,Menlo,monospace`; g.lineWidth = 1.2;
    for (let li = 0; li < 4; li++) {
      const L = LAYERS[li], a = 0.35 + li * 0.18;
      g.strokeStyle = `rgba(79,209,255,${a})`; g.beginPath();
      for (let sx = 0; sx <= S.vw; sx += 6) { const y = top(li, sx - S.cam * L.p); sx ? g.lineTo(sx, y) : g.moveTo(sx, y); }
      g.stroke();
      g.fillStyle = `rgba(160,236,255,${a + 0.15})`;
      g.fillText(`${L.name}  视差 ${L.p}  f(x)=Σ h·(1−|u|^a)^b`, 14, L.base - L.hMax * 0.55 + li * 4);
      for (const ch of this.visible(li)) for (const pk of ch.peaks) {
        const sx = SH.toSX(pk.cx, L.p), y = peakY(pk, pk.cx);
        if (sx < -20 || sx > S.vw + 20) continue;
        g.beginPath(); g.moveTo(sx, y - 9); g.lineTo(sx - 5, y - 17); g.lineTo(sx + 5, y - 17); g.closePath(); g.fill();
        if (li >= 2) g.fillText(`h=${pk.h | 0} a=${pk.a.toFixed(2)} b=${pk.b.toFixed(2)}`, sx + 8, y - 12);
      }
    }
    g.restore();
  },
  // 神笔：把一座新山记进它所在的格子（走远再回来也还在），并重烘它压到的块
  addPeak(pk) {
    const L = pk.L;
    cellPeaks(L, Math.floor(pk.cx / L.cell)).push(pk);
    for (const [k, ch] of cache) if (ch.li === L.id && pk.cx + pk.wr > ch.x0 - 30 && pk.cx - pk.wl < ch.x0 + CH + 30) cache.set(k, bake(L.id, ch.idx));
  },
  // 单独烘一座山（起山动画用），返回画布和它在图层里的位置
  bakePeak(pk) {
    const L = pk.L, x0 = pk.cx - pk.wl - 40, w = pk.wl + pk.wr + 80, ps = S.k * Math.min(2, S.dpr) * L.res;
    const [cv, g] = SH.canvas(w * ps, (L.yBot - L.yTop) * ps);
    g.setTransform(ps, 0, 0, ps, -x0 * ps, -L.yTop * ps);
    drawPeak(g, pk, bakedSeason, { x0, lights: [], falls: [], peaks: [], trees: 0 });
    return { cv, x0, w, y0: L.yTop, h: L.yBot - L.yTop };
  },
  countPeaks() { let n = 0; for (let li = 0; li < 4; li++) for (const ch of this.visible(li)) n += ch.peaks.length; return n; },
  countTrees() { let n = 0; for (let li = 0; li < 5; li++) for (const ch of this.visible(li)) n += ch.trees; return n; }
};
})();

</script>
<script>
'use strict';
/* 山河长卷 · life —— 云、舟、鸟、鱼、灯、你种下的树。鸟群只遵守三条规则：别撞、对齐、靠拢。 */
(() => {
const { rng, clamp, lerp, rgba, TAU } = SH;
const S = SH.S, R = rng(SH.SEED ^ 0x5151), PB = 0.56, PL = 0.6;
const life = SH.life = { boats: [], flocks: [], kois: [], ripples: [], drops: [], lanterns: [], planted: [], glows: [] };

// ---------- 云：四层雾带，平底、横向 ----------
const sprites = [0, 1, 2, 3].map(i => {
  const r = rng(SH.SEED + i * 101), w = 640, h = 170, [c, g] = SH.canvas(w, h);
  for (let j = 0; j < 80; j++) {
    const u = r(), env = Math.sin(Math.PI * u), x = 30 + u * (w - 60), y = h * 0.66 - r() * h * 0.4 * env, rad = r.range(16, 50) * (0.45 + env);
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(251,248,241,.4)'); gr.addColorStop(1, 'rgba(251,248,241,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  return c;
});
const planes = [
  { p: 0.17, y0: 500, y1: 590, n: 4, a: 0.55, after: 0 }, { p: 0.35, y0: 440, y1: 600, n: 5, a: 0.55, after: 1 },
  { p: 0.55, y0: 400, y1: 610, n: 5, a: 0.5, after: 2 }, { p: 0.82, y0: 610, y1: 660, n: 3, a: 0.4, after: 3 }
].map((pl, i) => { const r = rng(SH.SEED + i * 77); pl.items = Array.from({ length: pl.n }, (_, j) => ({ X: r(), y: r.range(pl.y0, pl.y1), w: r.range(380, 820), h: r.range(70, 150), sp: j % 4, a: r.range(0.55, 1) * pl.a, drift: r.range(2, 7) })); return pl; });
life.drawClouds = (g, after) => {
  const Wrap = S.vw + 1700;
  for (const pl of planes) if (pl.after === after) for (const c of pl.items) {
    let sx = (c.X * Wrap + S.cam * pl.p + S.t * c.drift) % Wrap; if (sx < 0) sx += Wrap;
    g.globalAlpha = c.a * (1 - S.night * 0.45); g.drawImage(sprites[c.sp], sx - 850, c.y - c.h * 0.6, c.w, c.h);
  }
  g.globalAlpha = 1;
};

// ---------- 舟：渔舟（蓑笠翁）与帆船 ----------
function spawnBoat(X) {
  const y = R.range(694, 852), k = (y - 690) / 162;
  life.boats.push({ X, y, s: lerp(0.55, 1.25, k), v: (R() < 0.7 ? 1 : -1) * R.range(4, 11), type: R() < 0.62 ? 'skiff' : 'sail', ph: R() * TAU });
  life.boats.sort((a, b) => a.y - b.y);
}
function hull(g, x, y, L, d, s) {
  g.fillStyle = '#4a3a2c';
  g.beginPath(); g.moveTo(x - L, y - 4 * s); g.quadraticCurveTo(x, y - 0.8 * s, x + L, y - 5.5 * s); g.quadraticCurveTo(x + L * 0.4, y + d * s, x, y + d * s); g.quadraticCurveTo(x - L * 0.5, y + d * s, x - L, y - 4 * s); g.fill();
  g.fillStyle = 'rgba(40,36,30,.13)'; g.beginPath(); g.ellipse(x, y + (d + 2) * s, L * 0.95, 2.4 * s, 0, 0, TAU); g.fill();
}
function drawBoat(g, b) {
  const s = b.s, x = SH.toSX(b.X, 1), y = b.y + Math.sin(S.t * 1.5 + b.ph) * 1.1 * s, snow = S.season === 3;
  if (x < -120 || x > S.vw + 120) return;
  g.strokeStyle = 'rgba(43,38,32,.22)'; g.lineWidth = 0.8;                         // 尾迹
  for (let i = 1; i <= 3; i++) { const wx = x - Math.sign(b.v) * (24 + i * 12) * s; g.beginPath(); g.moveTo(wx - 8 * s, y + (2 + i) * s); g.lineTo(wx + 8 * s, y + (2 + i) * s); g.stroke(); }
  if (b.type === 'skiff') {
    hull(g, x, y, 26 * s, 3.5, s);
    g.fillStyle = '#ad8752'; g.beginPath(); g.ellipse(x - 5 * s, y - 3.5 * s, 9 * s, 6.5 * s, 0, Math.PI, TAU); g.fill();
    g.strokeStyle = 'rgba(60,40,20,.5)'; g.lineWidth = 0.6; for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(x - 5 * s + i * 3.4 * s, y - 3.5 * s); g.lineTo(x - 5 * s + i * 2.6 * s, y - 9.2 * s); g.stroke(); }
    if (snow) { g.fillStyle = '#f8f6f0'; g.beginPath(); g.ellipse(x - 5 * s, y - 8.5 * s, 7.5 * s, 2 * s, 0, Math.PI, TAU); g.fill(); }
    const fx = x + 11 * s;
    g.fillStyle = '#5f503e'; g.beginPath(); g.moveTo(fx - 4.5 * s, y - 3 * s); g.lineTo(fx + 4.5 * s, y - 3 * s); g.lineTo(fx, y - 11 * s); g.fill();
    g.fillStyle = '#c4a466'; g.strokeStyle = '#2b2620'; g.lineWidth = 0.6 * s;
    g.beginPath(); g.moveTo(fx - 6.5 * s, y - 10.5 * s); g.lineTo(fx + 6.5 * s, y - 10.5 * s); g.lineTo(fx, y - 14.8 * s); g.closePath(); g.fill(); g.stroke();
    if (snow) { g.fillStyle = '#f8f6f0'; g.beginPath(); g.moveTo(fx - 4 * s, y - 12 * s); g.lineTo(fx + 4 * s, y - 12 * s); g.lineTo(fx, y - 14.8 * s); g.fill(); }
    g.strokeStyle = 'rgba(43,38,32,.8)'; g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(fx + 3 * s, y - 8 * s); g.quadraticCurveTo(fx + 20 * s, y - 22 * s, fx + 36 * s, y - 25 * s); g.stroke();
    g.strokeStyle = 'rgba(43,38,32,.35)'; g.lineWidth = 0.5; g.beginPath(); g.moveTo(fx + 36 * s, y - 25 * s); g.lineTo(fx + 37 * s, y + 3 * s); g.stroke();
    b.glow = [x - 22 * s, y - 7 * s, 0.6 * s];
  } else {
    hull(g, x, y, 34 * s, 5, s);
    g.fillStyle = '#7a6248'; g.fillRect(x - 14 * s, y - 9 * s, 14 * s, 6 * s);
    g.strokeStyle = '#2b2620'; g.lineWidth = 1 * s; g.beginPath(); g.moveTo(x + 2 * s, y - 4 * s); g.lineTo(x + 2 * s, y - 50 * s); g.stroke();
    g.fillStyle = 'rgba(218,197,150,.96)'; g.lineWidth = 0.7 * s;
    g.beginPath(); g.moveTo(x + 2 * s, y - 48 * s); g.quadraticCurveTo(x + 14 * s, y - 47 * s, x + 21 * s, y - 43 * s); g.quadraticCurveTo(x + 24 * s, y - 27 * s, x + 22 * s, y - 11 * s); g.lineTo(x + 2 * s, y - 10 * s); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = 'rgba(80,60,40,.55)'; g.lineWidth = 0.6;
    for (let i = 1; i < 6; i++) { const yy = y - 48 * s + i * 6.4 * s; g.beginPath(); g.moveTo(x + 2 * s, yy); g.lineTo(x + 22 * s, yy + 0.8 * s); g.stroke(); }
    const fx = x - 26 * s;
    g.fillStyle = '#4d4034'; g.beginPath(); g.moveTo(fx - 2.5 * s, y - 4 * s); g.lineTo(fx + 2.5 * s, y - 4 * s); g.lineTo(fx, y - 12 * s); g.fill();
    g.beginPath(); g.arc(fx, y - 13 * s, 1.6 * s, 0, TAU); g.fill();
    g.strokeStyle = '#3a2e24'; g.lineWidth = 0.9 * s; g.beginPath(); g.moveTo(fx + 1 * s, y - 9 * s); g.lineTo(fx - 14 * s, y + 4 * s); g.stroke();
    b.glow = [x - 6 * s, y - 12 * s, 0.8 * s];
  }
}
life.drawBoats = g => life.boats.forEach(b => drawBoat(g, b));

// ---------- 鸟：boids（分离、对齐、聚合）+ 雁阵 + 白鹭 ----------
life.spawnFlock = (kind, X, y, opt = {}) => {
  const dir = opt.dir || (R() < 0.5 ? -1 : 1), n = opt.n || (kind === 'flock' ? R.int(8, 15) : R.int(6, 10)), birds = [];
  for (let i = 0; i < n; i++) {
    const a = opt.burst ? R() * TAU : 0, sp = opt.burst ? R.range(30, 70) : 36;
    birds.push({ X: X + (opt.burst ? R.range(-6, 6) : R.range(-40, 40)), y: y + (opt.burst ? R.range(-6, 6) : R.range(-25, 25)), vx: opt.burst ? Math.cos(a) * sp : dir * sp, vy: opt.burst ? Math.sin(a) * sp - 20 : 0, ph: R() * TAU, k: i });
  }
  life.flocks.push({ kind, dir, birds, alt: clamp(y, 120, 470), age: 0, lx: X, ly: y, vy: kind === 'egret' ? -13 : R.range(-3, 3) });
  if (kind !== 'flock') SH.audio && SH.audio.birds(kind);
};
function updateFlock(f, dt) {
  f.age += dt;
  if (f.kind !== 'flock') {                                                        // 阵型：领头鸟匀速，其余按偏移跟随
    f.lx += f.dir * 34 * dt; f.ly += f.vy * dt;
    for (const b of f.birds) {
      const k = Math.ceil(b.k / 2), side = b.k % 2 ? 1 : -1;
      const tx = f.lx - f.dir * k * (f.kind === 'egret' ? 13 : 11), ty = f.ly + (f.kind === 'egret' ? b.k * 8 : side * k * 5.5);
      b.X += (tx - b.X) * Math.min(1, dt * 2.5); b.y += (ty - b.y) * Math.min(1, dt * 2.5); b.ph += dt * (f.kind === 'egret' ? 5 : 6.5);
    }
    return;
  }
  for (const b of f.birds) {
    let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, n = 0;

      if (o === b) continue;

life.drawBirds = g => {
  for (const f of life.flocks) for (const b of f.birds) {
    const x = SH.toSX(b.X, PB);
    if (x < -20 || x > S.vw + 20) continue;
    const s = f.kind === 'flock' ? 0.95 : f.kind === 'geese' ? 1.25 : 1.35;

// ---------- 锦鲤、涟漪、水花 ----------
life.ripple = (X, y, big = 1) => life.ripples.push({ X, y, t: 0, T: 2.6 * big, m: 34 * big });

  g.beginPath(); g.moveTo(-7.5 * s, 0); g.lineTo(-14 * s, -4.5 * s + Math.sin(S.t * 20) * 1.5 * s); g.lineTo(-12.5 * s, 0); g.lineTo(-14 * s, 4.5 * s); g.closePath(); g.fill(); g.stroke();

life.lantern = (sx, y) => { life.lanterns.push({ X: sx - S.cam * PL, y, vy: -R.range(9, 15), ph: R() * TAU, s: R.range(0.9, 1.25), age: 0 }); S.stats.lanterns++; };

// ---------- 你种下的树 ----------
const PLANT = [['peach', 'peach', 'willow', 'leafy'], ['leafy', 'willow', 'pine', 'leafy'], ['maple', 'maple', 'leafy', 'pine'], ['plum', 'plum', 'pine', 'pine']];
life.plant = (li, X, y, kind = R.pick(PLANT[S.season])) => {                   // kind 不给就按季节挑
  const seed = R() * 1e9 | 0;
  life.planted.push({ li, X, y, kind, seed, s: li === 3 ? R.range(0.8, 1.1) : R.range(0.38, 0.5), m: SH.treeModel(kind, seed, S.season), born: S.t, ph: R() * TAU });

};
life.onSeason = sn => life.planted.forEach(p => p.m = SH.treeModel(p.kind, p.seed, sn));
life.drawPlanted = (g, li) => {
  const L = SH.LAYERS[li];

    const x = SH.toSX(p.X, L.p);

    SH.drawTree(g, p.m, x, p.y, p.s, SH.smooth(clamp((S.t - p.born) / 3.6, 0, 1)), Math.sin(S.t * 1.4 + p.ph) * 0.14 * (0.4 + S.wind));

// ---------- 每帧 ----------
let flockTimer = 4;
life.update = dt => {
  const X0 = SH.layerX0(1);
  life.boats = life.boats.filter(b => b.X > X0 - 900 && b.X < X0 + S.vw + 900);
  if (!life.boats.length) for (let i = 0; i < 3; i++) spawnBoat(X0 + R.range(0.1, 0.9) * S.vw);
  while (life.boats.length < 4) spawnBoat(X0 - R.range(150, 700));
  for (const b of life.boats) b.X += b.v * dt;

    life.spawnFlock(S.season === 2 && R() < 0.7 ? 'geese' : R() < 0.15 ? 'egret' : 'flock', X, y, { dir: fromLeft ? 1 : -1 });

  life.flocks = life.flocks.filter(f => f.age < 4 || f.birds.some(b => b.X > bx0 - 300 && b.X < bx0 + S.vw + 300 && b.y > -80));

})();

<script>
'use strict';
/* 山河长卷 · sky —— 天色、日月、星、水纹与倒影、瀑布、四季天气、夜里的灯火。 */
(() => {
const { rng, clamp, lerp, mix, rgba, hex, TAU, P } = SH;

const C = k => hex(k);
const DAY = [C('#e4d8bd'), C('#f2eadb')], TWI = [C('#b9a6a8'), C('#f1bf92')], NIGHT = [C('#0c111c'), C('#26304a')];

const stars = Array.from({ length: 170 }, () => ({ x: R(), y: Math.pow(R(), 1.4) * 520, r: R.range(0.4, 1.5), ph: R() * TAU, f: R.range(0.8, 3) }));

sky.drawSky = g => {
  const L = SH.light(S.tod), top = mix(mix(DAY[0], TWI[0], L.twilight * 0.9), NIGHT[0], L.night), hor = mix(mix(DAY[1], TWI[1], L.twilight), NIGHT[1], L.night);
  const gr = g.createLinearGradient(0, 0, 0, S.WATER);
  gr.addColorStop(0, rgba(top)); gr.addColorStop(1, rgba(hor));
  g.fillStyle = gr; g.fillRect(0, 0, S.vw, S.WATER + 2);
  if (L.night > 0.02) for (const s of stars) {
    const a = L.night * (0.45 + 0.55 * Math.sin(S.t * s.f + s.ph)) * 0.9;
    if (a <= 0.02) continue;
    const x = ((s.x * (S.vw + 200) + S.cam * 0.015) % (S.vw + 200) + S.vw + 200) % (S.vw + 200) - 100;
    g.fillStyle = `rgba(255,250,235,${a})`; g.beginPath(); g.arc(x, s.y, s.r, 0, TAU); g.fill();
  }
  // 日：一枚朱红的印
  const pd = (S.tod - 0.2) / 0.6;
  if (pd > -0.05 && pd < 1.05 && L.e > -0.15) {
    const x = S.vw * (0.86 - 0.72 * pd), y = S.WATER - 70 - Math.max(-0.2, L.e) * 400, r = 24 + 12 * (1 - clamp(L.e, 0, 1));
    const c = mix([200, 62, 42], [230, 196, 140], clamp(L.e * 1.6, 0, 1));
    g.drawImage(SH.softDot(c, 64), x - r * 3, y - r * 3, r * 6, r * 6);
    g.fillStyle = rgba(c, 0.88 * (1 - L.night)); g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();

  } else sky.sun = null;

  if (L.night > 0.02 && pm > -0.05 && pm < 1.05) {
    const x = S.vw * (0.8 - 0.62 * pm), y = 120 + Math.pow(Math.abs(pm - 0.5) * 2, 2) * 300, r = 21;
    g.globalAlpha = L.night;
    g.drawImage(SH.softDot([255, 244, 214], 64), x - r * 5, y - r * 5, r * 10, r * 10);
    g.fillStyle = '#f6efdc'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.fillStyle = 'rgba(200,190,165,.35)'; [[-6, -4, 5], [5, 6, 4], [3, -8, 2.5]].forEach(([dx, dy, rr]) => { g.beginPath(); g.arc(x + dx, y + dy, rr, 0, TAU); g.fill(); });

};

// ---------- 水：底色、倒影、水纹 ----------
let ripTile = null;
sky.resize = () => {
  const ps = S.k * Math.min(2, S.dpr), W = 1024, H = 900 - S.WATER, [c, g] = SH.canvas(W * ps, H * ps), r = rng(SH.SEED + 3);
  g.scale(ps, ps); g.lineCap = 'round';
  for (let y = 3; y < H; y += 2.2 + (y / H) * 9 * r.range(0.7, 1.3)) {
    const k = y / H, amp = 0.6 + k * 2.2, wl = 8 + k * 26;
    let x = r() * 40;
    while (x < W) {

      g.strokeStyle = `rgba(43,52,50,${r.range(0.05, 0.13) * (0.6 + k * 0.6)})`; g.lineWidth = 0.5 + k * 0.7;

sky.drawWater = g => {

    for (let x = off - 1024; x < S.vw; x += 1024) g.drawImage(ripTile, x, Y, 1024, H);
  }
  g.restore();
  const mb = g.createLinearGradient(0, Y - 20, 0, Y + 28);                         // 岸边一抹雾，化开水陆交界
  mb.addColorStop(0, 'rgba(241,234,219,0)'); mb.addColorStop(0.42, 'rgba(241,234,219,.62)'); mb.addColorStop(1, 'rgba(241,234,219,0)');
  g.fillStyle = mb; g.fillRect(0, Y - 20, S.vw, 48);
};

// ---------- 瀑布：一行流动的虚线 ----------
sky.drawFalls = g => {
  const L = SH.LAYERS[2];
  g.save(); g.lineCap = 'round';
  for (const ch of SH.terrain.visible(2)) for (const [X, yt, yb] of ch.falls) {
    const x0 = SH.toSX(X, L.p);
    if (x0 < -20 || x0 > S.vw + 20) continue;
    for (const [fx, a, b, w] of SH.fallSegs(X, yt, yb)) {
      const x = x0 + fx - X;
      g.strokeStyle = 'rgba(255,255,252,.85)'; g.lineWidth = 0.9;
      for (let i = -1; i <= 1; i++) { g.setLineDash([5 + i * 2, 6]); g.lineDashOffset = -S.t * (50 + i * 8); g.beginPath(); g.moveTo(x + i * w * 0.4, a + 2); g.lineTo(x + i * w * 0.6, b); g.stroke(); }

      const pr = 7 + w * 2.4 + Math.sin(S.t * 3 + a) * 1.5;
      g.globalAlpha = 0.75; g.drawImage(SH.softDot([252, 250, 244], 32), x - pr, b - pr * 0.45, pr * 2, pr); g.globalAlpha = 1;

};

// ---------- 天气：花瓣、雨、落叶、雪 ----------
const parts = [];
function want() {
  const sn = S.season, b = Math.round((S.blow || 0) * 240);                      // 吹气：春夏落花、秋落叶、冬扬雪
  const n = { petal: (sn === 0 ? 70 : 0) + (sn < 2 ? b : 0), leaf: sn === 2 ? 46 + b : 0, snow: sn === 3 ? 260 + b : 0, rain: Math.round(340 * S.raining) };
  return n;
}
function spawn(kind, anywhere) {
  const p = { kind, x: R() * (S.vw + 200) - 100, y: anywhere ? R() * 900 : -20 - R() * 80, z: R.range(0.5, 1.4), rot: R() * TAU, vr: R.range(-3, 3), ph: R() * TAU };
  if (S.blow > 0.15 && kind !== 'rain') { p.x = -40 - R() * 80; p.y = R() * 760; }   // 风从左边来
  if (kind === 'rain') { p.vy = R.range(700, 900); p.vx = -120; p.ground = R.range(S.WATER + 4, 900); }
  else if (kind === 'snow') { p.vy = R.range(18, 45) * p.z; p.vx = R.range(-8, 8); }
  else { p.vy = R.range(22, 48); p.vx = R.range(-28, -8); p.c = kind === 'petal' ? R.pick(['#f2b8bd', '#f7d3d3', '#eb9aa4']) : R.pick(['#c4532f', '#d98b38', '#b03a2a', '#e1b04a']); }

}

  for (const k in n) for (let i = have[k] || 0; i < n[k]; i++) spawn(k, (have[k] || 0) === 0 && k !== 'rain');
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if ((have[p.kind] || 0) > n[p.kind] && p.y < 0) { parts.splice(i, 1); have[p.kind]--; continue; }

    p.x += (p.vx + wind) * dt + S.camDelta * 1.05 * p.z; p.y += p.vy * dt;
    if (p.kind !== 'rain') { p.x += Math.sin(S.t * 1.3 + p.ph) * 12 * dt; p.rot += p.vr * dt; }
    if (p.x < -120) p.x += S.vw + 240; else if (p.x > S.vw + 120) p.x -= S.vw + 240;
    const floor = p.kind === 'rain' ? p.ground : 910;
    if (p.y > floor) {
      if (p.kind === 'rain' && R() < 0.25) SH.life.ripple(p.x - S.cam, p.y, 0.25);
      if ((have[p.kind] || 0) > n[p.kind]) { parts.splice(i, 1); have[p.kind]--; continue; }
      p.y = -20 - R() * 60; p.x = R() * (S.vw + 200) - 100;
    }
  }
};
sky.drawWeather = g => {
  const dim = 1 - S.night * 0.55;
  for (const p of parts) {
    g.globalAlpha = p.kind === 'snow' ? 1 : dim;
    if (p.kind === 'rain') { g.strokeStyle = 'rgba(80,92,100,.32)'; g.lineWidth = 0.8; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x + 0.025 * 140, p.y - 16); g.stroke(); }
    else if (p.kind === 'snow') { g.fillStyle = `rgba(255,255,255,${0.55 + 0.35 * (p.z - 0.5)})`; g.beginPath(); g.arc(p.x, p.y, 1.1 * p.z + 0.4, 0, TAU); g.fill(); }
    else {
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, 0.55 + 0.45 * Math.sin(S.t * 3 + p.ph));
      g.fillStyle = p.c; g.beginPath();
      if (p.kind === 'petal') g.ellipse(0, 0, 3.4 * p.z, 2.2 * p.z, 0, 0, TAU);
      else { g.moveTo(-5 * p.z, 0); g.quadraticCurveTo(0, -3.4 * p.z, 5 * p.z, 0); g.quadraticCurveTo(0, 3.4 * p.z, -5 * p.z, 0); }
      g.fill(); g.restore();
    }
  }
  g.globalAlpha = 1;
};

// ---------- 夜：灯、渔火、孔明灯、萤火、月光在水上 ----------
const flies = Array.from({ length: 46 }, () => ({ x: R() * 2000, y: R.range(520, 780), ph: R() * TAU, f: R.range(0.6, 1.6) }));
sky.drawGlows = g => {
  const N = S.night, lamp = P.lamp;
  g.save(); g.globalCompositeOperation = 'lighter';
  if (N > 0.05) {
    for (const li of [2, 3]) {
      const L = SH.LAYERS[li], sz = li === 2 ? 7 : 11;
      for (const ch of SH.terrain.visible(li)) for (const [X, y, k] of ch.lights) {
        const x = SH.toSX(X, L.p);
        if (x < -30 || x > S.vw + 30) continue;
        const a = N * (0.78 + 0.22 * Math.sin(S.t * 2.7 + X));
        g.globalAlpha = a; g.drawImage(SH.softDot(lamp, 32), x - sz * 2 * k, y - sz * 2 * k, sz * 4 * k, sz * 4 * k);
        g.fillStyle = '#ffd994'; g.fillRect(x - 1.6 * k, y - 2 * k, 3.2 * k, 4 * k);
      }
    }
    for (const b of SH.life.boats) if (b.glow) {
      const [x, y, k] = b.glow; g.globalAlpha = N * (0.8 + 0.2 * Math.sin(S.t * 6 + b.ph));

    }

      const [mx] = sky.moon;

<script>
'use strict';
/* 山河长卷 · dragon —— 青龙戏珠。龙身是一条“跟随链”：每一节只做一件事——跟紧前一节。 */
(() => {

const D = SH.dragon = { active: false, t: 0, body: [], pearl: [0, 0], dir: -1 };

function path(t) {
  if (D.route) {                                                                   // 神笔画的路：按弧长匀速走
    const { pts, cum } = D.route, s = clamp(t * D.v, 0, cum[cum.length - 1]);
    let i = 1; while (i < cum.length - 1 && cum[i] < s) i++;
    const k = (s - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1);
    return [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)];
  }
  const u = t / T, d = D.dir;
  let x = d < 0 ? lerp(S.vw + 260, -760, u) : lerp(-260, S.vw + 760, u);
  let y = 290 + 85 * Math.sin(u * TAU * 1.2 + D.ph) + 62 * Math.sin(u * TAU * 5.2 + D.ph * 2);
  if (u > 0.36 && u < 0.5) { const th = (u - 0.36) / 0.14 * TAU; x += -d * 115 * Math.sin(th); y -= 95 * (1 - Math.cos(th)); }

// 神笔：龙沿着你画的线飞。pts 是屏幕虚拟坐标；首尾各顺着笔势补一段，让它从画外来、回画外去
D.fly = pts => {
  if (D.active || pts.length < 2) return false;
  const n = pts.length;
  const unit = (p, q) => { const dx = p[0] - q[0], dy = p[1] - q[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  const exit = (p, [ux, uy]) => Math.min(ux > 0 ? (S.vw + 150 - p[0]) / ux : ux < 0 ? (-150 - p[0]) / ux : 1e9, uy > 0 ? (1050 - p[1]) / uy : uy < 0 ? (-150 - p[1]) / uy : 1e9);
  const ub = unit(pts[0], pts[Math.min(5, n - 1)]), ue = unit(pts[n - 1], pts[Math.max(0, n - 6)]);
  const d0 = exit(pts[0], ub), d1 = exit(pts[n - 1], ue) + N * SEG + 160;        // 尾巴也要飞出画外才算完
  const start = [pts[0][0] + ub[0] * d0, pts[0][1] + ub[1] * d0], route = [start, ...pts, [pts[n - 1][0] + ue[0] * d1, pts[n - 1][1] + ue[1] * d1]];
  const cum = [0];
  for (let i = 1; i < route.length; i++) cum.push(cum[i - 1] + Math.hypot(route[i][0] - route[i - 1][0], route[i][1] - route[i - 1][1]));

  return true;
};

D.summon = dir => {
  if (D.active) return false;
  if (!dir) { D.route = null; D.T = T; }
  D.active = true; D.t = 0; D.dir = dir || (Math.random() < 0.7 ? -1 : 1); D.ph = Math.random() * TAU;
  const [x, y] = path(0);

D.update = dt => {

  D.body[0] = head;
  for (let i = 1; i < N; i++) {
    const a = D.body[i - 1], b = D.body[i], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    b[0] = a[0] + dx / l * SEG; b[1] = a[1] + dy / l * SEG + 0.15;

const width = u => (u < 0.07 ? lerp(0.72, 1, u / 0.07) : Math.pow(1 - (u - 0.07) / 0.93, 0.7)) * 21 * DS + 2;

D.draw = g => {

    const a = B[Math.max(0, i - 1)], b = B[Math.min(N - 1, i + 1)], dx = a[0] - b[0], dy = a[1] - b[1], l = Math.hypot(dx, dy) || 1;
    const n = dir < 0 ? [-dy / l, dx / l] : [dy / l, -dx / l], w = width(i / (N - 1)) / 2;   // n 指向龙背

  }
  // 背鳍
  g.fillStyle = 'rgba(196,70,44,.92)';
  for (let i = 4; i < N - 6; i += 3) {
    const u = i / N, n = nrm[i + 1], h = (7 + 5 * Math.sin(i * 0.7)) * (1 - u) * DS + 2;
    g.beginPath(); g.moveTo(L[i][0], L[i][1]); g.lineTo(B[i + 1][0] + n[0] * (width(u) / 2 + h), B[i + 1][1] + n[1] * (width(u) / 2 + h)); g.lineTo(L[i + 2][0], L[i + 2][1]); g.fill();

  for (let i = 0; i < N; i++) { const n = nrm[i], w = width(i / (N - 1)) / 2; const x = B[i][0] - n[0] * w * 0.05, y = B[i][1] - n[1] * w * 0.05; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  for (let i = N - 1; i >= 0; i--) g.lineTo(Rr[i][0] - nrm[i][0] * 3, Rr[i][1] - nrm[i][1] * 3);

  g.strokeStyle = 'rgba(160,120,50,.6)'; g.lineWidth = 0.8;
  for (let i = 2; i < N - 2; i += 2) { g.beginPath(); g.moveTo(B[i][0], B[i][1]); g.lineTo(Rr[i][0], Rr[i][1]); g.stroke(); }
  g.strokeStyle = 'rgba(14,40,46,.55)'; g.lineWidth = 0.9;                       // 鳞

  }
