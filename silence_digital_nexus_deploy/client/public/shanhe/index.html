  leave(); $('hints').innerHTML = '';                                           // 开卷提示别压在琴弦、笔迹上
  S.mode = mode; body.classList.add('moding', mode);
  leaveFn = () => { body.classList.remove('moding', mode); S.mode = 'pan'; $('hints').innerHTML = ''; onLeave && onLeave(); };
  ui.modeBar(text, leave, '收 起');
}
function leave() { if (!leaveFn) return; const f = leaveFn; leaveFn = null; ui.modeBar(null); f(); }
SH.hook('escape', leave);

function tips(list) {                                                            // 和开卷提示同一种小签条
  const box = $('hints'); box.innerHTML = '';
  list.forEach(([t, x, y], i) => {
    const d = document.createElement('div'); d.className = 'hint'; d.textContent = t; d.style.left = x + '%'; d.style.top = y + '%';
    box.appendChild(d); setTimeout(() => d.classList.add('show'), 150 + i * 380); setTimeout(() => d.classList.remove('show'), 7000 + i * 300);
  });
}

// ---------- 笔迹：落墨，再慢慢淡去 ----------
const inks = [];
let cur = null, made = 0, nagged = false;
const ink = a => S.night > 0.5 ? `rgba(240,226,190,${a})` : `rgba(36,30,24,${a})`;
SH.hook('top', g => {
  for (let i = inks.length - 1; i >= 0; i--) {
    const k = inks[i];
    if (k.done && (k.age += S.dt) > k.life) { inks.splice(i, 1); continue; }
    if (k.pts.length > 1) SH.brush(g, k.pts, 8, 3.5, ink(k.done ? 0.82 * (1 - k.age / k.life) : 0.82), k.seed);
  }
});

// 把手抖抹顺，再按等距重新取点
const smooth = P => P.map((p, i) => { let x = 0, y = 0, c = 0; for (let j = Math.max(0, i - 3); j <= Math.min(P.length - 1, i + 3); j++) { x += P[j][0]; y += P[j][1]; c++; } return [x / c, y / c]; });
function resample(P, d) {
  const out = [P[0]]; let acc = 0;
  for (let i = 1; i < P.length; i++) {
    let [x0, y0] = P[i - 1], l = Math.hypot(P[i][0] - x0, P[i][1] - y0);
    while (acc + l >= d) { const k = (d - acc) / l; x0 += (P[i][0] - x0) * k; y0 += (P[i][1] - y0) * k; out.push([x0, y0]); l = Math.hypot(P[i][0] - x0, P[i][1] - y0); acc = 0; }
    acc += l;
  }
  return out;
}
// 这一点落在近岭或主峰的山体上吗？是就给出 [层, 图层X, 种树的y]
function inHill(x, y) {
  for (const li of [3, 2]) {
    const L = LS[li], X = x - S.cam * L.p, top = SH.terrain.top(li, X);
    if (top < L.base - 12 && y > top + 3) return [li, X, Math.max(y, top + 5)];
  }
  return null;
}

SH.modes.brush = {
  down(x, y, e) {
    if (cur) return;
    $('hints').querySelectorAll('.show').forEach(h => h.classList.remove('show'));   // 一落笔，提示就让开
    cur = { id: e.pointerId, pts: [[x, y]], seed: Math.random() * 1e4 | 0, done: false, age: 0, life: 1.4 }; inks.push(cur); },
  move(x, y, e) {
    if (!cur || e.pointerId !== cur.id || cur.pts.length > 700) return;
    const p = cur.pts[cur.pts.length - 1];
    if (Math.hypot(x - p[0], y - p[1]) > 3.5) cur.pts.push([x, y]);
  },
  up(x, y, e) { if (!cur || e.pointerId !== cur.id) return; const k = cur; cur = null; k.done = true; judge(k); }
};

// ---------- 看笔势，定笔意 ----------
function judge(k) {
  const P = k.pts, n = P.length;
  if (n < 4) { k.life = 0.4; if (!nagged) { nagged = true; ui.toast('提 笔 画 一 道 ， 不 必 点'); } return; }
  let len = 0, ady = 0, adx = 0, minX = 1e9, maxX = -1e9, ap = P[0];
  for (let i = 0; i < n; i++) {
    const p = P[i];
    if (i) { const dx = p[0] - P[i - 1][0], dy = p[1] - P[i - 1][1]; len += Math.hypot(dx, dy); adx += Math.abs(dx); ady += Math.abs(dy); }
    minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); if (p[1] < ap[1]) ap = p;
  }
  const wet = P.filter(p => p[1] > S.WATER + 4).length / n, hill = P.filter(p => inHill(p[0], p[1])).length / n;
  if (wet > 0.6) return fish(P, k);
  if (hill > 0.55) return forest(P, k);
  const a = P[0], b = P[n - 1], up = (a[1] - ap[1]) + (b[1] - ap[1]), span = maxX - minX;
  // 山脊：中间高、两头低，只有一个峰（上下来回的总量≈两侧落差），并且是横着走的一笔
  if (Math.min(a[1], b[1]) - ap[1] > 40 && span > 70 && ady < up * 1.6 + 40 && adx < span * 1.5) return mountain(P, ap, k);
  if (len > 240) return dragon(P, k);
  birds(P, k);
}

// ---------- 平地起山 ----------
const rising = [];
function mountain(P, ap, k) {
  const tall = LS[2].base - ap[1] > 230, li = tall ? 2 : 3, L = LS[li];
  const h = clamp(L.base - ap[1], tall ? 230 : 70, L.hMax), A_ = tall ? 1.55 : 2, B_ = tall ? 2 : 1.25;
  // 让山的轮廓正好经过笔画两端：(1−|u|^a)^b = 端点高/峰高，解出 u，再反推半宽
  const half = end => { const f = clamp((L.base - end[1]) / h, 0.02, 0.9), u = Math.pow(1 - Math.pow(f, 1 / B_), 1 / A_); return clamp(Math.abs(ap[0] - end[0]) / Math.max(u, 0.2), h * 0.45, L.wMax * 1.6); };
  const [l, r] = P[0][0] < P[P.length - 1][0] ? [P[0], P[P.length - 1]] : [P[P.length - 1], P[0]];
  const pk = { L, id: 9e8 + ++made, cx: ap[0] - S.cam * L.p, h, wl: half(l), wr: half(r), a: A_, b: B_, sh: 0, su: 0, sh2: 0, z: 1, tone: Math.random(), seed: Math.random() * 1e9 | 0 };
  rising.push({ pk, li, img: SH.terrain.bakePeak(pk), t: 0, T: 2.4 });
  A.rumble(); k.life = 1.6;
  ui.toast(tall ? '平 地 起 高 山' : '一 道 青 岭 出 水 来');
}
const dust = SH.softDot([238, 230, 212], 48);
function drawRise(g, li) {
  for (const r of rising) if (r.li === li) {
    const L = r.pk.L, im = r.img, u = clamp(r.t / r.T, 0, 1), e = 1 - Math.pow(1 - u, 3);
    const x = SH.toSX(im.x0, L.p) + (1 - e) * (Math.random() - 0.5) * 3;
    g.save(); g.beginPath(); g.rect(x - 10, -100, im.w + 20, L.yBot + 100); g.clip();          // 只露出地面以上：山是从地里长出来的
    g.globalAlpha = Math.min(1, u * 4); g.drawImage(im.cv, x, im.y0 + (1 - e) * (r.pk.h + 40), im.w, im.h);
    g.restore();
    g.globalAlpha = 0.85 * Math.sin(Math.PI * u);
    for (let j = 0; j < 7; j++) g.drawImage(dust, x + im.w * (0.08 + j * 0.14) - 70, L.base - 64 + Math.sin(j * 2.1 + r.t * 2) * 10 - u * 20, 140, 96);
    g.globalAlpha = 1;
  }
}
SH.hook('mid', g => drawRise(g, 2)); SH.hook('near', g => drawRise(g, 3));
SH.hook('update', dt => {
  for (let i = rising.length - 1; i >= 0; i--) {
    const r = rising[i]; r.t += dt;
    if (r.t < 1.3) S.tilt += (Math.random() - 0.5) * 3 * (1 - r.t / 1.3);                   // 地动山摇
    if (r.t >= r.T) { SH.terrain.addPeak(r.pk); rising.splice(i, 1); }
  }
});

// ---------- 画龙点睛：龙沿着笔迹飞 ----------
function dragon(P, k) {
  if (!SH.dragon.fly(resample(smooth(P), 12))) { ui.toast('龙 已 在 云 中'); k.life = 0.6; return; }
  k.life = clamp(SH.dragon.T + 4, 2.5, 9);
  ui.toast('画 龙 点 睛');
}

// ---------- 鱼跃、成林、惊鸟 ----------
function fish(P, k) {
  const pts = resample(P, 44).filter(p => p[1] > S.WATER + 4).slice(0, 12);
  pts.forEach((p, i) => setTimeout(() => { if (SH.life.kois.length < 30) SH.life.koi(p[0] - S.cam, p[1]); if (i % 2 === 0) A.koi(); }, i * 110));
  k.life = 0.9;
  ui.toast(pts.length > 5 ? '鱼 跃 龙 门' : '鱼 戏 莲 叶 间');
}
function forest(P, k) {
  let n = 0;
  for (const p of resample(P, 30)) {
    const h = inHill(p[0], p[1]);
    if (!h || n >= 14) continue;
    const i = n++;
    setTimeout(() => { SH.life.plant(...h); if (i % 3 === 0) A.plant(); }, i * 90);
  }
  k.life = 1;
  if (n) ui.toast(['万 木 争 春', '绿 树 成 荫', '层 林 尽 染', '松 柏 后 凋'][S.season]);
}
function birds(P, k) {
  const e = P[P.length - 1];
  if (S.night > 0.3 || S.twilight > 0.6) { for (let i = 0; i < 5; i++) SH.life.lantern(e[0] + (Math.random() - 0.5) * 70, e[1] + Math.random() * 30); A.lantern(); }
  else if (SH.life.flocks.length < 12) { SH.life.spawnFlock('flock', e[0] - S.cam * 0.56, e[1], { burst: true }); A.birds('flock'); }
  k.life = 0.8;
}

SH.feat.brush = () => {
  enter('brush', '神笔 · 画山 画龙 画鱼 画林', () => { cur = null; });
  const m = innerWidth < 640;
  tips([['在天上画一道山脊 ⌒　平地起山', 50, m ? 15 : 14], ['画一条长长的线　龙沿着飞', 50, m ? 25 : 25], ['在山坡上涂抹　长出树林', m ? 50 : 32, m ? 56 : 58], ['水面上划一笔　鱼跃', m ? 50 : 64, m ? 82 : 84]]);
};

// ---------- 抚琴：水面化作七弦，十三徽位轻点出泛音 ----------
const HUI = [1 / 8, 1 / 6, 1 / 5, 1 / 4, 1 / 3, 2 / 5, 1 / 2, 3 / 5, 2 / 3, 3 / 4, 4 / 5, 5 / 6, 7 / 8];
const HN = [8, 6, 5, 4, 3, 5, 2, 5, 3, 4, 5, 6, 8];                              // 在 1/n 处轻点，只剩 n 倍频
const strs = Array.from({ length: 7 }, () => ({ amp: 0, x: 0.5, n: 0, last: -1 }));
const floats = [];
let qinA = 0, qinLast = null, sel = 3;
// 琴弦铺在水面上；弦距至少 26 像素，屏幕矮（手机）就往上铺开，手指好下
const geo = () => { const y1 = 872, gap = Math.max((y1 - S.WATER - 40) / 6, 26 / S.k), x0 = S.vw * 0.06, x1 = S.vw * 0.94; return { y0: y1 - gap * 6, y1, x0, x1, gap }; };
const strY = (G, i) => G.y0 + i * G.gap;                                       // 一弦最粗最低，在远处（上）
function pluck(i, x, vel) {
  const s = strs[i]; if (S.t - s.last < 0.07) return;
  const G = geo(); s.last = S.t; s.amp = 4 + vel * 6; s.x = clamp((x - G.x0) / (G.x1 - G.x0), 0.05, 0.95); s.n = 0; sel = i;
  A.string(i, false);
  floats.push({ x, y: strY(G, i) - 8, t: 0, txt: A.stepName(i) });
  SH.life.ripple(x - S.cam, Math.max(S.WATER + 6, strY(G, i)), 0.5);
}
function harmonic(j) {
  const G = geo(), s = strs[sel], n = HN[j];
  s.amp = 3.2; s.n = n; s.last = S.t;
  A.harmonic(A.step(A.tonic(3), sel) + 12 * Math.log2(n), A.now(), 0.24);
  floats.push({ x: G.x0 + HUI[j] * (G.x1 - G.x0), y: strY(G, 0) - G.gap * 1.1, t: 0, txt: '泛 ' + A.stepName(sel) });
}
SH.modes.qin = {
  down(x, y) {
    const G = geo(); qinLast = [x, y];
    if (Math.abs(y - (strY(G, 0) - G.gap * 0.75)) < G.gap * 0.5) {          // 点徽位
      let j = 0; HUI.forEach((h, i) => { if (Math.abs(G.x0 + h * (G.x1 - G.x0) - x) < Math.abs(G.x0 + HUI[j] * (G.x1 - G.x0) - x)) j = i; });
      return harmonic(j);
    }
    const i = Math.round((y - G.y0) / G.gap);
    if (i >= 0 && i < 7 && Math.abs(y - strY(G, i)) < G.gap * 0.5) pluck(i, x, 0.6);
  },
  move(x, y) {                                                                   // 划过哪根弦，哪根弦就响
    if (!qinLast) return;
    const G = geo(), [lx, ly] = qinLast;
    for (let i = 0; i < 7; i++) { const sy = strY(G, i); if ((ly - sy) * (y - sy) < 0) pluck(i, lx + (x - lx) * (sy - ly) / (y - ly), clamp(Math.abs(y - ly) / 30, 0.2, 1)); }
    qinLast = [x, y];
  },
  up() { qinLast = null; }
};
SH.hook('update', dt => {
  qinA = clamp(qinA + (S.mode === 'qin' ? dt : -dt) * 2, 0, 1);
  for (const s of strs) s.amp *= Math.exp(-dt * 1.6);
  for (let i = floats.length - 1; i >= 0; i--) if ((floats[i].t += dt) > 1.4) floats.splice(i, 1);
});
SH.hook('top', g => {
  if (qinA <= 0) return;
  const G = geo(), lit = S.night > 0.5;
  g.save(); g.globalAlpha = qinA; g.lineCap = 'round';
  g.fillStyle = lit ? '#c9b48a' : '#3b2a1c';                                  // 岳山与龙龈
  g.fillRect(G.x0 - 14, G.y0 - G.gap * 0.5, 6, G.gap * 7); g.fillRect(G.x1 + 8, G.y0 - G.gap * 0.5, 6, G.gap * 7);
  strs.forEach((s, i) => {
    const y = strY(G, i), w = Math.max(0.9, 2.6 - i * 0.26), osc = Math.cos(S.t * (34 + i * 5)) * s.amp, pts = [];
    for (let k = 0; k <= 48; k++) {
      const u = k / 48, shape = s.n ? Math.sin(s.n * Math.PI * u) : (u < s.x ? u / s.x : (1 - u) / (1 - s.x));   // 拨弦是三角形，泛音是 sin(nπx) 驻波
      pts.push([G.x0 + u * (G.x1 - G.x0), y + shape * osc]);
    }
    for (const [c, dy, lw] of [['rgba(20,14,8,.35)', 1.6, w + 0.6], [lit ? '#f7eccf' : '#fbf3dc', 0, w]]) {
      g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); pts.forEach(([x, py], k) => k ? g.lineTo(x, py + dy) : g.moveTo(x, py + dy)); g.stroke();
    }
  });
  const hy = strY(G, 0) - G.gap * 0.75;                                       // 十三徽：螺钿小圆点
  for (const h of HUI) { const x = G.x0 + h * (G.x1 - G.x0); g.fillStyle = 'rgba(40,30,20,.35)'; g.beginPath(); g.arc(x, hy + 1, 4.6, 0, TAU); g.fill(); g.fillStyle = '#fbf8ee'; g.beginPath(); g.arc(x, hy, 3.6, 0, TAU); g.fill(); }
  g.font = `20px ${SH.KAI}`; g.textAlign = 'center';
  for (const f of floats) { g.globalAlpha = qinA * (1 - f.t / 1.4); g.fillStyle = lit ? '#f6e3b8' : '#7a2a1e'; g.fillText(f.txt, f.x, f.y - f.t * 36); }
  g.restore();
});
SH.hook('xray', g => {
  if (S.mode !== 'qin') return;
  const G = geo();
  g.fillText('徽位＝弦长的 1/2、1/3、1/4…：轻点处成了波节，只剩 n 倍频 → 泛音；拨弦的形状是三角形，等于各次 sin(nπx) 之和', G.x0, strY(G, 0) - G.gap * 1.6);
});
SH.feat.qin = () => {
  enter('qin', '抚琴 · 划弦成曲，点徽位出泛音', () => { qinLast = null; });
  A.chime();
};

// ---------- 吹气起风：对着话筒吹口气，满山花落；没有话筒就按住画面 ----------
let mic = null;
SH.modes.blow = { down() { S.blowHold = true; }, move() {}, up() { S.blowHold = false; } };
function micStop() { if (mic) { mic.stream.getTracks().forEach(t => t.stop()); mic.src.disconnect(); mic = null; } S.blowHold = false; }
SH.feat.blow = async () => {
  enter('blow', '对着话筒，轻轻吹一口气', micStop);
  const bar = $('modebar'), meter = document.createElement('i');
  meter.className = 'meter'; meter.innerHTML = '<b></b>'; bar.insertBefore(meter, bar.querySelector('button'));
  const fallback = why => { if (S.mode === 'blow') { bar.querySelector('span').textContent = '按住画面，就是一阵风'; ui.toast(why, 3600); } };
  try {
    const ctx = A.ctx();
    if (!ctx || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fallback('这里用不了话筒');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    if (S.mode !== 'blow') { stream.getTracks().forEach(t => t.stop()); return; }
    const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser();
    an.fftSize = 1024; src.connect(an);
    mic = { stream, src, an, buf: new Float32Array(an.fftSize), base: 0.02 };
  } catch (e) { fallback('没有拿到话筒权限'); }
};
let blowWas = 0;
SH.hook('update', dt => {
  let want = 0;
  if (S.mode === 'blow') {
    if (mic) {
      mic.an.getFloatTimeDomainData(mic.buf);
      let s = 0; for (const v of mic.buf) s += v * v;
      const rms = Math.sqrt(s / mic.buf.length);
      if (rms < mic.base * 1.6 + 0.01) mic.base += (rms - mic.base) * 0.02;      // 慢慢学会环境底噪
      want = clamp((rms - mic.base - 0.03) / 0.2, 0, 1);
    }
    if (S.blowHold) want = Math.max(want, 0.85);
    const b = $('modebar').querySelector('.meter b'); if (b) b.style.width = (S.blow * 100).toFixed(0) + '%';
  }
  if (S.windT > 0) want = Math.max(want, 0.6);                                      // 诗里起风（director.js 设 S.windT）
  S.blow += (want - S.blow) * Math.min(1, dt * (want > S.blow ? 6 : 0.7));       // 起风快，风停慢
  if (S.blow > 0.05) S.gust = Math.max(S.gust || 0, S.blow * 1.4);
  if (S.blow > 0.35 && blowWas <= 0.35) A.whoosh(S.blow);
  blowWas = S.blow;
});

// ---------- 体感：手机一斜，山有远近（电脑上移动鼠标即可） ----------
let tiltOn = false, tiltGot = false;
const onTilt = e => {
  if (e.gamma == null) return;
  tiltGot = true;
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  const v = ang === 90 ? e.beta : ang === 270 || ang === -90 ? -e.beta : e.gamma;   // 横屏时，左右倾斜读的是 beta
  S.tiltT = -clamp(v, -35, 35) * 1.6;
};
SH.feat.tilt = () => {
  if (!ui.isTouch) { ui.toast('电 脑 上 ， 轻 移 鼠 标 ， 山 就 有 远 近'); return; }
  if (tiltOn) { removeEventListener('deviceorientation', onTilt); tiltOn = false; S.tiltT = 0; ui.toast('体 感 已 收'); return; }
  const go = () => {
    addEventListener('deviceorientation', onTilt); tiltOn = true; tiltGot = false;
    ui.toast('倾 斜 手 机 · 山 有 远 近');
    setTimeout(() => { if (tiltOn && !tiltGot) ui.toast('没读到陀螺仪：请用 https 链接打开再试', 4000); }, 1800);
  };
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') {                      // 苹果要在“点按”里当场申请
    const card = ui.modal({ title: '体 感 山 水', html: '<p class="sub">苹果手机需要你允许读取“动作与方向”。</p><div class="btns"><button class="go" data-a="ok">允 许</button></div>' });
    card.q('[data-a=ok]').onclick = () => DOE.requestPermission().then(r => { ui.close(); if (r === 'granted') go(); else ui.toast('没有拿到方向权限'); }).catch(() => { ui.close(); ui.toast('没有拿到方向权限'); });
  } else go();
};
})();

</script>
<script>
'use strict';
/* 山河长卷 · props —— 诗里写到的东西出场。每样是一个“演员”：有寿命、会动、画在自己那一层（天上 / 山间 / 水面 / 最前）。
   这里是山间水上的：鹅、鸭、黄鹂、燕、蝴蝶、蜻蜓、牧童、龙舟、雾；天上的在 props-sky.js。 */
(() => {
const S = SH.S, A = SH.audio, { clamp, lerp, TAU } = SH, R = SH.rng(SH.SEED ^ 0x7070);
const actors = [], K = {};
const PR = SH.props = { actors, K, R };
PR.alive = a => clamp(Math.min(a.t / 1.5, (a.dur - a.t) / 2.5), 0, 1);                // 淡入 1.5 秒，淡出 2.5 秒
PR.spawn = (kind, opt = {}) => {
  const k = K[kind]; if (!k) return false;
  if (k.one) for (const a of actors) if (a.kind === kind) { a.dur = Math.max(a.dur, a.t + k.dur); return true; }   // 只要一份的（星河、彩虹……）：再叫一次就续命
  const a = { kind, t: 0, dur: k.dur || 30, ...opt }; k.init && k.init(a); actors.push(a); return true;
};
PR.has = kind => actors.some(a => a.kind === kind);
PR.sx = (X, p) => SH.toSX(X, p); PR.wx = (x, p) => x - S.cam * p;                       // 图层坐标 ↔ 屏幕
SH.hook('update', dt => {
  for (const a of actors) { a.t += dt; if (K[a.kind].update) K[a.kind].update(a, dt); }
  for (let i = actors.length - 1; i >= 0; i--) if (actors[i].t >= actors[i].dur) actors.splice(i, 1);
});
['sky', 'mid', 'near', 'water', 'glow', 'top'].forEach(layer => SH.hook(layer, g => {
  for (const a of actors) {
    const k = K[a.kind];
    if (k.layer !== layer && !(k.layers && k.layers.includes(layer))) continue;
    g.save(); g.globalAlpha = PR.alive(a); k.draw(g, a, layer); g.restore();
  }
}));
const sx = PR.sx, wx = PR.wx, ys = y => lerp(0.8, 1.6, (y - 690) / 162);               // 水面上越近越大

// ---------- 鹅、鸭：白毛浮绿水，红掌拨清波 ----------
function goose(g, x, y, s, dir, ph, duck) {
  g.save(); g.translate(x, y); g.scale(dir * s, s); g.lineCap = 'round';
  g.fillStyle = 'rgba(40,36,30,.13)'; g.beginPath(); g.ellipse(0, 2.5, 14, 2.4, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(232,120,60,.45)'; g.lineWidth = 1.2;                                   // 水下的红掌
  for (const [fx, p] of [[-3, 0], [2, Math.PI]]) { const k = Math.sin(ph * 4 + p) * 2.5; g.beginPath(); g.moveTo(fx, 1.5); g.lineTo(fx - 3 + k, 4.5); g.stroke(); }
  g.strokeStyle = 'rgba(43,38,32,.6)'; g.lineWidth = 0.7; g.fillStyle = duck ? '#8c6d4b' : '#fbfaf4';
  g.beginPath(); g.moveTo(-13, -3); g.quadraticCurveTo(-15, -10, -6, -9.5); g.quadraticCurveTo(5, -10.5, 9, -5); g.quadraticCurveTo(10, 1, 0, 1.5); g.quadraticCurveTo(-11, 1.5, -13, -3); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-9, -6.5); g.quadraticCurveTo(-2, -8.5, 4, -5.5); g.stroke();
  const n = Math.sin(ph * 1.3) * 1.2;
  if (duck) {
    g.fillStyle = '#2f6b4f'; g.beginPath(); g.arc(9, -11 + n * 0.5, 3.2, 0, TAU); g.fill();
    g.fillStyle = '#e0b040'; g.beginPath(); g.moveTo(11.5, -11.6 + n * 0.5); g.lineTo(16, -10.4 + n * 0.5); g.lineTo(11.5, -9.6 + n * 0.5); g.fill();
  } else {                                                                                     // 曲项向天歌
    const neck = () => { g.beginPath(); g.moveTo(5, -7); g.bezierCurveTo(12, -10, 4, -17, 8 + n * 0.3, -21.5 + n); g.stroke(); };
    g.strokeStyle = 'rgba(43,38,32,.55)'; g.lineWidth = 4.6; neck(); g.strokeStyle = '#fbfaf4'; g.lineWidth = 3.3; neck();
    g.fillStyle = '#fbfaf4'; g.strokeStyle = 'rgba(43,38,32,.55)'; g.lineWidth = 0.6; g.beginPath(); g.arc(9, -22.5 + n, 2.9, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#e8892c'; g.beginPath(); g.moveTo(11, -23.6 + n); g.lineTo(17, -21.6 + n); g.lineTo(11, -21 + n); g.fill();
    g.fillStyle = '#c8542a'; g.beginPath(); g.arc(11.3, -24.8 + n, 1.3, 0, TAU); g.fill();
    g.fillStyle = '#1a1612'; g.beginPath(); g.arc(9.7, -23.3 + n, 0.55, 0, TAU); g.fill();
  }
  g.restore();
}
K.goose = { layer: 'water', dur: 70,
  init(a) {
    const x0 = S.vw * R.range(0.3, 0.55);
    a.list = Array.from({ length: a.duck ? 4 : 3 }, (_, i) => ({ X: wx(x0 + i * R.range(45, 80), 1), y: R.range(715, 760) + i * 18, v: R.range(5, 9) * (R() < 0.5 ? -1 : 1), ph: R() * TAU, rip: R() }));
    if (!a.duck) setTimeout(() => A.honk(2), 900);
  },
  update(a, dt) { for (const b of a.list) { b.X += b.v * dt; b.ph += dt; if ((b.rip -= dt) < 0) { b.rip = R.range(1.2, 2.4); SH.life.ripple(b.X, b.y + 2, 0.45); } } },
  draw(g, a) { for (const b of a.list) goose(g, sx(b.X, 1), b.y + Math.sin(S.t * 1.6 + b.ph) * 0.8, ys(b.y), Math.sign(b.v), b.ph, a.duck); }
};

// ---------- 黄鹂：两只在近处的树上跳枝鸣叫。只落在画里真实长着的树的枝梢上（树随风晃、随画卷走，鸟跟着）；没有长成的树就绕着飞 ----------
function oriole(g, x, y, s, dir, flap) {
  g.save(); g.translate(x, y); g.scale(dir * s, s);
  g.fillStyle = '#2b2620'; g.beginPath(); g.moveTo(-5, -0.5); g.lineTo(-10.5, -2.2); g.lineTo(-10, 1.4); g.closePath(); g.fill();
  g.fillStyle = '#e9b524'; g.beginPath(); g.ellipse(0, 0, 6, 3.4, -0.15, 0, TAU); g.fill(); g.beginPath(); g.arc(5.2, -2.2, 2.7, 0, TAU); g.fill();
  g.fillStyle = '#2b2620'; g.beginPath(); g.moveTo(3.4, -3.3); g.lineTo(7.4, -2.6); g.lineTo(3.8, -1.7); g.fill();
  g.fillStyle = '#d9853b'; g.beginPath(); g.moveTo(7.6, -2.5); g.lineTo(10.2, -1.9); g.lineTo(7.5, -1.3); g.fill();
  g.fillStyle = '#2b2620'; g.beginPath();
  if (flap == null) g.ellipse(-1.2, -0.6, 3.8, 1.6, -0.1, 0, TAU); else { g.moveTo(-2, -0.8); g.quadraticCurveTo(-3, -1 - 7 * flap, 3, -2 - 6 * flap); g.lineTo(1.5, -0.6); }
  g.fill();
  if (flap == null) { g.strokeStyle = '#5a4630'; g.lineWidth = 0.8; g.beginPath(); g.moveTo(-1, 3); g.lineTo(-1.5, 5.2); g.moveTo(1.5, 3); g.lineTo(1.8, 5.2); g.stroke(); }   // 停着时露出两只脚
  g.restore();
}
const perches = () => {                                                                     // 画面里已经长成的树，上半截的细枝梢
  const out = [];
  for (const p of SH.life.planted) {
    const x = SH.toSX(p.X, SH.LAYERS[p.li].p);
    if (S.t - p.born < 3.8 || x < 50 || x > S.vw - 50) continue;
    for (const sg of p.m.segs) if (!sg.bark && sg.y1 < -p.m.h * 0.35) out.push({ p, sg });
  }
  return out;
};
K.oriole = { layer: 'top', dur: 34,
  init(a) { a.b = [0, 1].map(() => ({ x: S.vw * R.range(0.3, 0.7), y: R.range(430, 540), ph: R() * TAU, dir: 1 })); A.oriole(); a.sing = 5; },
  update(a, dt) {
    if ((a.sing -= dt) < 0) { a.sing = R.range(5, 8); A.oriole(); }
    for (const b of a.b) {
      b.ph += dt * 18;
      if (a.t > a.dur - 3) { b.at = null; b.x += 130 * dt * b.dir; b.y -= 70 * dt; continue; }         // 散场：飞走
      if (b.at) {                                                                            // 停在枝上：位置每帧按那根枝梢重算
        [b.x, b.y] = SH.life.branchPt(b.at.p, b.at.sg);
        if ((b.rest -= dt) > 0 && b.x > 20 && b.x < S.vw - 20) continue;
        b.at = null;                                                                         // 歇够了（或树走出画面）：起飞
      }
      if (!b.to && b.tx == null) { const ps = perches(); if (ps.length) b.to = R.pick(ps); else { b.tx = clamp(b.x + R.range(-170, 170), 40, S.vw - 40); b.ty = R.range(420, 560); } }
      if (!b.to) { b.x += S.camDelta * 0.74; b.tx += S.camDelta * 0.74; }
      const [tx, ty] = b.to ? SH.life.branchPt(b.to.p, b.to.sg) : [b.tx, b.ty];
      const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
      if (d < 4) { if (b.to) { b.at = b.to; b.rest = R.range(1.5, 3.5); } b.to = null; b.tx = null; continue; }
      const sp = Math.min(d, 160 * dt); b.x += dx / d * sp; b.y += dy / d * sp; b.dir = Math.sign(dx) || b.dir;
    }
  },
  draw(g, a) { for (const b of a.b) oriole(g, b.x, b.y - (b.at ? 7 : 0), 1.5, b.dir, b.at ? null : Math.sin(b.ph)); }   // 停着时往上挪 7，让脚正好踩在枝上
};

// ---------- 燕：剪刀尾，贴着水面一上一下地掠 ----------
function swallow(g, x, y, s, dir, w) {
  g.save(); g.translate(x, y); g.scale(dir * s, s); g.fillStyle = '#1f2433';
  g.beginPath(); g.ellipse(0, 0, 4.6, 1.7, 0, 0, TAU); g.fill();
  g.beginPath(); g.moveTo(-3, 0); g.lineTo(-12, -2.8); g.lineTo(-7.5, 0); g.lineTo(-12, 2.8); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(1.5, -0.6); g.quadraticCurveTo(-1, -5 * w - 2, -8, -10 * w); g.lineTo(-1, -0.2); g.fill();
  g.fillStyle = '#c4553a'; g.beginPath(); g.arc(3.8, 0.5, 1, 0, TAU); g.fill();
  g.restore();
}
K.swallow = { layer: 'top', dur: 30,
  init(a) { a.b = Array.from({ length: 5 }, (_, i) => ({ x: R() * S.vw, y: R.range(570, 680), v: R.range(150, 220) * (i % 2 ? 1 : -1), ph: R() * TAU, f: R.range(0.7, 1.4) })); },
  update(a, dt) { for (const b of a.b) { b.x += b.v * dt + S.camDelta * 0.8; b.ph += dt * b.f * 2; if (b.x < -60) b.x += S.vw + 120; else if (b.x > S.vw + 60) b.x -= S.vw + 120; } },
  draw(g, a) { for (const b of a.b) swallow(g, b.x, b.y + Math.sin(b.ph) * 42, 1.5, Math.sign(b.v), Math.cos(b.ph * 7)); }
};

// ---------- 蝴蝶：一团一团，随噪声飘 ----------
K.butterfly = { layer: 'top', dur: 40,
  init(a) { const cx = S.vw * R.range(0.3, 0.7); a.b = Array.from({ length: 7 }, () => ({ x: cx + R.range(-220, 220), y: R.range(560, 780), ph: R() * TAU, c: R.pick(['#f6f2e4', '#f1d36a', '#a9c9e8', '#f2b8bd']), s: R.range(1.1, 1.6), seed: R() * 100 })); },
  update(a, dt) { for (const b of a.b) { b.x += (SH.noise1(a.t * 0.45 + b.seed, 7) - 0.5) * 120 * dt + S.camDelta * 0.85; b.y = clamp(b.y + (SH.noise1(a.t * 0.5 + b.seed, 9) - 0.5) * 90 * dt, 520, 820); b.ph += dt * 15; } },
  draw(g, a) {
    for (const b of a.b) {
      const w = 0.2 + 0.8 * Math.abs(Math.sin(b.ph));
      g.save(); g.translate(b.x, b.y); g.scale(b.s, b.s); g.fillStyle = b.c; g.strokeStyle = 'rgba(43,38,32,.55)'; g.lineWidth = 0.5;
      for (const sd of [-1, 1]) { g.save(); g.scale(sd * w, 1); g.beginPath(); g.ellipse(3.2, -2.2, 3.6, 2.6, -0.5, 0, TAU); g.fill(); g.stroke(); g.beginPath(); g.ellipse(2.4, 1.7, 2.4, 1.9, 0.4, 0, TAU); g.fill(); g.stroke(); g.restore(); }
      g.strokeStyle = '#2b2620'; g.lineWidth = 0.9; g.beginPath(); g.moveTo(0, -3.2); g.lineTo(0, 3); g.stroke(); g.restore();
    }
  }
};

// ---------- 蜻蜓：停一停，倏地一闪，再停 ----------
K.dragonfly = { layer: 'top', dur: 36,
  init(a) { a.b = Array.from({ length: 3 }, () => ({ x: S.vw * R.range(0.25, 0.75), y: R.range(640, 760), hold: R.range(0.3, 1.5), c: R.pick(['#c8442f', '#3f78a8', '#c8442f']), dir: 1 })); },
  update(a, dt) {
    for (const b of a.b) {
      b.x += S.camDelta * 0.95; if (b.go) b.tx += S.camDelta * 0.95;
      if ((b.hold -= dt) > 0) continue;
      if (!b.go) { b.go = true; b.tx = clamp(b.x + R.range(-190, 190), 30, S.vw - 30); b.ty = R.range(620, 780); }
      const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
      if (d < 3) { b.go = false; b.hold = R.range(0.6, 2); continue; }
      const sp = Math.min(d, 280 * dt); b.x += dx / d * sp; b.y += dy / d * sp; b.dir = Math.sign(dx) || b.dir;
    }
  },
  draw(g, a) {
    for (const b of a.b) {
      g.save(); g.translate(b.x, b.y + Math.sin(S.t * 9 + b.x) * 0.6); g.scale(b.dir * 1.5, 1.5);
      const w = Math.sin(S.t * 55) * 0.15;
      g.fillStyle = 'rgba(236,243,248,.6)'; g.strokeStyle = 'rgba(60,70,80,.35)'; g.lineWidth = 0.4;
      for (const [ox, sd] of [[1.6, -1], [1.6, 1], [-1.2, -1], [-1.2, 1]]) { g.beginPath(); g.ellipse(ox - 1.5, sd * 4.8, 1.6, 5.2, sd * (0.35 + w) * (ox > 0 ? 1 : -0.6), 0, TAU); g.fill(); g.stroke(); }
      g.strokeStyle = b.c; g.lineWidth = 1.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(3, 0); g.lineTo(-12, 0); g.stroke();
      g.fillStyle = b.c; g.beginPath(); g.arc(4.2, 0, 1.7, 0, TAU); g.fill(); g.restore();
    }
  }
};

// ---------- 牧童骑牛：沿着岸边慢慢走，横笛信口吹 ----------
function cowherd(g, x, y, s, dir, st) {
  g.save(); g.translate(x, y); g.scale(dir * s, s); g.lineCap = 'round';
  g.fillStyle = 'rgba(40,36,30,.15)'; g.beginPath(); g.ellipse(0, 1, 22, 2.5, 0, 0, TAU); g.fill();
  g.strokeStyle = '#3d3934'; g.lineWidth = 3;
  for (const [lx, p] of [[-12, 0], [-7, Math.PI], [9, Math.PI], [13, 0]]) { g.beginPath(); g.moveTo(lx, -10); g.lineTo(lx + Math.sin(st * 2 + p) * 2.5, 0); g.stroke(); }
  g.fillStyle = '#4a463f'; g.beginPath(); g.ellipse(0, -15, 17, 8, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(17, -14, 6, 4.5, 0.5, 0, TAU); g.fill();
  g.strokeStyle = '#d9cfb8'; g.lineWidth = 1.6; g.beginPath(); g.arc(16, -18, 5.5, Math.PI * 1.05, Math.PI * 1.9); g.stroke();
  g.strokeStyle = '#4a463f'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-16, -16); g.quadraticCurveTo(-21, -10 + Math.sin(st) * 2, -19, -5); g.stroke();
  g.strokeStyle = '#3f6a8a'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(-1, -22); g.lineTo(2.5, -15); g.stroke();       // 牧童：横坐牛背
  g.fillStyle = '#3f6a8a'; g.beginPath(); g.moveTo(-6, -22); g.lineTo(2, -22); g.lineTo(1, -33); g.lineTo(-5, -33); g.closePath(); g.fill();
  g.fillStyle = '#d34b3a'; g.fillRect(-6, -25, 8, 2.2);
  g.fillStyle = '#e9cfae'; g.beginPath(); g.arc(-2, -36.5, 3.4, 0, TAU); g.fill();
  g.fillStyle = '#2b2620'; for (const hx of [-4.8, 0.8]) { g.beginPath(); g.arc(hx, -39.6, 1.5, 0, TAU); g.fill(); }
  g.strokeStyle = '#3f6a8a'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(-1, -31); g.lineTo(3.5, -34.5); g.stroke();
  g.strokeStyle = '#6b4a2a'; g.lineWidth = 1.1; g.beginPath(); g.moveTo(0.5, -35.6); g.lineTo(8.5, -33.6); g.stroke();
  g.restore();
}
K.cowherd = { layer: 'near', dur: 60,
  init(a) { const left = R() < 0.5; a.dir = left ? 1 : -1; a.X = wx(S.vw * (left ? 0.18 : 0.82), 0.74); a.st = 0; A.flute(12); a.toot = 9; },
  update(a, dt) { a.X += a.dir * 15 * dt; a.st += dt * 2.4; if ((a.toot -= dt) < 0) { a.toot = R.range(8, 12); A.flute(10); } },
  draw(g, a) { cowherd(g, sx(a.X, 0.74), S.WATER - 3, 1.7, a.dir, a.st); }
};

// ---------- 龙舟：两条竞渡，鼓声三下红旗开 ----------
function dragonBoat(g, x, y, s, dir, ph, c) {
  g.save(); g.translate(x, y); g.scale(dir * s, s); g.lineCap = 'round';
  g.fillStyle = 'rgba(40,36,30,.14)'; g.beginPath(); g.ellipse(0, 3, 64, 3, 0, 0, TAU); g.fill();
  g.strokeStyle = '#7a5a2a'; g.lineWidth = 0.8; g.beginPath(); g.moveTo(-50, -5); g.lineTo(-50, -24); g.stroke();
  g.fillStyle = '#e8c45a'; g.beginPath(); g.moveTo(-50, -24); g.lineTo(-40 + Math.sin(ph) * 1.5, -21); g.lineTo(-50, -17); g.fill();
  for (let i = 0; i < 8; i++) {                                                                // 桨手：齐刷刷地划
    const rx = -40 + i * 10.5, a = Math.sin(ph) * 0.7;
    g.strokeStyle = '#6b4a2a'; g.lineWidth = 0.9; g.beginPath(); g.moveTo(rx, -6); g.lineTo(rx - 7 * Math.cos(a), 3 + 3 * Math.sin(a)); g.stroke();
    g.fillStyle = i % 2 ? '#e8d6a8' : '#f2e6c4'; g.fillRect(rx - 1.7, -8.5, 3.4, 4.5);
    g.fillStyle = '#2b2620'; g.beginPath(); g.arc(rx + Math.sin(ph) * 0.6, -10.2, 1.8, 0, TAU); g.fill();
  }
  g.fillStyle = '#7a3324'; g.beginPath(); g.ellipse(46, -8, 3.6, 2.6, 0, 0, TAU); g.fill();
  g.fillStyle = '#2b2620'; g.beginPath(); g.arc(41.5, -13.5, 1.9, 0, TAU); g.fill();
  g.fillStyle = c; g.beginPath(); g.moveTo(-58, -5); g.quadraticCurveTo(0, 3, 56, -5); g.lineTo(56, -2); g.quadraticCurveTo(0, 6, -58, -2); g.closePath(); g.fill();
  g.strokeStyle = '#e8c45a'; g.lineWidth = 1; g.beginPath(); g.moveTo(-58, -5); g.quadraticCurveTo(0, 3, 56, -5); g.stroke();
  g.fillStyle = c; g.beginPath(); g.moveTo(52, -4); g.quadraticCurveTo(60, -14, 58, -22); g.quadraticCurveTo(66, -25, 71, -19); g.lineTo(66, -16); g.quadraticCurveTo(62, -14, 60, -6); g.closePath(); g.fill();
  g.strokeStyle = '#e8c45a'; g.beginPath(); g.moveTo(58, -22); g.lineTo(54, -29); g.moveTo(69, -18); g.quadraticCurveTo(75, -16, 77, -11); g.stroke();
  g.fillStyle = '#fff6dc'; g.beginPath(); g.arc(61.5, -20.5, 1.1, 0, TAU); g.fill();
  g.fillStyle = c; g.beginPath(); g.moveTo(-56, -4); g.quadraticCurveTo(-67, -10, -62, -21); g.quadraticCurveTo(-60, -12, -52, -6); g.closePath(); g.fill();
  g.restore();
}
K.dboat = { layer: 'water', dur: 28,
  init(a) { a.dir = R() < 0.5 ? 1 : -1; a.boats = [0, 1].map(i => ({ X: wx(a.dir > 0 ? -150 - i * 70 : S.vw + 150 + i * 70, 1), y: 748 + i * 62, v: R.range(80, 100), c: i ? '#c8a536' : '#b5352b', ph: R() * TAU })); A.drum(40, 0.3); },
  update(a, dt) { for (const b of a.boats) { b.X += a.dir * b.v * dt; b.ph += dt * 6.5; if (R() < dt * 8) SH.life.drops.push({ X: b.X - a.dir * R.range(-40, 55), y: b.y + 1, vx: R.range(-30, 30), vy: -R.range(30, 70), t: 0 }); } },
  draw(g, a) { for (const b of a.boats) dragonBoat(g, sx(b.X, 1), b.y, ys(b.y) * 1.15, a.dir, b.ph, b.c); }
};

// ---------- 雾：几道横向的烟岚，压在山腰和水口 ----------
K.mist = { layers: ['mid', 'near'], dur: 50, one: true,
  draw(g, a, layer) {
    const y0 = layer === 'mid' ? 540 : 630, h = layer === 'mid' ? 150 : 100;
    for (let i = 0; i < 3; i++) {
      const y = y0 + i * 22 + Math.sin(S.t * 0.07 + i * 2) * 14, gr = g.createLinearGradient(0, y - h / 2, 0, y + h / 2);
      gr.addColorStop(0, 'rgba(244,239,226,0)'); gr.addColorStop(0.5, 'rgba(244,239,226,.4)'); gr.addColorStop(1, 'rgba(244,239,226,0)');
      g.fillStyle = gr; g.fillRect(0, y - h / 2, S.vw, h);
    }
  }
};
})();

</script>
<script>
'use strict';
/* 山河长卷 · props-sky —— 天上的演员：纸鸢、烟花、星河、鹊桥、玉兔、彩虹、流星。演员的规矩见 props.js。 */
(() => {
const S = SH.S, A = SH.audio, PR = SH.props, K = PR.K, R = PR.R, { clamp, lerp, TAU } = SH;
const dark = () => Math.max(S.night, S.twilight * 0.7);

// ---------- 纸鸢：儿童散学归来早，忙趁东风放纸鸢 ----------
function kite(g, x, y, kind, ph) {
  g.save(); g.translate(x, y); g.rotate(Math.sin(ph * 0.9) * 0.12); g.strokeStyle = 'rgba(43,38,32,.7)'; g.lineWidth = 0.7;
  g.beginPath(); for (let i = 0; i <= 12; i++) { const yy = 14 + i * 5.5, xx = Math.sin(ph * 3 - i * 0.7) * (2 + i * 0.5); i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke();   // 尾巴
  if (kind === 0) {                                                                            // 沙燕：头圆、翅宽、剪刀尾
    g.fillStyle = '#f4ead2'; g.beginPath(); g.moveTo(0, -15); g.quadraticCurveTo(7, -15, 6, -8); g.quadraticCurveTo(18, -12, 25, -3); g.quadraticCurveTo(14, -2, 6, 3);
    g.lineTo(8, 16); g.lineTo(2, 9); g.lineTo(0, 12); g.lineTo(-2, 9); g.lineTo(-8, 16); g.lineTo(-6, 3); g.quadraticCurveTo(-14, -2, -25, -3); g.quadraticCurveTo(-18, -12, -6, -8); g.quadraticCurveTo(-7, -15, 0, -15); g.fill(); g.stroke();
    g.fillStyle = '#2b2620'; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 7, -8); g.quadraticCurveTo(s * 16, -10, s * 22, -4); g.quadraticCurveTo(s * 14, -6, s * 7, -5); g.fill(); }
    g.fillStyle = '#b5352b'; g.beginPath(); g.arc(0, -2, 3.2, 0, TAU); g.fill(); g.beginPath(); g.arc(-2.4, -11, 1, 0, TAU); g.arc(2.4, -11, 1, 0, TAU); g.fill();
  } else {                                                                                     // 菱形纸鸢
    g.fillStyle = kind === 1 ? '#d9573f' : '#3f78a8';
    g.beginPath(); g.moveTo(0, -16); g.lineTo(12, 0); g.lineTo(0, 15); g.lineTo(-12, 0); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#f1d36a'; g.beginPath(); g.arc(0, 0, 4.5, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(0, -16); g.lineTo(0, 15); g.moveTo(-12, 0); g.lineTo(12, 0); g.stroke();
  }
  g.restore();
}
K.kite = { layer: 'top', dur: 60,
  init(a) { a.k = [0, 1, 2].map(i => ({ x: S.vw * (0.28 + i * 0.22) + R.range(-40, 40), top: R.range(140, 290), y: 640, kind: i, ph: R() * TAU, ax: S.vw * (0.08 + i * 0.12) })); },
  update(a, dt) { for (const k of a.k) { k.y += (k.top - k.y) * Math.min(1, dt * 0.45); k.x += S.camDelta * 0.25; k.ax += S.camDelta * 0.25; k.ph += dt; } },
  draw(g, a) {
    for (const k of a.k) {
      const x = k.x + Math.sin(k.ph * 0.7) * 12 * (0.5 + S.wind), y = k.y + Math.sin(k.ph * 1.3) * 6;
      g.strokeStyle = 'rgba(60,50,40,.35)'; g.lineWidth = 0.6; g.beginPath(); g.moveTo(x, y + 4); g.quadraticCurveTo((x + k.ax) / 2 + 50, (y + 900) / 2 + 70, k.ax, 905); g.stroke();
      kite(g, x, y, k.kind, k.ph);
    }
  }
};

// ---------- 烟花：一颗升空，一声炸开，粒子带着重力和空气阻力散落 ----------
const FW = [[255, 200, 90], [255, 110, 90], [255, 150, 210], [140, 220, 255], [170, 255, 160], [255, 240, 200]];
K.fireworks = { layer: 'glow', dur: 16,
  init(a) { a.rk = []; a.ps = []; a.next = 0.2; },
  update(a, dt) {
    if (a.t < a.dur - 4.5 && (a.next -= dt) < 0) { a.next = R.range(0.4, 1.1); a.rk.push({ x: S.vw * R.range(0.12, 0.88), top: R.range(130, 320), age: 0, c: R.pick(FW), ring: R() < 0.4 }); A.boom(0.9); }
    for (const r of a.rk) {
      r.age += dt; r.y = lerp(690, r.top, 1 - (1 - Math.min(1, r.age / 0.9)) ** 2);
      if (r.age >= 0.9 && !r.done) {
        r.done = true;
        a.ps.push({ x: r.x, y: r.top, vx: 0, vy: 0, age: 0, life: 0.35, c: FW[5], s: 60 });                       // 炸开那一闪
        for (let i = 0, n = r.ring ? 72 : 110; i < n; i++) { const an = r.ring ? i / n * TAU : R() * TAU, sp = r.ring ? 190 : R.range(50, 215); a.ps.push({ x: r.x, y: r.top, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, age: 0, life: R.range(1.4, 2.3), c: R() < 0.15 ? FW[5] : r.c }); }
      }
    }
    a.rk = a.rk.filter(r => !r.done);
    for (const p of a.ps) { p.age += dt; p.vx *= 1 - dt * 1.4; p.vy = p.vy * (1 - dt * 1.4) + 55 * dt; p.x += p.vx * dt + S.camDelta * 0.2; p.y += p.vy * dt; }
    a.ps = a.ps.filter(p => p.age < p.life);
  },
  draw(g, a) {
    const base = g.globalAlpha * (0.35 + 0.65 * dark()); g.globalCompositeOperation = 'lighter';
    for (const r of a.rk) { g.globalAlpha = base; g.strokeStyle = 'rgba(255,214,150,.9)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(r.x, r.y); g.lineTo(r.x, r.y + 16); g.stroke(); }
    for (const p of a.ps) { const k = 1 - p.age / p.life, s = p.s ? p.s * k : 3.5 + 7 * k; g.globalAlpha = base * k; g.drawImage(SH.softDot(p.c, 16), p.x - s, p.y - s, s * 2, s * 2); }
  }
};

// ---------- 星河：一条斜贯夜空的光带，星点 + 星云 ----------
let MW = null;
const band = () => { const x0 = 0.2 * S.vw, y0 = 640, dx = 0.42 * S.vw, dy = -720, L = Math.hypot(dx, dy); return { x0, y0, dx, dy, L, nx: -dy / L, ny: dx / L }; };
const onBand = (B, u, off) => [B.x0 + B.dx * u + B.nx * off, B.y0 + B.dy * u + B.ny * off];
K.milkyway = { layer: 'sky', dur: 90, one: true,
  draw(g, a) {
    if (S.night < 0.05) return;
    if (!MW) { const r = SH.rng(SH.SEED ^ 0x3131); MW = { pts: Array.from({ length: 560 }, () => [r(), (r() + r() + r() - 1.5) * 70, r.range(0.4, 1.3), r() * TAU]), dust: Array.from({ length: 60 }, () => [r(), (r() - 0.5) * 80, r.range(40, 100), r.range(0.1, 0.22)]) }; }
    const B = band(), base = g.globalAlpha * S.night;
    g.save(); g.translate(B.x0 + B.dx / 2, B.y0 + B.dy / 2); g.rotate(Math.atan2(B.dy, B.dx)); g.globalAlpha = base;   // 柔光底
    const gb = g.createLinearGradient(0, -120, 0, 120); gb.addColorStop(0, 'rgba(190,200,240,0)'); gb.addColorStop(0.5, 'rgba(210,218,255,.16)'); gb.addColorStop(1, 'rgba(190,200,240,0)');
    g.fillStyle = gb; g.fillRect(-B.L * 0.55, -120, B.L * 1.1, 240); g.restore();
    for (const [u, off, w, al] of MW.dust) { const [x, y] = onBand(B, u, off); g.globalAlpha = base * al; g.drawImage(SH.softDot([205, 214, 255], 32), x - w, y - w * 0.6, w * 2, w * 1.2); }
    for (const [u, off, s, ph] of MW.pts) { const [x, y] = onBand(B, u, off); g.globalAlpha = base * (0.45 + 0.4 * Math.sin(S.t * 2 + ph)); g.fillStyle = '#fffaf0'; g.fillRect(x, y, s, s); }
  }
};

// ---------- 鹊桥：喜鹊飞来，在星河上搭一座桥；牛郎星、织女星沿桥走到一起 ----------
function magpie(g, x, y, s, dir, flap) {
  g.save(); g.translate(x, y); g.scale(dir * s, s);
  g.fillStyle = '#1c2230'; g.beginPath(); g.ellipse(0, 0, 4.5, 2, 0, 0, TAU); g.fill(); g.beginPath(); g.moveTo(-3, 0); g.lineTo(-10, -1.2); g.lineTo(-10, 1.2); g.fill();
  g.fillStyle = '#eef0f4'; g.beginPath(); g.ellipse(0.5, 0.9, 2.6, 1, 0, 0, TAU); g.fill();
  g.fillStyle = '#1c2230'; g.beginPath(); g.moveTo(1, -0.8); g.quadraticCurveTo(-1, -6 * flap - 1, -5, -7 * flap); g.lineTo(-1.5, -0.4); g.fill();
  g.restore();
}
K.queqiao = { layer: 'sky', dur: 42,
  init(a) { PR.spawn('milkyway'); A.magpie(); setTimeout(() => A.magpie(), 1600); a.n = 24; },
  update(a) { if (!a.met && a.t > 12) { a.met = true; A.chime(7); } },
  draw(g, a) {
    if (S.night < 0.05) return;
    const B = band(), [cx, cy] = onBand(B, 0.55, 0), span = 160, base = g.globalAlpha * S.night;
    const at = u => [cx + (u - 0.5) * 2 * span, cy - 46 * Math.sin(Math.PI * clamp(u, 0, 1))];        // 横跨星河的一道拱
    for (let i = 0; i < a.n; i++) {
      const u = (i + 0.5) / a.n, f = SH.smooth(clamp((a.t - 0.5 - i * 0.14) / 2.6, 0, 1)), [tx, ty] = at(u), side = u < 0.5 ? -1 : 1;
      const x = lerp(tx + side * S.vw * 0.6, tx, f), y = lerp(ty - 120, ty, f) + (f < 1 ? Math.sin(a.t * 3 + i) * 10 * (1 - f) : Math.sin(S.t * 2 + i) * 1.2);
      g.globalAlpha = base * 0.55; g.drawImage(SH.softDot([200, 215, 255], 32), x - 16, y - 12, 32, 24);
      g.globalAlpha = base; magpie(g, x, y, 1.9, -side, Math.sin(S.t * (f < 1 ? 16 : 5) + i));
    }
    const m = SH.smooth(clamp((a.t - 5) / 7, 0, 1));                                             // 牛郎（河这边）、织女（河那边）
    for (const [u0, c] of [[-0.25, [255, 236, 190]], [1.25, [210, 230, 255]]]) {
      const [x, y] = at(lerp(u0, 0.5 + (u0 < 0.5 ? -0.04 : 0.04), m)), s = 22 + 6 * Math.sin(S.t * 3) + (a.met ? 16 : 0);
      g.globalAlpha = base; g.drawImage(SH.softDot(c, 32), x - s, y - s, s * 2, s * 2); g.fillStyle = '#fffdf6'; g.beginPath(); g.arc(x, y, 2.2, 0, TAU); g.fill();
    }
  }
};

// ---------- 玉兔：月亮放大，桂树下白兔捣药 ----------
K.rabbit = { layer: 'sky', dur: 40,
  draw(g, a) {
    const m = SH.sky.moon; if (!m) return;
    const [x, y, n] = m, r = 40, base = g.globalAlpha * n * SH.smooth(clamp(a.t / 2.5, 0, 1));
    g.globalAlpha = base; g.drawImage(SH.softDot([255, 244, 214], 64), x - r * 3.2, y - r * 3.2, r * 6.4, r * 6.4);
    g.fillStyle = '#f8f2e0'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.save(); g.beginPath(); g.arc(x, y, r, 0, TAU); g.clip(); g.fillStyle = 'rgba(175,160,130,.38)';
    g.fillRect(x - r * 0.62, y - r * 0.05, r * 0.08, r * 0.6);                                   // 桂树
    g.beginPath(); g.arc(x - r * 0.58, y - r * 0.22, r * 0.3, 0, TAU); g.arc(x - r * 0.4, y - r * 0.05, r * 0.2, 0, TAU); g.arc(x - r * 0.78, y - r * 0.02, r * 0.18, 0, TAU); g.fill();
    const bx = x + r * 0.22, by = y + r * 0.32, pound = Math.max(0, Math.sin(S.t * 4)) * r * 0.1;   // 兔子：身、头、长耳，举杵捣药
    g.beginPath(); g.ellipse(bx, by, r * 0.2, r * 0.15, 0, 0, TAU); g.fill();
    g.beginPath(); g.arc(bx + r * 0.16, by - r * 0.16, r * 0.1, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(bx + r * 0.12, by - r * 0.36, r * 0.035, r * 0.14, -0.2, 0, TAU); g.ellipse(bx + r * 0.2, by - r * 0.35, r * 0.035, r * 0.13, 0.15, 0, TAU); g.fill();
    g.fillRect(bx + r * 0.36, by - r * 0.32 - pound, r * 0.05, r * 0.36);
    g.beginPath(); g.moveTo(bx + r * 0.28, by + r * 0.04); g.lineTo(bx + r * 0.52, by + r * 0.04); g.lineTo(bx + r * 0.47, by + r * 0.18); g.lineTo(bx + r * 0.33, by + r * 0.18); g.fill();
    g.restore();
  }
};

// ---------- 许愿灯：一盏大灯慢慢升空，心愿竖写在灯旁 ----------
K.wish = { layer: 'top', dur: 50,
  init(a) { a.x = S.vw * 0.5; a.y = 650; a.ph = R() * TAU; },
  update(a, dt) { a.y -= (a.t < 2 ? 4 : 13) * dt; a.x += (Math.sin(a.t * 0.4 + a.ph) * 7 - 2 * S.wind) * dt + S.camDelta * 0.3; },
  draw(g, a) {
    const s = 4.2 * Math.max(0.5, 1 - a.t / 70), x = a.x, y = a.y, base = g.globalAlpha;
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = base * (0.85 + 0.15 * Math.sin(S.t * 7 + a.ph));
    g.drawImage(SH.softDot([255, 160, 70], 32), x - 34 * s, y - 40 * s, 68 * s, 68 * s);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = base;
    const gr = g.createLinearGradient(0, y - 12 * s, 0, y + 2 * s); gr.addColorStop(0, '#f6cc85'); gr.addColorStop(1, '#e8893a');
    g.fillStyle = gr; g.beginPath(); g.moveTo(x - 5 * s, y - 12 * s); g.lineTo(x + 5 * s, y - 12 * s); g.lineTo(x + 3.8 * s, y + 1.5 * s); g.lineTo(x - 3.8 * s, y + 1.5 * s); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(120,60,20,.5)'; g.lineWidth = 0.6; g.stroke();
    g.font = `16px ${SH.KAI}`; g.textAlign = 'center'; g.fillStyle = 'rgba(255,238,206,.96)'; g.shadowColor = 'rgba(255,170,80,.9)'; g.shadowBlur = 8;
    [...a.text].forEach((ch, i) => g.fillText(ch, x + 6.5 * s + 14, y - 10 * s + i * 18.5));
  }
};

// ---------- 彩虹：七道弧，脚落在山后 ----------
const RAIN7 = ['#e05a4f', '#f0a050', '#f2d36b', '#79b46a', '#5aa3c8', '#5a6fb8', '#8a62a8'];
K.rainbow = { layer: 'sky', dur: 45, one: true,
  draw(g, a) {
    const day = 1 - S.night; if (day < 0.1) return;
    const cx = S.vw * 0.55, cy = 830, r0 = Math.min(S.vw * 0.42, 580);
    g.globalAlpha *= 0.3 * day; g.lineWidth = 7;
    RAIN7.forEach((c, i) => { g.strokeStyle = c; g.beginPath(); g.arc(cx, cy, r0 - i * 6.5, Math.PI * 1.06, Math.PI * 1.94); g.stroke(); });
  }
};

// ---------- 流星：夜里一道道划过 ----------
K.meteors = { layer: 'sky', dur: 30, one: true,
  init(a) { a.m = []; a.next = 0.4; },
  update(a, dt) {
    if (S.night > 0.3 && a.t < a.dur - 3 && (a.next -= dt) < 0) { a.next = R.range(0.7, 2.4); a.m.push({ x: S.vw * R.range(0.35, 1.05), y: R.range(30, 240), vx: -R.range(420, 640), vy: R.range(150, 260), age: 0, life: R.range(0.6, 1.1) }); }
    for (const m of a.m) { m.age += dt; m.x += m.vx * dt; m.y += m.vy * dt; }
    a.m = a.m.filter(m => m.age < m.life);
  },
  draw(g, a) {
    for (const m of a.m) {
      const k = 1 - m.age / m.life, tx = m.x - m.vx * 0.13, ty = m.y - m.vy * 0.13, gr = g.createLinearGradient(m.x, m.y, tx, ty);
      gr.addColorStop(0, `rgba(255,252,235,${0.95 * k})`); gr.addColorStop(1, 'rgba(255,252,235,0)');
      g.strokeStyle = gr; g.lineWidth = 1.7; g.beginPath(); g.moveTo(m.x, m.y); g.lineTo(tx, ty); g.stroke();
    }
  }
};
})();

</script>
<script>
'use strict';
/* 山河长卷 · director —— 把一首诗的“场景配方”变成画：先换季节、时辰、天气，再让诗里的东西一样样出场；还认得农历节日。
   配方字段（见 tools/poem-list.txt）：s 季节、d 时辰、w 天气、need 画里得先有、p 画中物、f 节日。 */
(() => {
const S = SH.S, A = SH.audio, ui = SH.ui, PR = SH.props, L = SH.life;
const D = SH.director = {};
const TOD = { dawn: 0.27, day: 0.45, dusk: 0.735, night: 0.95 };
const NIGHTLY = ['烟花', '孔明灯', '星河', '鹊桥', '玉兔', '流星', '萤'];
const dark = () => S.night > 0.3 || S.twilight > 0.5;
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- 画中物：各有各的出场方式 ----------
const TREE = { 桃: 'peach', 杏: 'peach', 柳: 'willow', 梅: 'plum', 枫: 'maple', 松: 'pine' };
function plant(kind) {                                                                   // 近山上种三棵，看它们长出来
  const Ly = SH.LAYERS[3]; let n = 0;
  for (let i = 0; i < 14 && n < 3; i++) {
    const X = rnd(0.15, 0.85) * S.vw - S.cam * Ly.p, top = SH.terrain.top(3, X);
    if (top < Ly.base - 12) { L.plant(3, X, top + rnd(5, 18), kind); n++; }
  }
  if (n) A.plant();
}
function boat(type) {
  const y = rnd(700, 820);
  L.boats.push({ X: SH.layerX0(1) + S.vw * rnd(0.3, 0.7), y, s: SH.lerp(0.55, 1.25, (y - 690) / 162), v: (Math.random() < 0.5 ? 1 : -1) * rnd(4, 8), type, ph: Math.random() * SH.TAU });
  L.boats.sort((a, b) => a.y - b.y);
}
function qin() { const t = A.now(); [0, 2, 4, 3, 1, 2, 0].forEach((s, i) => A.pluck(A.step(A.tonic(3), s), t + 0.2 + i * 0.45, 0.45, { vib: i === 6 })); }
const DO = {
  白鹭: () => L.spawnFlock('egret', SH.layerX0(0.56) - 40, 470, { dir: 1, n: 8 }),
  雁: () => { L.spawnFlock('geese', SH.layerX0(0.56) + S.vw + 40, 220, { dir: -1, n: 9 }); A.honk(3); },
  飞鸟: () => { L.spawnFlock('flock', SH.layerX0(0.56) + S.vw * 0.5, 380, { burst: true }); A.birds('flock'); },
  鹊: () => { L.spawnFlock('flock', SH.layerX0(0.56) + S.vw * 0.4, 420, { burst: true, n: 6 }); A.magpie(); },
  鸦: () => { L.spawnFlock('flock', SH.layerX0(0.56) + S.vw * 0.6, 300, { burst: true, n: 5 }); A.caw(3); },
  鱼: () => { for (let i = 0; i < 3; i++) setTimeout(() => { L.koi(SH.layerX0(1) + S.vw * rnd(0.25, 0.75), rnd(720, 840)); A.koi(); }, i * 700); },
  帆: () => boat('sail'), 渔舟: () => boat('skiff'),
  孔明灯: () => { for (let i = 0; i < 7; i++) setTimeout(() => L.lantern(S.vw * rnd(0.15, 0.85), rnd(620, 680)), i * 450); },
  龙: () => SH.dragon.summon(),
  钟: () => A.bell(), 犬: () => A.bark(3), 猿: () => A.monkey(), 笛: () => A.flute(12), 鼓: () => A.drum(16, 0.32), 爆竹: () => A.crackers(40), 琴: qin,
  雷: () => { A.rumble(); ui.flash(0.35); },
  无鸟: () => { S.noBirds = 75; },                                                       // 千山鸟飞绝：已有的鸟飞出画面，七十来秒不再来（life.js 听 S.noBirds）
  落花: () => { S.windT = 7; }, 萤: () => { S.fireflyT = 60; }, 荷: () => {},                    // 荷：夏天的汀洲本来就有荷塘，换到夏天即可
  鹅: () => PR.spawn('goose'), 鸭: () => PR.spawn('goose', { duck: true }), 黄鹂: () => { if (!L.planted.some(p => { const x = SH.toSX(p.X, SH.LAYERS[p.li].p); return x > 60 && x < S.vw - 60; })) plant('willow'); PR.spawn('oriole'); },   /* 没树先种柳：黄鹂要落在真枝上 */ 燕: () => PR.spawn('swallow'),
  蝴蝶: () => PR.spawn('butterfly'), 蜻蜓: () => PR.spawn('dragonfly'), 牧童: () => PR.spawn('cowherd'), 龙舟: () => PR.spawn('dboat'),
  纸鸢: () => PR.spawn('kite'), 烟花: () => dark() ? PR.spawn('fireworks') : A.crackers(40), 星河: () => PR.spawn('milkyway'), 鹊桥: () => PR.spawn('queqiao'),
  玉兔: () => PR.spawn('rabbit'), 彩虹: () => PR.spawn('rainbow'), 流星: () => PR.spawn('meteors')
};
Object.keys(TREE).forEach(k => { DO[k] = () => plant(TREE[k]); });
D.can = name => !!DO[name];
D.cue = p => (p.p || []).forEach((k, i) => setTimeout(() => DO[k] && DO[k](), k === '无鸟' ? 0 : 1800 + i * 1300));   // “无鸟”立刻生效，其余一样样出场

// ---------- 换景：季节、时辰、天气；时辰走到了再吟诗 ----------
let pending = null;
D.stage = (r, then) => {
  S.stay = Math.max(S.stay || 0, 30); SH.poems.timer = Math.max(SH.poems.timer, 25);      // 画卷停一停，自动吟诗也让一让
  const ok = n => !r.s || r.s.includes(n);
  let sn = r.s && !r.s.includes(S.season) ? r.s[0] : null;
  if (r.w && r.w.includes('雪') && ok(3)) sn = 3;                                       // 只有冬天才下雪
  if (r.p && r.p.includes('荷') && ok(1)) sn = 1;
  if (sn != null && sn !== S.season) SH.setSeason(sn);
  const want = r.d || (r.need === 'moon' || (r.p || []).some(k => NIGHTLY.includes(k)) ? ['night'] : null);
  if (want && !want.includes(SH.poems.tod())) SH.goTod(TOD[want[0]]);
  const w = r.w || [];
  if (w.includes('雨')) S.rainTimer = Math.max(S.rainTimer, 28);
  if (w.includes('风')) S.windT = 8;
  if (w.includes('雾')) PR.spawn('mist');
  pending = { then, wait: 0.4 };
};
D.perform = (p, opt) => D.stage(p, () => SH.poems.show(p, opt));
SH.hook('update', dt => {
  if (pending && S.todTarget == null && (pending.wait -= dt) < 0) { const f = pending.then; pending = null; if (f) f(); }
  if (S.windT > 0) S.windT -= dt;
  if (S.fireflyT > 0) S.fireflyT -= dt;
  if (S.noBirds > 0) S.noBirds -= dt;
});

// ---------- 农历节日：用浏览器自带的 chinese 历法，不写死日期表 ----------
const LUNAR = (() => { try { return new Intl.DateTimeFormat('zh-u-ca-chinese', { month: 'numeric', day: 'numeric' }); } catch (e) { return null; } })();
D.lunar = d => {
  if (!LUNAR) return null;
  const o = {}; for (const x of LUNAR.formatToParts(d)) o[x.type] = x.value;
  const m = parseInt(o.month, 10), dd = parseInt(o.day, 10);                              // 闰月（如“闰6”）解析不出数字，正好不算节
  return isNaN(m) || isNaN(dd) ? null : { m, d: dd };
};
// ponytail: 浏览器的农历（ICU）把 2027 年正月初一算成 2 月 7 日（实为 2 月 6 日，那天新月在北京时间 23:56），整个正月差一天；这里逐日改正，以后发现别的年份再加
const ICU_FIX = { '2027-02-05': '春节', '2027-02-20': '元宵', '2027-02-21': null };
const QM = y => Math.floor((y % 100) * 0.2422 + 4.81) - Math.floor((y % 100) / 4);         // 清明在 4 月几号（21 世纪）
const FEST_DAY = { 101: '春节', 115: '元宵', 505: '端午', 707: '七夕', 815: '中秋', 909: '重阳' };
D.festOf = (d = new Date()) => {
  const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  if (ymd in ICU_FIX) return ICU_FIX[ymd];
  if (d.getMonth() === 3 && d.getDate() === QM(d.getFullYear())) return '清明';
  const l = D.lunar(d); if (!l) return null;
  if (FEST_DAY[l.m * 100 + l.d]) return FEST_DAY[l.m * 100 + l.d];
  const t = D.lunar(new Date(d.getTime() + 864e5));
  return t && t.m === 1 && t.d === 1 ? '春节' : null;                                   // 除夕也算过年
};
D.today = SH.Q.get('today') || (() => { try { return D.festOf(); } catch (e) { return null; } })();

const FEST = D.FEST = {
  春节: { s: [3], d: ['night'], p: ['爆竹', '烟花', '孔明灯'] },
  元宵: { s: [0], d: ['night'], p: ['孔明灯', '烟花'] },
  清明: { s: [0], d: ['day'], w: ['雨'], p: ['纸鸢', '柳', '牧童'] },
  端午: { s: [1], d: ['day'], p: ['龙舟', '鼓'] },
  七夕: { s: [1], d: ['night'], p: ['鹊桥', '萤', '流星'] },
  中秋: { s: [2], d: ['night'], p: ['玉兔', '孔明灯'] },
  重阳: { s: [2], d: ['day'], p: ['雁', '枫'] }
};
D.fest = name => {
  const F = FEST[name]; if (!F) return;
  const list = SH.DB.poems.filter(p => p.f === name), p = list[Math.random() * list.length | 0], props = [...new Set([...F.p, ...((p && p.p) || [])])];
  ui.toast([...name].join(' '));
  D.stage(F, () => (p ? SH.poems.show({ ...p, p: props }) : D.cue({ p: props })));
};
SH.feat.fest = () => {
  const card = ui.modal({ title: '节 日 彩 蛋', html: `<p class="sub">${D.today ? `今天是${D.today}，画卷也过节。` : '点一个节日，画卷就过这个节。'}</p><div class="chips">${Object.keys(FEST).map(n => `<button class="chip${n === D.today ? ' on' : ''}" data-f="${n}">${n}</button>`).join('')}</div>` });
  card.qa('[data-f]').forEach(b => { b.onclick = () => { ui.close(); D.fest(b.dataset.f); }; });
};
SH.hook('opened', () => { if (D.today && !SH.gift) setTimeout(() => D.fest(D.today), 5000); });   // 节日当天：开卷就过节

// 调试/演示：#auto&perform=春晓 / #prop=鹅,纸鸢 / #fest=中秋 / #today=七夕
const Q = SH.Q, find = t => SH.DB.poems.find(p => p.t === t || p.t.split(' · ')[0] === t);
if (Q.has('perform')) setTimeout(() => D.perform(find(Q.get('perform')) || SH.poems.pick()), 2200);
if (Q.has('prop')) setTimeout(() => D.cue({ p: Q.get('prop').split(',') }), 2200);
if (Q.has('fest')) setTimeout(() => D.fest(Q.get('fest')), 2200);
})();

</script>
<script>
'use strict';
/* 山河长卷 · games-a —— 诗与画的玩法（一）：念诗显景、俗语变雅词、名字藏诗、抽诗签、许愿灯。
   诗句全部来自 data-poems.js（tools/make_poems.py 从开源诗词库生成），这里只写玩法，不写诗。共用工具挂在 SH.games，games-b.js 也用。 */
(() => {
const S = SH.S, ui = SH.ui, A = SH.audio, esc = SH.esc, DB = SH.DB, D = SH.director;
const G = SH.games = {};
const han = G.han = s => (s || '').replace(/[^一-鿿]/g, '');                    // 只留汉字：比句子时不管标点、空格、语音识别加的字母
G.pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
G.shuffle = (arr, r = Math.random) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
G.hl = (s, chars) => [...s].map(c => (chars.includes(c) ? `<span class="hl">${esc(c)}</span>` : esc(c))).join('');
G.name = p => p.t.split(' · ')[0];
// 全部句子：诗库（带场景配方）+ 补充诗（三大选本里其余的诗）
G.all = [...DB.poems.map(p => ({ t: p.t, a: p.a, l: p.l, p })), ...DB.more.map(([t, a, l]) => ({ t, a, l }))];
G.lines = [];
G.all.forEach(P => P.l.forEach((s, i) => { const h = han(s); if (h.length >= 3) G.lines.push({ s, h, P, i }); }));
G.poemOf = e => DB.poems.find(p => G.name(p) === e.t.split(' · ')[0] && p.a === e.a);

// 纸面卡片：绢色底 + 纤维纹理；文字超宽时先在逗号处断行，再按字断
G.paper = (W, H) => {
  const [c, x] = SH.canvas(W, H);
  x.fillStyle = '#efe6d2'; x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = 'multiply'; x.globalAlpha = 0.6; x.fillStyle = x.createPattern(SH.makePaper(), 'repeat'); x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  return [c, x];
};
G.wrap = (x, text, cx, y, maxW, lh) => {
  const out = [];
  for (const seg of x.measureText(text).width > maxW ? text.replace(/，/g, '，\u0001').split('\u0001') : [text]) {   // 不用正则后行断言：老 iPhone 的 Safari 不认
    let line = '';
    for (const ch of seg) { if (line && x.measureText(line + ch).width > maxW) { out.push(line); line = ch; } else line += ch; }
    if (line) out.push(line);
  }
  out.forEach((l, i) => x.fillText(l, cx, y + i * lh));
  return out.length;
};
G.foot = (x, W, H, text) => { x.textAlign = 'left'; x.font = `20px ${SH.KAI}`; x.fillStyle = '#9a8d78'; x.fillText(text, 40, H - 46); };

// ---------- 念诗显景：认出念的是哪首哪一句（容得下语音识别错一两个字），画就照这首诗的配方变 ----------
function lcs(a, b) {                                                                      // 最长公共子序列：按顺序对上几个字（错一两个字也认得）
  const dp = new Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) { let prev = 0; for (let j = 1; j <= b.length; j++) { const t = dp[j]; dp[j] = a[i - 1] === b[j - 1] ? prev + 1 : Math.max(dp[j], dp[j - 1]); prev = t; } }
  return dp[b.length];
}
G.match = (text, pool = DB.poems) => {
  const q = han(text); if (q.length < 2) return null;
  for (const p of pool) if (han(G.name(p)) === q) return { p, i: 0 };                     // 报诗题也行
  let best = null;
  for (const p of pool) p.l.forEach((l, i) => {
    const h = han(l); if (h.length < 3) return;
    const s = lcs(q, h); if (s < Math.min(4, h.length) || s < 0.7 * h.length) return;      // 这句的七成以上要对上（短句要整句）
    const score = s / h.length + 0.5 * s / Math.max(q.length, h.length);
    if (!best || score > best.score) best = { p, i, score };
  });
  return best;
};
SH.feat.recite = () => {
  const card = ui.modal({ title: '念 诗 显 景', html: '<p class="sub">念一句诗，或者打出来，画就变成诗里的样子。</p><div id="gIn"></div><p class="res muted" id="gRes"></p><div class="chips" id="gChips"></div>' });
  const res = card.q('#gRes'), chips = card.q('#gChips'), live = DB.poems.filter(p => p.p || p.w);
  const go = v => {
    const m = G.match(v);
    if (!m) { res.textContent = '诗库里没认出这句。换一句，或点下面的诗题：'; return; }
    ui.close(); ui.toast(`《${G.name(m.p)}》`); D.perform(m.p, { from: m.i, hl: m.i });
  };
  ui.inputRow(card, '#gIn', { placeholder: '比如：' + G.pick(live).l[0], onSubmit: go });
  chips.innerHTML = G.shuffle(live).slice(0, 8).map(p => `<button class="chip" data-i="${DB.poems.indexOf(p)}">${esc(G.name(p))}</button>`).join('');
  chips.onclick = e => { const b = e.target.closest('[data-i]'); if (b) { ui.close(); D.perform(DB.poems[+b.dataset.i]); } };
};

// ---------- 俗语变雅词：白话里含哪个关键词，就还哪一句 ----------
function yaFind(v) {
  const t = v.replace(/\s/g, '').toLowerCase(); let best = [], bl = 0;
  for (const e of DB.ya) for (const k of e.k) {
    const kl = k.toLowerCase();
    if (!(t.includes(kl) || (t.length >= 2 && kl.includes(t)))) continue;
    const L = Math.min(kl.length, t.length);                                              // 对上的关键词越长越准
    if (L > bl) { bl = L; best = [e]; } else if (L === bl && !best.includes(e)) best.push(e);
  }
  return best;
}
function yaCard(v, e) {
  const W = 750, H = 640, [c, x] = G.paper(W, H);
  x.textAlign = 'center'; x.fillStyle = '#8a7d6a'; x.font = `28px ${SH.KAI}`; x.fillText(v, W / 2, 96);
  const w = x.measureText(v).width; x.strokeStyle = 'rgba(181,53,43,.75)'; x.lineWidth = 2; x.beginPath(); x.moveTo(W / 2 - w / 2 - 8, 86); x.lineTo(W / 2 + w / 2 + 8, 86); x.stroke();
  x.fillStyle = '#2a241c'; x.font = `46px ${SH.KAI}`;
  const n = G.wrap(x, e.q, W / 2, 230, 640, 70);
  x.fillStyle = '#5a4e40'; x.font = `26px ${SH.KAI}`; x.fillText(`—— ${e.t} · ${e.a}`, W / 2, 230 + n * 70 + 26);
  x.drawImage(SH.makeSeal('雅', 120), W - 150, H - 150, 96, 96);
  G.foot(x, W, H, '山河长卷 · 俗语变雅词');
  return c;
}
SH.feat.ya = () => {
  const card = ui.modal({ title: '俗 语 变 雅 词', html: '<p class="sub">说一句大白话，还你一句千古名句。</p><div id="gIn"></div><div class="res" id="gRes"></div><div class="chips" id="gChips"></div>' });
  const res = card.q('#gRes'), chips = card.q('#gChips');
  const show = (v, e) => {
    const P = G.poemOf(e);
    res.innerHTML = `<div class="strike">${esc(v)}</div><div class="big">${esc(e.q)}</div><div class="src">—— ${esc(e.t)} · ${esc(e.a)}</div><div class="btns"><button data-a="again">换一句</button>${P ? '<button data-a="paint">让画也变</button>' : ''}<button class="go" data-a="card">存成卡片</button></div>`;
    ui.say(e.q); A.poem();
    res.querySelector('[data-a=again]').onclick = () => { const c = yaFind(v).filter(x => x !== e); show(v, G.pick(c.length ? c : DB.ya.filter(x => x !== e))); };
    if (P) res.querySelector('[data-a=paint]').onclick = () => { ui.close(); D.perform(P); };
    res.querySelector('[data-a=card]').onclick = () => ui.showImage(yaCard(v, e), { title: '雅 词', name: '山河长卷-雅词.png' });
  };
  const go = v => { const c = yaFind(v); if (c.length) show(v, G.pick(c)); else res.innerHTML = '<p class="muted">这句大白话把我难住了。换个说法，或者点下面的词试试：</p>'; };
  ui.inputRow(card, '#gIn', { placeholder: '比如：好久不见', onSubmit: go });
  chips.innerHTML = G.shuffle(DB.ya).slice(0, 10).map(e => `<button class="chip">${esc(e.k[0])}</button>`).join('');
  chips.onclick = e => { const b = e.target.closest('.chip'); if (b) { card.q('#gIn input').value = b.textContent; go(b.textContent); } };
};

// ---------- 名字藏诗：名字里每个字，各找一句含它的诗（打头的、诗库里的优先），同一个名字结果固定 ----------
function nameLines(name, salt) {
  const r = SH.rng(SH.nameSeed(name) + salt * 7919);
  return [...name].map(ch => {
    let best = null, bs = -1;
    for (const L of G.lines) {
      if (!L.h.includes(ch)) continue;
      const s = (L.h[0] === ch ? 3 : 0) + (L.P.p ? 2 : 0) + (L.h.length <= 7 ? 1 : 0) + r() * 2.5;
      if (s > bs) { bs = s; best = L; }
    }
    if (!best && DB.nc && DB.nc[ch]) { const [s, t, a] = DB.nc[ch]; best = { s, h: han(s), P: { t, a } }; }   // 句库里没有的字：名字字库（名家诗里配的一句）
    return best && { ...best, ch };
  });
}
function nameCard(name, rows) {
  const most = Math.max(...rows.map(r => (r ? [...r.s].length : 0)), 5), W = 750, H = Math.round(170 + Math.min(56, 600 / most) * 1.12 * most + 300), [c, x] = G.paper(W, H), colW = 128, x0 = W / 2 + (rows.length - 1) * colW / 2;   // 高度随最长那句定
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#2a241c'; x.font = `38px ${SH.KAI}`; x.fillText('名 字 藏 诗', W / 2, 78);
  rows.forEach((r, i) => {                                                                // 竖排，从右往左；名字里的字点成朱红
    const cx = x0 - i * colW; if (!r) return;
    const chars = [...r.s], fs = Math.min(56, 600 / chars.length);
    chars.forEach((ch, j) => { x.fillStyle = ch === r.ch ? '#b5352b' : '#2a241c'; x.font = `${fs}px ${SH.KAI}`; x.fillText(ch, cx, 168 + j * fs * 1.12); });
    x.fillStyle = '#7a6d5c'; x.font = `17px ${SH.KAI}`;
    [...`${G.name(r.P)} · ${r.P.a}`].slice(0, 26).forEach((ch, j) => x.fillText(ch, cx - 46, 176 + j * 20));
  });
  x.textBaseline = 'alphabetic'; x.drawImage(SH.makeSeal(name, 160), 64, H - 210, 124, 124);
  G.foot(x, W, H, '　　　　　　　　山河长卷 · 名字藏诗');
  return c;
}
SH.feat.name = () => {
  const card = ui.modal({ title: '名 字 藏 诗', wide: true, html: '<p class="sub">写下名字，看看它藏在哪些诗句里。</p><div id="gIn"></div><div class="res" id="gRes"></div>' });
  const res = card.q('#gRes'); let salt = 0;
  const go = v => {
    const name = han(v).slice(0, 4); if (!name) { ui.toast('写 个 名 字'); return; }
    const rows = nameLines(name, salt++);
    res.innerHTML = `<div class="nrows">${rows.map((r, i) => (r ? `<p><span class="nl">${G.hl(r.s, r.ch)}</span><small>${esc(G.name(r.P))} · ${esc(r.P.a)}</small></p>` : `<p class="muted">“${esc(name[i])}”字太新，古诗里难寻</p>`)).join('')}</div><div class="btns"><button data-a="again">换一组</button><button class="go" data-a="card">存成卡片</button></div>`;
    A.poem();
    res.querySelector('[data-a=again]').onclick = () => go(name);
    res.querySelector('[data-a=card]').onclick = () => ui.showImage(nameCard(name, rows), { title: '名 字 藏 诗', name: `山河长卷-${name}.png` });
  };
  const inp = ui.inputRow(card, '#gIn', { placeholder: '你的名字', onSubmit: go, mic: false });
  inp.maxLength = 4; inp.value = S.name || SH.store.get('name', '');
};

// ---------- 抽诗签：一天一支（存在本机），全是吉签 ----------
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const cn = n => { const D = '〇一二三四五六七八九'; return n <= 10 ? (n === 10 ? '十' : D[n]) : n < 20 ? '十' + D[n - 10] : D[Math.floor(n / 10)] + '十' + (n % 10 ? D[n % 10] : ''); };   // 2→二 12→十二 31→三十一
function qianCard(q) {
  const W = 750, H = 1180, [c, x] = G.paper(W, H), d = new Date();
  const gr = x.createLinearGradient(245, 0, 505, 0);                                      // 一根竹签
  gr.addColorStop(0, '#d9b97c'); gr.addColorStop(0.5, '#f3e3b8'); gr.addColorStop(1, '#d4b175');
  x.fillStyle = gr; x.beginPath(); x.moveTo(245, 110); x.quadraticCurveTo(375, 40, 505, 110); x.lineTo(505, 760); x.lineTo(245, 760); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(120,80,30,.35)'; x.lineWidth = 2; x.stroke();
  for (const y of [300, 560]) { x.beginPath(); x.moveTo(245, y); x.lineTo(505, y); x.stroke(); }
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#b5352b'; x.font = `44px ${SH.KAI}`;
  [...q.lv].forEach((ch, i) => x.fillText(ch, 375, 150 + i * 52));
  const cols = q.q.split('，'), cw = 66;                                                  // 签句竖写，从右往左
  cols.forEach((col, i) => { const cx = 375 + (cols.length - 1) * cw / 2 - i * cw, chars = [...col], fs = Math.min(42, 400 / chars.length); x.fillStyle = '#2a241c'; x.font = `${fs}px ${SH.KAI}`; chars.forEach((ch, j) => x.fillText(ch, cx, 330 + j * fs * 1.1)); });
  x.textBaseline = 'alphabetic'; x.fillStyle = '#5a4e40'; x.font = `24px ${SH.KAI}`; x.fillText(`—— ${q.t} · ${q.a}`, W / 2, 820);
  x.fillStyle = '#2a241c'; x.font = `28px ${SH.KAI}`; G.wrap(x, `解：${q.x}`, W / 2, 890, 600, 44);
  x.fillStyle = '#7a6d5c'; x.font = `22px ${SH.KAI}`; x.fillText(`${SH.ganzhi(d.getFullYear())}年${cn(d.getMonth() + 1)}月${cn(d.getDate())}日 · 今日诗签`, W / 2, H - 100);
  x.drawImage(SH.makeSeal(S.name || '长卷', 120), W - 150, H - 170, 90, 90);
  G.foot(x, W, H, '山河长卷 · 抽诗签');
  return c;
}
SH.feat.qian = () => {
  const saved = SH.store.get('qian', null), drawn = saved && saved.d === today() && DB.qian[saved.i];
  const card = ui.modal({ title: '今 日 诗 签', html: `<div class="qtube" id="qT">${'<i></i>'.repeat(9)}<b>签</b></div><p class="sub" id="qTip">${drawn ? '今天已经抽过了，这是你的签。明天再来摇。' : '心里默念一件事，摇一摇。'}</p><div id="qRes"></div><div class="btns">${drawn ? '' : '<button class="go" data-a="shake">摇 签</button>'}</div>` });
  card.qa('#qT i').forEach((s, i) => { s.style.left = 21 + i * 7.6 + 'px'; s.style.height = 78 + (i * 37) % 23 + 'px'; s.style.transform = `rotate(${(i - 4) * 2.4}deg)`; });
  const reveal = q => {
    const P = G.poemOf(q);
    card.q('#qRes').innerHTML = `<div class="qslip"><span class="lv">${esc(q.lv)}</span><div class="qq">${q.q.split('，').map(esc).join('，<br>')}</div><div class="src">—— ${esc(q.t)} · ${esc(q.a)}</div><p class="qx">解：${esc(q.x)}</p></div><div class="btns">${P ? '<button data-a="paint">看画</button>' : ''}<button class="go" data-a="card">存成签纸</button></div>`;
    card.q('[data-a=card]').onclick = () => ui.showImage(qianCard(q), { title: '今 日 诗 签', name: '山河长卷-诗签.png' });
    if (P) card.q('[data-a=paint]').onclick = () => { ui.close(); D.perform(P); };
  };
  if (drawn) { reveal(drawn); return; }
  card.q('[data-a=shake]').onclick = e => {
    e.target.disabled = true; const T = card.q('#qT'); T.classList.add('shake'); A.drum(7, 0.17);
    setTimeout(() => {
      T.classList.remove('shake');
      const i = Math.floor(Math.random() * DB.qian.length); SH.store.set('qian', { d: today(), i });
      T.querySelectorAll('i')[4].classList.add('out'); A.chime(5);
      setTimeout(() => { card.q('#qTip').textContent = '签出来了：'; e.target.remove(); reveal(DB.qian[i]); }, 750);
    }, 1300);
  };
};

// ---------- 许愿灯：写下心愿，入夜放一盏大灯，满天的灯陪它飞 ----------
SH.feat.wish = () => {
  const card = ui.modal({ title: '许 愿 灯', html: '<p class="sub">写下一个心愿，放一盏灯，让它飞进今晚的星空。</p><div id="gIn"></div>' });
  const inp = ui.inputRow(card, '#gIn', { placeholder: '我的心愿（12 个字以内）', onSubmit: v => {
    const w = v.replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 12); if (!w) return;
    ui.close();
    D.stage({ d: ['night'] }, () => {
      SH.props.spawn('wish', { text: w });
      for (let i = 0; i < 8; i++) setTimeout(() => SH.life.lantern(S.vw * (0.18 + Math.random() * 0.64), 640 + Math.random() * 50), 700 + i * 380);
      A.chime(6); ui.toast('心 愿 随 灯 去');
      const b = DB.ya.find(e => e.k.includes('祝福'));
      if (b) setTimeout(() => ui.bubble(b.q, S.vw / 2, 300, `${b.t} · ${b.a}`, 7000), 6500);
    });
  } });
  inp.maxLength = 12;
};
})();

</script>
<script>
'use strict';
/* 山河长卷 · games-b —— 诗与画的玩法（二）：飞花令（人机对答 + 挑战链接）、看画猜诗、玩法总览。共用 games-a.js 的 SH.games。 */
(() => {
const S = SH.S, ui = SH.ui, A = SH.audio, esc = SH.esc, DB = SH.DB, D = SH.director, G = SH.games, $ = id => document.getElementById(id);
const KEYS = '花月春风山水云雪江夜酒人'.split('');

// ---------- 飞花令：轮流说一句带某字的诗；山河的“体力”有限，接到一定句数会认输 ----------
function feihua(key, target = null, from = '') {
  const used = new Set(), pool = G.lines.filter(x => x.h.includes(key));
  let you = 0, me = 0, over = false;
  const stamina = 6 + Math.floor(Math.random() * 7);
  const card = ui.modal({ title: '飞 花 令', wide: true, html: `<div class="fhHead"><b class="fhKey">${esc(key)}</b><span id="fhScore"></span></div>
<p class="sub">轮流说一句带“${esc(key)}”字的诗，接不上就算输。${target != null ? `接满 ${target + 1} 句，就赢了${esc(from || '对方')}的挑战。` : '你先来。'}</p>
<div class="fhLog" id="fhLog"></div><div id="fhIn"></div><p class="res muted" id="fhMsg"></p>
<div class="btns" id="fhBtns"><button data-a="hint">给点提示</button><button data-a="quit">认输</button></div>` });
  const log = card.q('#fhLog'), msg = card.q('#fhMsg');
  const score = () => { card.q('#fhScore').textContent = `你 ${you} 句　山河 ${me} 句`; };
  const say = (who, line, src) => { log.insertAdjacentHTML('beforeend', `<p class="${who}"><b>${who === 'you' ? '你' : '山河'}</b><span>${G.hl(line, key)}</span><small>${esc(src)}</small></p>`); log.scrollTop = log.scrollHeight; };
  const fresh = () => pool.filter(x => !used.has(x.h));
  function end(win) {
    over = true;
    const beat = target != null && you > target;
    ui.stamp(win || beat ? '胜' : '败', win || beat ? '你赢了' : '山河胜');
    (win || beat ? A.cheer : A.wrong)();
    card.q('#fhIn').innerHTML = '';
    msg.innerHTML = `${win ? '山河想不出来了——' : ''}这一局你接了 <b>${you}</b> 句${target != null ? (beat ? `，赢了${esc(from || '对方')}的 ${target} 句！` : `，${esc(from || '对方')}是 ${target} 句，差一点。`) : '。'}`;
    card.q('#fhBtns').innerHTML = '<button data-a="again">再来一局</button><button class="go" data-a="dare">发起挑战</button>';
    card.q('[data-a=again]').onclick = () => SH.feat.feihua();
    card.q('[data-a=dare]').onclick = () => dare(key, you);
  }
  function myTurn() {
    if (over) return;
    const c = fresh().filter(x => x.h.length >= 5), famous = c.filter(x => x.P.p);       // 山河只说五字以上的整句
    if (me >= stamina || !c.length) return end(true);
    const x = G.pick(famous.length && Math.random() < 0.85 ? famous : c);                 // 多半用诗库里的名句，偶尔冷门
    used.add(x.h); me++; say('me', x.s, `${G.name(x.P)} · ${x.P.a}`); A.poem(); score();
  }
  function youSay(v) {
    if (over) return;
    const h = G.han(v);
    if (!h.includes(key)) { msg.textContent = `要带“${key}”字哦`; return; }
    if (h.length < 4) { msg.textContent = '太短了，至少四个字'; return; }
    if ([...used].some(u => u === h || (h.length >= 5 && (u.includes(h) || h.includes(u))))) { msg.textContent = '这句已经说过了'; return; }
    const hit = G.lines.find(x => x.h === h) || G.lines.find(x => x.h.includes(key) && h.length >= 5 && (x.h.includes(h) || h.includes(x.h)));
    used.add(hit ? hit.h : h); you++; msg.textContent = '';
    say('you', hit ? hit.s : v.trim(), hit ? `${G.name(hit.P)} · ${hit.P.a}` : '诗库里没查到出处，姑且算你过');
    card.q('#fhIn input').value = ''; score();
    if (target != null && you > target) { end(false); return; }
    setTimeout(myTurn, 900);
  }
  ui.inputRow(card, '#fhIn', { placeholder: `说一句带“${key}”的诗`, onSubmit: youSay });
  card.q('[data-a=hint]').onclick = () => { const c = fresh().filter(x => x.P.p); if (c.length) { const x = G.pick(c); msg.textContent = `提示：${G.name(x.P)}里有一句，开头是“${x.s.slice(0, 2)}”`; } };
  card.q('[data-a=quit]').onclick = () => end(false);
  score();
}
function dare(key, n) {                                                                   // 挑战链接：#fh= 编进字、句数、名字
  const card = ui.modal({ title: '发 起 挑 战', html: `<p class="sub">你用“${esc(key)}”字接了 ${n} 句。把链接发给朋友，看他能不能超过你。</p><div class="irow"><input type="text" id="fhName" maxlength="8" placeholder="你的名字（可不填）"></div><div class="btns"><button class="go" data-a="ok">复制挑战链接</button></div><p class="tip" id="fhTip"></p>` });
  const inp = card.q('#fhName'); inp.value = S.name || SH.store.get('name', '');
  card.q('[data-a=ok]').onclick = () => {
    const w = inp.value.replace(/[\s\u0000-\u001f<>]/g, '').slice(0, 8), url = SH.share.base() + '#fh=' + SH.b64e({ k: key, n, w });
    if (w) SH.store.set('name', w);
    SH.share.copy(url); card.q('#fhTip').textContent = navigator.share ? '' : '链接已复制，发给朋友吧';
    if (navigator.share) navigator.share({ title: '山河长卷 · 飞花令', text: `${w || '我'}用“${key}”字接了 ${n} 句诗，你敢来吗？`, url }).catch(() => {});
  };
}
SH.feat.feihua = () => {
  const card = ui.modal({ title: '飞 花 令', html: `<p class="sub">挑一个字，和山河轮流说带这个字的诗。</p><div class="chips fhKeys">${KEYS.map(k => `<button class="chip" data-k="${k}">${k}</button>`).join('')}<button class="chip" data-k="?">随机</button></div>` });
  card.qa('[data-k]').forEach(b => { b.onclick = () => feihua(b.dataset.k === '?' ? G.pick(KEYS) : b.dataset.k); });
};
// 收到挑战：开卷前先写战书，展卷就开局
const F = (() => {
  const f = SH.Q.has('fh') && SH.b64d(SH.Q.get('fh'));
  if (!f || typeof f !== 'object' || typeof f.k !== 'string' || !/^[一-鿿]$/.test(f.k) || !Number.isInteger(f.n)) return null;
  return { k: f.k, n: Math.max(0, Math.min(99, f.n)), w: typeof f.w === 'string' ? f.w.replace(/[\u0000-\u001f<>]/g, '').slice(0, 8) : '' };
})();
if (F && !SH.gift) {
  document.body.classList.add('gift');
  const el = $('giftLine');
  el.innerHTML = `<b>${esc(F.w || '有人')}</b> 用“<b>${esc(F.k)}</b>”字接了 ${F.n} 句诗<span class="gp">向你发起<em>飞花令</em>挑战</span>`;
  el.hidden = false; $('introLines').hidden = true;
  SH.hook('opened', () => setTimeout(() => feihua(F.k, F.n, F.w), 1600));
}

// ---------- 看画猜诗：照一首诗的配方变出画来，四个诗题里挑一个 ----------
let streak = 0;
const recent = [];
function hidePoem() { const el = $('poem'); el.style.opacity = '0'; el.innerHTML = ''; SH.poems.cur = null; }
SH.feat.guess = () => {
  const pool = DB.poems.filter(p => (p.p && p.p.length) || (p.w && p.w.length) || p.need);
  const c = pool.filter(p => !recent.includes(p)), p = G.pick(c.length ? c : pool);
  recent.push(p); if (recent.length > 12) recent.shift(); G.answer = p;                 // G.answer 给验收脚本用
  const differs = q => q !== p && G.name(q) !== G.name(p) && (!q.s || !p.s || !q.s.some(x => p.s.includes(x)) || (q.p || [])[0] !== (p.p || [])[0]);
  const opts = G.shuffle([p, ...G.shuffle(pool.filter(differs)).slice(0, 3)]);
  hidePoem(); SH.poems.timer = 99; ui.modeBar(null); ui.toast('看 画 猜 诗');
  D.stage(p, () => { hidePoem(); D.cue(p); setTimeout(() => ask(p, opts), 4200); });
};
function ask(p, opts) {
  SH.poems.timer = 99;
  const card = ui.modal({ title: '看 画 猜 诗', see: true, html: `<p class="sub">画里藏着哪首诗？${streak ? `（已连对 ${streak} 题）` : ''}</p><div class="opts">${opts.map((o, i) => `<button data-i="${i}"><b>${esc(G.name(o))}</b><small>${esc(o.a)}</small></button>`).join('')}</div><p class="res" id="gRes"></p>` });
  const again = () => { ui.modeBar('再猜一首？', () => SH.feat.guess(), '再来'); setTimeout(() => { const b = $('modebar'); if (b && b.textContent.includes('再猜一首')) ui.modeBar(null); }, 9000); };
  card.qa('.opts button').forEach(b => {
    b.onclick = () => {
      if (opts[+b.dataset.i] === p) { streak++; ui.close(); ui.stamp('对', streak > 1 ? `连对 ${streak} 题` : '猜中了'); A.cheer(); SH.poems.show(p, { quiet: true }); setTimeout(again, 2400); return; }
      streak = 0; A.wrong(); b.classList.add('wrong');
      card.qa('.opts button').forEach(x => { x.disabled = true; if (opts[+x.dataset.i] === p) x.classList.add('right'); });
      card.q('#gRes').innerHTML = `不对哦，是《${esc(G.name(p))}》。`;
      setTimeout(() => { ui.close(); SH.poems.show(p, { quiet: true }); again(); }, 1800);
    };
  });
}

// ---------- 玩法总览：百宝箱的目录 + 画上能点的地方 + 快捷键 ----------
SH.feat.help = () => {
  const install = SH.pwa.section();
  const groups = ui.catalog.map(([g, items]) => `<h3>${esc(g)}</h3>` + items.map(([, , name, desc]) => `<p><b>${esc(name)}</b>　${esc(desc)}</p>`).join('')).join('');
  ui.modal({ title: '玩 法 总 览', wide: true, html: `<div class="help"><h3>画 上 点 一 点</h3><p>点天空：白天惊起飞鸟，夜里放一盏孔明灯</p><p>点山间：种一棵会长大的树</p><p>点水面：跃出一尾锦鲤　　点水中小洲：惊起一滩鸥鹭</p><p>按住拖动、滚轮：在长卷里穿行</p>${groups}${install}<h3>没 有 声 音 ？</h3><p>看看手机媒体音量（放首歌时按音量键调的那个）；轻点一下画面；在微信里打开的，也可以点右上角“…”换浏览器打开。</p><h3>快 捷 键</h3><p class="muted">1–4 四季 · N 晨昏 · D 召龙 · P 吟诗 · B 百宝箱 · G 赠画 · X 看见数学 · S 落款 · M 声音 · F 全屏 · H 隐藏界面 · 空格 行止</p></div>` });
};
})();

</script>
